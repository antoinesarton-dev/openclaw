; les conversions oui.\n\n⚠️ Nuance : une vanity metric peut être un *symptôme* utile (beaucoup de vues, zéro vente = problème\nen aval). Ne l'ignore pas totalement — mais ne la prends jamais pour un but.\n\n## 2. Penser en funnel\n\nChaque parcours est un entonnoir : beaucoup entrent en haut, peu convertissent en bas. Exemple feeds\ncourts → boutique :\n\n```\nImpressions (vues)\n   → Rétention (complétion) ......... % qui regardent jusqu'au bout\n      → Engagement (send, save, clic profil)\n         → Clic vers la boutique\n            → Vue produit\n               → Ajout panier\n                  → Achat\n```\n\n**Le principe qui vaut de l'or :** à chaque étape, un *taux de passage* vers la suivante. Ton\nproblème est là où le taux **chute le plus**. Optimiser ailleurs ne sert à rien. Exemples de\ndiagnostic :\n- Beaucoup de vues, peu de rétention → problème de **hook/contenu** (fiches 03-04).\n- Bonne rétention, peu de clics → problème d'**appel à l'action / d'intention**.\n- Beaucoup de clics, peu d'achats → problème d'**offre ou de page** (fiches 08-12).\n\nRegarder le chiffre final (ventes) sans le funnel, c'est savoir qu'on est malade sans savoir où.\n\n## 3. Choisir LA métrique nord (selon l'objectif)\n\nTu ne peux pas tout optimiser. Choisis **une** métrique-boussole par objectif :\n- Objectif notoriété/haut de funnel → **taux de partage/send** (fiche 09), pas les vues.\n- Objectif acquisition → **coût par acquisition (CPA)** et taux de conversion.\n- Objectif rétention/communauté → **taux de retour / engagement récurrent**.\n\nUne seule boussole à la fois évite de courir dans 5 directions. Les autres chiffres sont des\ninstruments de bord, pas le cap.\n\n## 4. Attribuer sans se mentir (bases)\n\nSavoir *ce qui* a amené une vente est dur (les gens voient un TikTok, cherchent sur Google, achètent\n2 jours après). Outils honnêtes pour un solo :\n- **Codes promo / liens traçables** par créateur/canal (fiche 29) — imparfait mais concret.\n- La question **« comment avez-vous connu ? »** au checkout — déclaratif, biaisé, mais utile.\n- Ne sur-interprète pas : en petit volume, le hasard domine (fiche 31). Cherche des *tendances*, pas\n  des certitudes sur 10 ventes.\n\n## Explique-moi (Feynman)\n\nExplique pourquoi « ma vidéo a fait 100k vues » ne te dit pas si ta campagne marche, et quelle\nquestion de funnel tu poserais juste après.\n\n## Quiz génératif\n\n1. Donne 2 vanity metrics et 2 métriques actionnables, et le test qui les sépare.\n2. Ta vidéo cartonne (vues + rétention) mais tu ne vends rien. Où est probablement le goulot, et où\n   n'iras-tu *pas* chercher ?\n3. Pour un objectif « faire connaître la boutique », quelle métrique-boussole choisis-tu et pourquoi\n   pas les vues ?\n4. Pourquoi ne faut-il pas conclure grand-chose de l'attribution sur 10 ventes ?\n\n## Cartes de rappel → `revision-espacee.md`\n\n- Test vanity : « si ce chiffre double, je sais quoi changer ? » Non → vanité.\n- Funnel : le problème est là où le taux de passage chute le plus ; optimiser ailleurs = inutile.\n- Une seule métrique-boussole par objectif.\n- Attribution : codes traçables + « comment avez-vous connu », sans sur-interpréter le petit volume.\n"},{"id":"31","kind":"fiche","num":"31","title":"Data 2 : lire un A/B test sans se mentir","group":"Parcours (ordre conseillé)","icon":"🧠","tag":"Théorie","timeless":true,"volatile":false,"md":"# Fiche 31 — Data 2 : lire un A/B test sans se mentir\n\n- **Type :** 🧠 Théorie · **Nature :** ⏳ Intemporel · **Durée :** ~1 h · **Prérequis :** Fiche 30\n- **Terrain :** —\n\n## Objectifs\n\n1. Comprendre pourquoi la plupart des « tests » de petit compte ne prouvent rien.\n2. Connaître les 4 pièges statistiques qui te font tirer de fausses conclusions.\n3. Savoir quand une différence est un signal vs du bruit.\n\n## 1. Le principe d'un A/B test\n\nTu changes **une** variable (le hook, la miniature, le prix, le CTA) entre deux versions et tu\nmesures laquelle performe mieux sur *une* métrique actionnable (fiche 30). But : remplacer l'opinion\n(« je pense que ce hook est meilleur ») par la preuve (« A convertit mieux que B »).\n\nRègle d'or : **une seule variable à la fois.** Si tu changes le hook *et* le visuel *et* l'heure, tu\nne sauras jamais ce qui a causé la différence. La discipline de l'isolement est ce qui sépare un test\nd'une impression.\n\n## 2. Le problème n°1 du solo : la taille d'échantillon\n\nUne différence sur **petit volume ne prouve rien.** « Version A : 3 ventes, version B : 1 vente » ne\nveut *rien* dire — c'est dans le bruit du hasard. Il faut assez d'observations pour que la différence\nsoit peu susceptible d'être due à la chance (c'est la **significativité statistique**).\n\nSans faire de maths lourdes, retiens l'intuition :\n- Plus l'effet est petit, plus il faut d'échantillon pour le détecter.\n- Sur 20 ou 50 événements, seules des différences **énormes** sont crédibles ; les petites sont du\n  bruit.\n- En petit budget, tu testeras souvent des choses à **fort effet** (un hook radicalement différent),\n  justement parce que tu ne peux pas détecter les petits effets. C'est une stratégie, pas un défaut.\n\n## 3. Les 4 pièges qui te font mentir\n\n1. **Survivorship bias.** Tu étudies les gagnants (les vidéos virales, les comptes à succès) et tu\n   copies leurs traits — en ignorant les milliers qui ont fait pareil et échoué. Le trait « visible »\n   n'est peut-être pas la cause. Antidote : demande « qu'ont fait ceux qui ont *échoué* en faisant\n   pareil ? ».\n2. **Cherry-picking.** Tu retiens le test qui confirme ton idée et tu oublies les autres. Antidote :\n   décide *à l'avance* de la métrique et du critère de succès, avant de voir les résultats.\n3. **Corrélation ≠ causalité.** « J'ai posté à 18 h et ça a marché » → ce n'est peut-être pas\n   l'heure, mais le contenu, le sujet, un partage chanceux. Antidote : ne change qu'une variable,\n   répète.\n4. **Regression to the mean.** Après un post exceptionnel (haut ou bas), le suivant tend à revenir\n   vers ta moyenne — pas parce que tu as « perdu la main » ou « trouvé la formule », mais par simple\n   statistique. Antidote : juge sur des séries, pas sur un pic.\n\n## 4. Quand agir malgré l'incertitude\n\nTu n'auras presque jamais de certitude statistique parfaite en solo. La bonne posture :\n- Cherche des **effets gros et répétés**, pas des micro-différences.\n- Fais des **paris révisables** : décide, mesure, garde ou jette — vite et souvent (fiche 34,\n  testing créatif).\n- Accepte que beaucoup de « victoires » soient du bruit. L'humilité statistique est une compétence,\n  pas une faiblesse : elle t'évite de construire sur du sable.\n\n## Explique-moi (Feynman)\n\nExplique à voix haute pourquoi « Version A a fait 3 ventes, Version B en a fait 1, donc A est\nmeilleure » est probablement faux, avec le mot « hasard ».\n\n## Quiz génératif\n\n1. Pourquoi ne changer qu'une variable à la fois ? Que perds-tu si tu en changes trois ?\n2. Un compte viral fait « du contenu brut authentique ». Quel biais te guette si tu copies ça\n   aveuglément, et quelle question corrige le tir ?\n3. Tu postes ton meilleur contenu de l'année, le suivant fait moins bien. Deux explications : « j'ai\n   perdu la main » ou la statistique. Laquelle et pourquoi ?\n4. Sur 30 ventes, tu vois +1 vente pour le prix à 24 € vs 19 €. Conclusion raisonnable ?\n\n## Cartes de rappel → `revision-espacee.md`\n\n- Une seule variable par test ; petit volume = pas de preuve (bruit).\n- 4 pièges : survivorship, cherry-picking, corrélation≠causalité, régression vers la moyenne.\n- En solo : tester des effets gros, faire des paris révisables, accepter que beaucoup de « wins » soient du bruit.\n"},{"id":"32","kind":"fiche","num":"32","title":"Analyser un funnel & décider quoi tester","group":"Parcours (ordre conseillé)","icon":"🛠️","tag":"Pratique","timeless":true,"volatile":false,"md":"# Fiche 32 — Analyser un funnel & décider quoi tester 🛠️\n\n- **Type :** 🛠️ Pratique · **Nature :** ⏳ Intemporel · **Durée :** ~1 h · **Prérequis :** Fiches 30, 31\n- **Terrain :** InvoiceLab (ou boutique)\n\n## L'exercice\n\nTu prends un funnel (réel si tu as des chiffres, sinon des chiffres plausibles que tu poses) et tu\nfais le travail d'un vrai analyste : trouver le goulot, décider **un seul** test, et écrire son\nprotocole.\n\n### Livrable 1 — Le funnel chiffré\n\nDessine le funnel d'InvoiceLab (ou de la boutique) avec un taux de passage à chaque étape. Ex pour\nInvoiceLab :\n\n```\nVues vidéo courte : 10 000\n → clics profil/bio : 300 (3 %)\n   → visites landing : 200 (67 %)\n     → essais (facture créée) : 60 (30 %)\n       → passage Pro : 3 (5 %)\n```\n\nMarque **l'étape où le taux chute le plus** (le goulot). Justifie en une phrase pourquoi c'est *là*\nqu'il faut agir et pas ailleurs (fiche 30).\n\n### Livrable 2 — La décision de test\n\n- **Une seule hypothèse**, formulée proprement : « Si je change [X], alors [métrique] passera de [a]\n  à [b], parce que [raison psycho/algo] ». (X = une seule variable, fiche 31.)\n- **La métrique de succès décidée à l'avance** et le seuil (pour éviter le cherry-picking).\n- **La taille d'échantillon minimale** que tu attends avant de conclure (ordre de grandeur : assez\n  pour que ce ne soit pas du bruit, fiche 31).\n- **Ce que tu feras** si A gagne / si B gagne / si c'est trop serré.\n\n## Grille de notation (/20)\n\n| Axe | Ce que je regarde |\n|---|---|\n| **Spécificité** | Taux chiffrés, goulot identifié précisément, hypothèse concrète |\n| **Mécanique** | Bon goulot (le plus gros drop) ; une seule variable ; métrique + seuil fixés *avant* |\n| **Clarté** | Le protocole est exécutable tel quel |\n| **Adéquation** | Le test attaque le vrai levier du projet, pas un détail cosmétique |\n\nColle les 2 livrables dans `journal-de-progression.md`. Je vérifie surtout que tu attaques **le bon\ngoulot** (l'erreur n°1 : optimiser une étape déjà bonne) et que ton test isole une variable.\n\n## Anti-triche\n\n- Ne choisis pas le goulot « le plus facile à corriger » : choisis **celui qui perd le plus de\n  monde**. C'est tout l'enjeu.\n- Fixe ta métrique de succès **avant** de fantasmer le résultat, sinon tu te prépares un\n  cherry-picking (fiche 31).\n\n## Explique-moi (Feynman)\n\nMontre ton funnel et explique en une phrase pourquoi améliorer l'étape que tu as choisie aura plus\nd'impact que d'améliorer n'importe quelle autre.\n\n## Cartes de rappel → `revision-espacee.md`\n\n- Trouver le goulot = la plus grosse chute de taux, pas le plus facile à corriger.\n- Hypothèse = une variable + métrique + seuil décidés avant le test.\n- Prévoir la décision (garder/jeter) à l'avance.\n"},{"id":"33","kind":"fiche","num":"33","title":"Media buying 1 : structure & seuil de rentabilité","group":"Parcours (ordre conseillé)","icon":"🧠","tag":"Théorie","timeless":false,"volatile":true,"md":"# Fiche 33 — Media buying 1 : structure & seuil de rentabilité\n\n- **Type :** 🧠 Théorie · **Nature :** ⚡ VOLATILE (valide au : 17/07/2026 — re-vérifier tous les 3 mois) · **Durée :** ~1 h · **Prérequis :** Fiches 10, 30\n- **Terrain :** Boutique canicule\n\n## Objectifs\n\n1. Calculer ton seuil de rentabilité *avant* de dépenser un euro.\n2. Comprendre la structure d'un compte Meta/TikTok à petit budget en 2026.\n3. Savoir ce que l'algo de pub veut (et pourquoi le combattre coûte cher).\n\n## 1. La règle qui te sauve : le seuil de rentabilité\n\nAvant toute pub, calcule ton **ROAS de seuil** (Return On Ad Spend au point mort) :\n\n```\nROAS de seuil = 1 ÷ marge brute\n```\n\nExemple : produit vendu 30 €, coût produit + livraison 18 € → marge brute = 12 €/30 € = 0,40.\nROAS de seuil = 1 ÷ 0,40 = **2,5**. En dessous de 2,5× de retour sur dépense pub, **tu perds de\nl'argent**. Au-dessus, tu gagnes. Ce chiffre est ta ligne de flottaison — tu le calcules d'abord,\ntu le suis en permanence.\n\nRepères 2026 (⚡ estimations) : ROAS moyen Meta ~2–4×, TikTok Ads ~1,4× (mais discovery). Traduction :\nsur TikTok, ta marge doit être solide pour être rentable ; Meta est plus « sûr » pour la conversion\ndirecte. Tes chiffres réels priment sur ces moyennes.\n\n⚠️ **Dropshipping petit budget = marge serrée = peu de droit à l'erreur.** Chaque euro de pub doit\nêtre surveillé. C'est là que 90 % des débutants se brûlent : ils regardent les ventes, pas le ROAS,\net perdent de l'argent en « vendant ».\n\n## 2. La structure de compte à petit budget (2026)\n\n- **Meta Advantage+** est devenu le défaut e-commerce (souvent +12–25 % de ROAS vs campagnes\n  manuelles) *à condition* de le nourrir de **diversité créative** (6–10 variantes). Il automatise le\n  ciblage — ton job devient le créatif, pas le réglage d'audience.\n- **TikTok** : minimum ~20 $/jour/ad group ; démarre petit, scale sur les créas qui marchent.\n- **Ne sur-segmente pas** en petit budget : trop d'ad sets = budget éparpillé = jamais assez de\n  données pour sortir de la phase d'apprentissage. Peu de campagnes, bien nourries.\n\n## 3. Ce que l'algo de pub veut (et pourquoi lui obéir)\n\nLes plateformes optimisent pour *leur* objectif si tu le leur dis clairement : donne-leur un **signal\nde conversion propre** (pixel/événement d'achat bien configuré) et **assez de budget/temps pour\napprendre** (la « phase d'apprentissage » a besoin d'un volume d'événements). Les erreurs classiques :\n- Couper une campagne trop tôt (avant la fin de l'apprentissage) → tu jettes de l'argent sans\n  conclusion (fiche 31 : petit échantillon).\n- Trop bidouiller (changer le budget/ciblage chaque jour) → tu la relances en apprentissage sans\n  cesse.\n\nLe levier n'est **pas** le micro-réglage. Le levier, c'est le **créatif** (fiche 34).\n\n## 4. Le vrai levier : le débit créatif\n\nFait 2026 majeur et sourcé : passer de 5 à 40 créas actives/mois peut **doubler le ROAS à budget\nconstant** ; un créa gagnant tient rarement plus de **7–10 jours** avant de fatiguer. Conséquence\nstratégique pour toi (rappel fiche : instantané §2) :\n\n> **Ton budget n'est pas ton levier. Ta capacité à produire beaucoup de créatifs testables l'est.**\n\nD'où l'importance de l'UGC (fiche 28) et du workflow IA-humain (fiche 21) : ils alimentent ta machine\nà créas. Un petit budget + beaucoup de créas bat un budget moyen + 3 créas figées.\n\n## Explique-moi (Feynman)\n\nCalcule à voix haute le ROAS de seuil d'un produit à 25 € avec 15 € de coût. En dessous de combien\nperds-tu de l'argent ? Pourquoi « faire des ventes » ne veut pas dire « gagner de l'argent » ?\n\n## Quiz génératif\n\n1. Ton produit : 40 € prix, 24 € de coût. ROAS de seuil ? En dessous, que se passe-t-il ?\n2. Pourquoi sur-segmenter en petit budget est-il contre-productif ?\n3. Pourquoi couper une campagne au bout de 2 jours est-il souvent une erreur (relie à la fiche 31) ?\n4. « Le budget n'est pas le levier, le débit créatif l'est. » Explique avec les chiffres 5→40 créas et\n   7–10 jours.\n\n## Cartes de rappel → `revision-espacee.md`\n\n- ROAS de seuil = 1 ÷ marge brute → à calculer AVANT de dépenser ; suivre le ROAS, pas les ventes.\n- Petit budget : peu de campagnes bien nourries, Advantage+ nourri de 6–10 créas, ne pas sur-segmenter.\n- Donner à l'algo un signal de conversion propre + du temps d'apprentissage ; ne pas sur-bidouiller.\n- Le vrai levier = débit créatif (5→40 créas peut doubler le ROAS ; un créa dure 7–10 j).\n"},{"id":"34","kind":"fiche","num":"34","title":"Media buying 2 : testing créative-first, kill/scale","group":"Parcours (ordre conseillé)","icon":"🧠","tag":"Théorie","timeless":false,"volatile":true,"md":"# Fiche 34 — Media buying 2 : testing créative-first, kill/scale\n\n- **Type :** 🧠 Théorie · **Nature :** ⚡ VOLATILE (valide au : 17/07/2026 — re-vérifier tous les 3 mois) · **Durée :** ~1 h · **Prérequis :** Fiche 33\n- **Terrain :** Boutique canicule\n\n## Objectifs\n\n1. Mettre en place un système de test créatif adapté à un petit budget.\n2. Décider objectivement quand *tuer* et quand *scaler* une pub.\n3. Éviter les erreurs de scaling qui font s'effondrer le ROAS.\n\n## 1. Le test créatif comme cœur du réacteur\n\nPuisque le levier est le créatif (fiche 33), ton compte pub est d'abord une **machine à tester des\ncréas**. Le principe : tu ne pries pas pour qu'une pub marche, tu **industrialises** la découverte de\ncelles qui marchent.\n\nStructure simple petit budget :\n- Une campagne de test avec plusieurs créas (angles/hooks/formats différents — pas des variantes\n  cosmétiques).\n- Tu laisses tourner assez longtemps/assez de budget pour avoir un signal (fiche 31 : pas de\n  conclusion sur 2 clics).\n- Tu **tues** les perdants, tu **scales** les gagnants, tu **réalimentes** en nouvelles créas en\n  continu (car un gagnant meurt en 7–10 j, fiche 33).\n\n## 2. La hiérarchie de diagnostic (quelle métrique lit quoi)\n\nUne pub qui ne convertit pas a un problème *localisable* (comme un funnel, fiche 30) :\n\n| Symptôme | Métrique | Cause probable | Action |\n|---|---|---|---|\n| Personne ne s'arrête | CTR faible, taux de vue 3 s bas | **Créa/hook** faible (fiche 03) | Nouvelle créa/hook |\n| On clique mais on n'achète pas | CTR ok, conversion basse | **Offre ou page** (fiches 08-12) | Retravailler offre/landing |\n| Ça convertit mais trop cher | CPA > seuil | Ciblage/enchère/saturation | Ajuster ou tuer |\n| Ça marchait, ça se dégrade | ROAS qui baisse dans le temps | **Fatigue créative** | Rafraîchir la créa |\n\nLire *où* ça casse t'évite de tuer une bonne pub pour un mauvais motif (ex. tuer une créa géniale à\ncause d'une page pourrie).\n\n## 3. Quand tuer (kill)\n\nRègles de décision (à fixer *avant*, fiche 31) :\n- **Seuil de dépense sans conversion** : ex. « si une créa dépense ~2× le prix du produit sans un\n  seul achat, je la coupe. » (Le seuil dépend de ta marge, fiche 33.)\n- **CPA au-dessus du seuil de rentabilité** de façon stable (pas sur 1 jour) → kill.\n- Ne tue pas sur le **bruit** (fiche 31) : donne un minimum de budget/temps, mais pas indéfiniment.\n  Le kill discipliné protège ta trésorerie.\n\n## 4. Quand et comment scaler\n\nUne créa au ROAS > seuil, stable → scaler. Mais **le scaling casse souvent ce qui marchait** :\n- **Scaling trop brutal** : doubler le budget d'un coup relance la phase d'apprentissage et peut faire\n  chuter le ROAS. Préfère des hausses **progressives** (⚡ pratiques variables, souvent ~20 % à la\n  fois) — ou duplique.\n- **Saturation d'audience** : à force de dépenser, tu re-montres la même pub aux mêmes gens → la\n  fréquence monte, le ROAS baisse. Réponse : nouvelles créas (toujours le créatif), élargir.\n- **Le mirage du gagnant éternel** : aucune créa ne scale à l'infini. Scaler = surtout **empiler des\n  gagnants successifs**, pas pousser un seul très fort.\n\n## 5. Le garde-fou : petit budget = tests petits, décisions froides\n\nTu n'as pas le luxe de « laisser tourner pour voir ». Chaque euro compte. La discipline (seuils fixés\nà l'avance, kill sans état d'âme, réalimentation créative constante) est ce qui te garde rentable.\nL'émotion (« encore un jour, ça va peut-être remonter ») est l'ennemie du petit budget.\n\n## Explique-moi (Feynman)\n\nUne pub a un bon CTR mais zéro vente. Explique pourquoi tuer la *créa* serait une erreur, et où tu\nregardes à la place.\n\n## Quiz génératif\n\n1. Associe chaque symptôme à sa cause : (a) CTR bas, (b) clics sans achat, (c) ROAS qui décline.\n2. Quelle règle de kill fixes-tu *avant* de lancer, et pourquoi « avant » ?\n3. Pourquoi doubler brutalement le budget d'un gagnant peut-il casser son ROAS ?\n4. « Scaler, c'est empiler des gagnants successifs. » Explique pourquoi, avec la fatigue créative.\n\n## Cartes de rappel → `revision-espacee.md`\n\n- Le compte pub = machine à tester des créas (angles différents), réalimentée en continu.\n- Diagnostic : CTR bas → créa/hook ; clics sans achat → offre/page ; ROAS qui baisse → fatigue créative.\n- Kill : seuils fixés avant, pas sur le bruit ; froid et discipliné.\n- Scale : progressif, méfiance de la saturation, empiler des gagnants > pousser un seul.\n"},{"id":"35","kind":"fiche","num":"35","title":"Plan de test payant chiffré","group":"Parcours (ordre conseillé)","icon":"🛠️","tag":"Pratique","timeless":false,"volatile":true,"md":"# Fiche 35 — Plan de test payant chiffré 🛠️\n\n- **Type :** 🛠️ Pratique · **Nature :** ⚡ (calé sur 2026) · **Durée :** ~1 h · **Prérequis :** Fiches 33, 34\n- **Terrain :** Boutique canicule\n\n## L'exercice\n\nConstruis un **plan de test payant complet et chiffré** pour lancer le produit canicule avec un\npetit budget (ex. **150 €**). Objectif : un plan qu'un vrai media buyer validerait, avec des critères\nde décision fixés *avant*.\n\n### Livrable — le plan\n\n1. **Les chiffres de base :**\n   - Prix de vente, coût produit + livraison, **marge brute**, **ROAS de seuil** (1 ÷ marge, fiche 33).\n   - Budget total et sa répartition (test vs éventuel scale).\n2. **La structure de campagne :** plateforme(s) choisie(s) et pourquoi (fiche 33), nombre de créas,\n   budget/jour, durée de la phase de test.\n3. **Les créas à tester :** liste **3–5 angles différents** (pas des variantes) — décris hook +\n   format de chacun (UGC, démo, contre-intuitif…, fiches 03/28). C'est ton vrai levier.\n4. **Les critères de décision, fixés à l'avance :**\n   - Seuil de **kill** (ex. « X € dépensés sans achat → coupe »).\n   - Seuil de **scale** (ex. « ROAS > seuil stable sur N jours → +20 % »).\n   - La **métrique** que tu regardes en priorité (fiche 30) et à quelle fréquence.\n5. **Ce que tu apprends même si tu perds** : quel enseignement tu tires de chaque scénario (le test\n   sert à *apprendre*, pas juste à vendre).\n\n## Grille de notation (/20)\n\n| Axe | Ce que je regarde |\n|---|---|\n| **Spécificité** | Vrais chiffres (marge, ROAS de seuil, budgets), pas du flou |\n| **Mécanique** | ROAS de seuil correct ; test créative-first (angles variés) ; kill/scale fixés avant |\n| **Clarté** | Le plan est exécutable tel quel, décisions non ambiguës |\n| **Adéquation** | Réaliste pour 150 € et une marge dropshipping ; pas de sur-segmentation |\n\nColle le plan dans `journal-de-progression.md`. Je vérifie surtout ton **ROAS de seuil** (l'erreur qui\ncoûte de l'argent) et que tes critères kill/scale sont **chiffrés et antérieurs**, pas « au feeling ».\n\n## Anti-triche\n\n- Si tu ne connais pas ta marge, **invente des chiffres plausibles mais calcule vraiment** le ROAS de\n  seuil. Le but est de maîtriser le calcul.\n- Tes critères kill/scale doivent être des **nombres**, pas « je verrai bien ». « Je verrai bien » =\n  0 sur l'axe Mécanique.\n- 150 €, ce n'est pas assez pour sur-segmenter : peu de campagnes, plusieurs créas.\n\n## Explique-moi (Feynman)\n\nExplique ton plan à voix haute comme si tu le défendais devant quelqu'un qui va te prêter les 150 € :\ncombien tu risques, à quel signal tu coupes, à quel signal tu remets. S'il y a une zone « au\nfeeling », comble-la.\n\n## Cartes de rappel → `revision-espacee.md`\n\n- Un plan payant commence par marge → ROAS de seuil, avant tout le reste.\n- Tester des angles variés (créative-first), pas des variantes ; peu de campagnes en petit budget.\n- Kill/scale = des nombres décidés AVANT ; le test sert à apprendre même en perdant.\n"},{"id":"36","kind":"fiche","num":"36","title":"Autorité personnelle : niche, POV, build in public","group":"Parcours (ordre conseillé)","icon":"🧠","tag":"Théorie","timeless":true,"volatile":true,"md":"# Fiche 36 — Autorité personnelle : niche, POV, build in public\n\n- **Type :** 🧠 Théorie · **Nature :** ⏳ Intemporel (principe) + ⚡ (tactiques plateforme) · **Durée :** ~1 h · **Prérequis :** Fiches 14, 17, 22\n- **Terrain :** InvoiceLab / toi\n\n## Objectifs\n\n1. Comprendre pourquoi l'autorité personnelle est l'avantage n°1 d'un solo sans budget.\n2. Construire un positionnement (niche + POV) qui te rend « le go-to » de ton sujet.\n3. Transformer ta constance en crédibilité cumulative.\n\n## 1. Pourquoi l'autorité, et pourquoi toi\n\nSans budget de marque, tu ne peux pas *acheter* de l'attention en continu. Mais tu peux en\n**mériter** une part durable en devenant une référence sur un sujet précis. L'autorité personnelle\nest un actif qui compose : chaque contenu utile s'ajoute au précédent, et la confiance accumulée\nréduit ton coût d'acquisition à zéro à terme (les gens viennent à toi). C'est le contraire de la pub :\ntu construis un capital, tu ne loues pas de l'attention.\n\nRappels qui convergent : profils perso > pages marque (fiche 22), prime à l'authenticité humaine\n(fiche 19), les gens achètent à des gens (fiche 14). Tout pousse vers : **construis TA crédibilité,\npas juste celle du produit.**\n\n## 2. Le positionnement : niche + point de vue (POV)\n\nDeux erreurs opposées tuent l'autorité : être **trop large** (« marketing », « entrepreneuriat » —\ntu es noyé, sans identité) ou n'avoir **aucun angle** (tu répètes le consensus — invisible).\n\n- **La niche :** un sujet assez étroit pour que tu puisses y être *le meilleur* visible. Pas\n  « productivité » mais « l'admin/facturation des auto-entrepreneurs FR ». Étroit ne veut pas dire\n  petit : ça veut dire *identifiable*. On te retient parce qu'on sait *pour quoi* tu existes.\n- **Le POV (point de vue) :** une conviction tranchée et défendable qui te distingue du consensus.\n  Pas « il faut bien facturer » (personne ne dira le contraire) mais « les logiciels de facturation\n  volent les données des freelances et les font payer pour un PDF — ça devrait être gratuit et\n  local ». Un POV crée des fans *et* des désaccords (fiche 09 : le débat se partage). Sans POV, tu es\n  du bruit poli.\n\nTest : peut-on résumer « [toi] = la personne qui pense/dit [X] sur [niche] » ? Si oui, tu as un\npositionnement. Sinon, tu es interchangeable.\n\n## 3. La constance : l'ingrédient que personne ne veut entendre\n\nL'autorité ne vient pas d'un post viral, mais de la **répétition sur la durée**. Les données\nfounder-led convergent : les meilleurs postent ~5×/semaine et **réutilisent leurs angles gagnants**\n(« être répétitif » est un mythe à abandonner — ton audience ne voit qu'une fraction de tes posts, et\nla répétition *installe* le message). La régularité fait trois choses :\n- Elle nourrit l'algorithme (fiches 22-23 : présence, fraîcheur).\n- Elle accumule des preuves de compétence (fiche 14).\n- Elle transforme des inconnus en audience familière (fiche 14, sympathie par exposition répétée).\n\nC'est là que le système (hub & spokes, fiche 25 ; workflow IA-humain, fiche 21) devient vital : sans\nsystème, tu ne tiens pas la constance, et sans constance, pas d'autorité.\n\n## 4. Build in public : le raccourci d'autorité du solo\n\nMontrer ta construction en temps réel (décisions, chiffres, ratés, apprentissages) coche tout :\n- **Réciprocité** (tu donnes des enseignements gratuits, fiche 13),\n- **Autorité** (tu prouves que tu fais, pas que tu commentes, fiche 14),\n- **Sympathie** (le parcours humain attache, fiche 14),\n- **Histoires** (un flux narratif infini, fiche 17).\n\nC'est particulièrement fort en tech/indie (X, fiche 23) et crédible en B2B (LinkedIn). Le risque :\ntomber dans le nombrilisme (fiche 17) — chaque « je » doit apporter un « tu » (un enseignement pour\nle lecteur).\n\n## Explique-moi (Feynman)\n\nFormule ton positionnement : « Je suis la personne qui pense [POV] sur [niche]. » Si tu ne peux pas\nle dire en une phrase tranchée, ton positionnement est trop large ou trop tiède — corrige-le.\n\n## Quiz génératif\n\n1. Pourquoi l'autorité personnelle « compose » alors que la pub « se loue » ? Qu'est-ce que ça change\n   pour un petit budget ?\n2. Donne un positionnement trop large, puis resserre-le en niche + POV pour InvoiceLab.\n3. Pourquoi « être répétitif » est-il un mythe à abandonner pour un créateur ?\n4. En quoi le build in public est-il un empilement de 4 leviers de persuasion ?\n\n## Cartes de rappel → `revision-espacee.md`\n\n- Autorité = actif qui compose (réduit le coût d'acquisition à terme), l'inverse de louer de la pub.\n- Positionnement = niche identifiable + POV tranché défendable ; test « je suis la personne qui pense X sur Y ».\n- Constance > viralité ; réutiliser ses angles gagnants (la répétition installe le message).\n- Build in public = réciprocité + autorité + sympathie + histoires ; garder un « tu » dans chaque « je ».\n"},{"id":"37","kind":"fiche","num":"37","title":"Plan fondateur 90 jours","group":"Parcours (ordre conseillé)","icon":"🛠️","tag":"Pratique","timeless":true,"volatile":true,"md":"# Fiche 37 — Plan fondateur 90 jours 🛠️\n\n- **Type :** 🛠️ Pratique · **Nature :** ⏳ Intemporel (cadre) + ⚡ (tactiques) · **Durée :** ~1 h · **Prérequis :** Fiches 22, 25, 36\n- **Terrain :** InvoiceLab / toi\n\n## L'exercice\n\nTu conçois **ton** plan de construction d'autorité sur 90 jours — un système que tu pourrais lancer\nlundi. C'est la synthèse opérationnelle des fiches 17, 21, 22-25, 36.\n\n### Livrable — le plan 90 jours\n\n1. **Positionnement (fiche 36) :** ta phrase « je suis la personne qui pense [POV] sur [niche] »,\n   + ta cible précise + la plateforme principale (fiche 25 : une seule, tenue).\n2. **Piliers de contenu (3–5 thèmes) :** les sujets récurrents que tu vas « posséder » (ex.\n   conformité facture FR, coulisses du build, opinions sur l'admin des indés, quick wins freelance).\n3. **Le système de production (fiche 21, 25) :** ton rythme (ex. 1 hub/semaine + N spokes/jour), ton\n   workflow IA-humain, comment tu ne t'épuises pas.\n4. **Le plan par phase :**\n   - **J1–30 — Fondation :** optimiser profil/bio (fiche 18), poster régulièrement, trouver ta voix,\n     mesurer ton créneau (fiche 22). Objectif : rythme + premiers repères, pas des résultats.\n   - **J31–60 — Traction :** doubler les formats qui prennent, engager activement (répondre,\n     commenter chez d'autres), premiers hubs. Objectif : engagement + premières conversations.\n   - **J61–90 — Conversion douce :** intégrer des appels à l'action vers InvoiceLab (fiche 13,\n     réciprocité d'abord), lancer une première boucle (fiche 27), mesurer le funnel (fiche 30).\n5. **Les métriques que tu suis (fiche 30) :** UNE boussole par phase (pas les followers bruts) + ce\n   que tu ignores volontairement.\n6. **Les règles anti-abandon :** que fais-tu les semaines sans motivation ? (la constance est le vrai\n   défi, fiche 36).\n\n## Grille de notation (/20)\n\n| Axe | Ce que je regarde |\n|---|---|\n| **Spécificité** | Positionnement tranché, piliers concrets, rythme chiffré |\n| **Mécanique** | Progression fondation→traction→conversion cohérente ; une plateforme ; métriques-boussoles, pas vanity |\n| **Clarté** | Exécutable lundi sans re-réfléchir ; rythme soutenable |\n| **Adéquation** | Réaliste pour un solo (temps réel dispo) ; cohérent avec la cible freelance FR |\n\nColle le plan dans `journal-de-progression.md`. Je note surtout le **réalisme du rythme** (un plan\nque tu ne tiendras pas 90 jours vaut zéro) et l'absence de vanity metrics comme objectif.\n\n## Anti-triche\n\n- Sois honnête sur ton **temps réel** disponible. Un plan « 3 vidéos/jour » que tu abandonnes en 10\n  jours est pire qu'un plan « 3 posts/semaine » tenu 90 jours. La constance bat l'ambition (fiche 36).\n- Une seule plateforme principale (fiche 25). Si tu en mets 3, tu prépares ton échec.\n\n## Explique-moi (Feynman)\n\nRegarde ton plan et demande : « est-ce que je tiendrai ça la semaine où je n'ai aucune envie ? » Si\nnon, allège-le maintenant. Un plan d'autorité est un pari sur la constance, pas sur l'inspiration.\n\n## Cartes de rappel → `revision-espacee.md`\n\n- Plan 90 j = positionnement + piliers + système + phases (fondation/traction/conversion) + 1 boussole/phase.\n- Une seule plateforme tenue ; rythme soutenable > rythme ambitieux abandonné.\n- Prévoir les règles anti-abandon : la constance est le vrai jeu.\n"},{"id":"38","kind":"fiche","num":"38","title":"Capstone : campagne intégrée réelle","group":"Parcours (ordre conseillé)","icon":"🛠️","tag":"Pratique de synthèse","timeless":false,"volatile":false,"md":"# Fiche 38 — Capstone : campagne intégrée réelle 🛠️\n\n- **Type :** 🛠️ Pratique de synthèse · **Nature :** Tout · **Durée :** ~5–6 h (étalées) · **Prérequis :** toutes les fiches\n- **Terrain :** Au choix (InvoiceLab OU boutique canicule)\n\n## Le projet final\n\nTu conçois — et si tu veux, tu **lances vraiment** — une **campagne intégrée complète** sur un\nprojet. C'est ici que tout converge : psychologie, offre, hook, plateforme, distribution, IA, data,\npaid, autorité. Ce n'est pas un exercice de plus : c'est la démonstration que tu sais *orchestrer*,\npas juste appliquer des briques isolées.\n\n## Le livrable — le dossier de campagne\n\n### 1. Stratégie (le pourquoi)\n- **Objectif unique** et sa **métrique-boussole** (fiche 30). Un seul.\n- **Cible** précise + **insight** central (le vrai problème que tu adresses).\n- **Positionnement/angle** (fiche 36).\n\n### 2. Offre (fiches 10-12)\n- L'offre complète : résultat, équation de valeur, garantie, prix/ancrage, rareté honnête.\n\n### 3. Message & création (fiches 03-09, 16-21)\n- 3–5 **hooks** (fiche 03/05) + le **récit** porteur (fiche 17).\n- Les **contenus** : décline 1 idée forte en formats (hub & spokes, fiche 25/26), pensés pour le\n  **send** (fiche 09), passés par ton **workflow IA-humain** (fiche 21).\n- Au moins un usage de **biais honnêtes** (fiches 13-15).\n\n### 4. Distribution (fiches 22-29)\n- Plateforme principale + rôle de chaque canal.\n- Plan organique (posts + première heure, fiche 24) **et/ou** plan **UGC/créateurs** (fiche 28-29).\n- Si paid : le **plan de test chiffré** avec ROAS de seuil + kill/scale (fiches 33-35).\n\n### 5. Mesure & itération (fiches 30-32)\n- Le **funnel** attendu avec les étapes et ce que tu mesures.\n- Ton **premier test** (une variable, métrique + seuil décidés avant, fiche 31-32).\n- Comment tu éviteras de te mentir (vanity, cherry-picking, petit échantillon).\n\n### 6. Éthique & durabilité (fiche 14)\n- Une phrase : en quoi cette campagne passe le test « le client serait-il content d'avoir su ce que\n  je sais ? »\n\n## Grille de notation (/20, exigence maximale)\n\n| Axe | Ce que je regarde |\n|---|---|\n| **Spécificité** | Tout est concret et chiffré ; rien ne pourrait décrire une autre marque |\n| **Mécanique** | Les briques s'**enchaînent** (l'offre nourrit le message qui nourrit la distribution qui se mesure) ; bons leviers partout |\n| **Clarté** | Un tiers comprendrait et pourrait exécuter la campagne |\n| **Adéquation** | Réaliste pour un solo petit budget ; cohérent de bout en bout ; éthique tenue |\n\nÀ ce stade, la barre monte : un capstone « correct » ne suffit pas. Je note dur, je pointe les\n**incohérences entre briques** (l'erreur de synthèse typique : une super offre mal distribuée, un\nsuper hook sur une mauvaise plateforme), et je te dis si tu es prêt à lancer.\n\nColle le dossier dans `journal-de-progression.md`. Si tu **lances réellement**, reviens y noter les\nrésultats à J+7 et J+30 : c'est là que la formation cesse d'être théorique.\n\n## Après le capstone\n\n- Passe en **mode entretien** : suis `revision-espacee.md` pour ancrer les fondamentaux `⏳`.\n- Suis `mise-a-jour.md` pour rafraîchir les fiches `⚡` (algos tous les 2–3 mois, etc.).\n- Refais un capstone tous les quelques mois sur une vraie campagne : c'est la pratique délibérée qui\n  te fera passer de « bon » à « excellent ».\n\n## Explique-moi (Feynman)\n\nAvant de rendre : raconte ta campagne en 60 secondes à voix haute, du problème client jusqu'à la\nmesure. Si une brique ne s'enchaîne pas naturellement avec la suivante dans ton récit, c'est une\nfaille de cohérence — répare-la.\n\n## Cartes de rappel → `revision-espacee.md`\n\n- Une campagne = des briques qui s'**enchaînent** (offre → message → distribution → mesure), pas une collection.\n- L'erreur de synthèse : exceller sur une brique et casser la chaîne ailleurs.\n- La vraie note vient du réel : résultats à J+7 / J+30 si tu lances.\n"}];
const SENT = "";

/* ---------------- Markdown renderer ---------------- */
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function inline(s){
  const codes=[];
  s = s.replace(/`([^`]+)`/g,function(m,c){ codes.push(c); return SENT+(codes.length-1)+SENT; });
  s = esc(s);
  s = s.replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>");
  s = s.replace(/\*([^*\n]+)\*/g,"<em>$1</em>");
  s = s.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  s = s.replace(new RegExp(SENT+"(\\d+)"+SENT,"g"),function(m,n){ return "<code>"+esc(codes[+n])+"</code>"; });
  return s;
}
function renderMd(src){
  const lines = src.replace(/\r/g,"").split("\n");
  let html="", i=0;
  const isSep = function(l){ return /^\s*\|?[\s:|-]*-[\s:|-]*\|?\s*$/.test(l) && l.indexOf("-")>=0; };
  const fence = function(l){ return l.slice(0,3)==="```"; };
  while(i<lines.length){
    let line = lines[i];
    if(fence(line)){
      let buf=[]; i++;
      while(i<lines.length && !fence(lines[i])){ buf.push(lines[i]); i++; }
      i++;
      html += "<pre><code>"+esc(buf.join("\n"))+"</code></pre>";
      continue;
    }
    if(line.indexOf("|")>=0 && i+1<lines.length && isSep(lines[i+1])){
      const head=line; i+=2;
      const body=[];
      while(i<lines.length && lines[i].indexOf("|")>=0 && lines[i].trim()!==""){ body.push(lines[i]); i++; }
      const cells = function(r){ return r.replace(/^\s*\|/,"").replace(/\|\s*$/,"").split("|").map(function(c){return c.trim();}); };
      let t='<div class="table-wrap"><table><thead><tr>';
      cells(head).forEach(function(c){ t+="<th>"+inline(c)+"</th>"; });
      t+="</tr></thead><tbody>";
      body.forEach(function(r){ t+="<tr>"; cells(r).forEach(function(c){ t+="<td>"+inline(c)+"</td>"; }); t+="</tr>"; });
      t+="</tbody></table></div>";
      html+=t; continue;
    }
    let h = line.match(/^(#{1,6})\s+(.*)$/);
    if(h){ const lv=h[1].length; html += "<h"+lv+">"+inline(h[2])+"</h"+lv+">"; i++; continue; }
    if(/^\s*(-{3,}|\*{3,})\s*$/.test(line)){ html+="<hr>"; i++; continue; }
    if(/^\s*>\s?/.test(line)){
      let buf=[];
      while(i<lines.length && /^\s*>\s?/.test(lines[i])){ buf.push(lines[i].replace(/^\s*>\s?/,"")); i++; }
      html += "<blockquote>"+renderMd(buf.join("\n"))+"</blockquote>";
      continue;
    }
    if(/^\s*[-*]\s+/.test(line)){
      let buf=[];
      while(i<lines.length && /^\s*[-*]\s+/.test(lines[i])){ buf.push(lines[i].replace(/^\s*[-*]\s+/,"")); i++; }
      html+="<ul>"+buf.map(function(x){return "<li>"+inline(x)+"</li>";}).join("")+"</ul>";
      continue;
    }
    if(/^\s*\d+\.\s+/.test(line)){
      const startNum = parseInt(line.match(/^\s*(\d+)\./)[1],10) || 1;
      let buf=[];
      while(i<lines.length && /^\s*\d+\.\s+/.test(lines[i])){ buf.push(lines[i].replace(/^\s*\d+\.\s+/,"")); i++; }
      html+="<ol start=\""+startNum+"\">"+buf.map(function(x){return "<li>"+inline(x)+"</li>";}).join("")+"</ol>";
      continue;
    }
    if(line.trim()===""){ i++; continue; }
    let buf=[line]; i++;
    while(i<lines.length && lines[i].trim()!=="" && !/^\s*(#{1,6}\s|>|[-*]\s|\d+\.\s)/.test(lines[i]) && lines[i].slice(0,3)!=="```" && !(lines[i].indexOf("|")>=0 && i+1<lines.length && isSep(lines[i+1])) && !/^\s*(-{3,}|\*{3,})\s*$/.test(lines[i])){
      buf.push(lines[i]); i++;
    }
    html+="<p>"+inline(buf.join(" "))+"</p>";
  }
  return html;
}

/* ---------------- State ---------------- */
const LS_DONE="fms-done-v1", LS_THEME="fms-theme-v1";
let done = new Set(JSON.parse(localStorage.getItem(LS_DONE)||"[]"));
const fiches = DATA.filter(function(d){return d.kind==="fiche";});
const el = function(id){ return document.getElementById(id); };

function applyTheme(t){ if(t) document.documentElement.setAttribute("data-theme",t); }
applyTheme(localStorage.getItem(LS_THEME));
el("themeBtn").onclick=function(){
  const cur=document.documentElement.getAttribute("data-theme");
  const isDark = cur ? cur==="dark" : matchMedia("(prefers-color-scheme:dark)").matches;
  const next=isDark?"light":"dark";
  applyTheme(next); localStorage.setItem(LS_THEME,next);
};

function openDrawer(o){ el("drawer").classList.toggle("show",o); el("scrim").classList.toggle("show",o); }
el("menuBtn").onclick=function(){ openDrawer(!el("drawer").classList.contains("show")); };
el("scrim").onclick=function(){ openDrawer(false); };
el("brandBtn").onclick=function(){ location.hash="#curriculum"; };

function updateProgress(){
  const n=fiches.filter(function(f){return done.has(f.id);}).length;
  el("progBar").style.width=(n/fiches.length*100)+"%";
  el("progLabel").textContent=n+" / "+fiches.length+" fiches terminées";
}

/* ---------------- Nav ---------------- */
let current=null;
function buildNav(filter){
  filter = filter||"";
  const nav=el("nav"); nav.innerHTML="";
  const f=filter.trim().toLowerCase();
  let lastGroup=null;
  DATA.forEach(function(d){
    if(f && d.title.toLowerCase().indexOf(f)<0 && (d.num||"").indexOf(f)<0) return;
    if(d.group!==lastGroup){
      const g=document.createElement("div"); g.className="nav-group"; g.textContent=d.group; nav.appendChild(g);
      lastGroup=d.group;
    }
    const b=document.createElement("button"); b.className="nav-item"; b.dataset.id=d.id;
    const numCls = d.kind==="sys" ? "num sys" : (d.icon==="🛠️" ? "num practice" : "num");
    const numTxt = d.kind==="sys" ? "§" : d.num;
    let meta;
    if(d.kind==="fiche"){
      meta='<span class="ni-meta">'+d.icon+' '+(d.timeless?'<span class="dot-t"></span>':'')+(d.volatile?'<span class="dot-v"></span>':'')+' '+d.tag+'</span>';
    }else{
      meta='<span class="ni-meta">Système</span>';
    }
    b.innerHTML='<span class="'+numCls+'">'+numTxt+'</span>'+
      '<span class="ni-body"><span class="ni-title">'+d.title+'</span>'+meta+'</span>'+
      '<span class="ni-check">'+(done.has(d.id)?"✓":"")+'</span>';
    b.onclick=function(){ location.hash="#"+d.id; };
    nav.appendChild(b);
  });
  markActive(current);
}
function markActive(id){
  const items=document.querySelectorAll(".nav-item");
  items.forEach(function(n){ n.classList.toggle("active",n.dataset.id===id); });
}

/* ---------------- Render ---------------- */
function render(id){
  let d=DATA.find(function(x){return x.id===id;}) || DATA[0];
  current=d.id;
  const idx=DATA.indexOf(d);
  const prev=DATA[idx-1], next=DATA[idx+1];
  const natureChips = (d.timeless?'<span class="chip t">⏳ Intemporel</span>':'')+(d.volatile?'<span class="chip v">⚡ Volatile</span>':'');
  const typeChip = d.kind==="sys" ? '<span class="chip type">📂 Système</span>' : '<span class="chip type">'+d.icon+' '+d.tag+'</span>';
  const doneBtn = d.kind==="fiche"
    ? '<button class="btn '+(done.has(d.id)?"done":"")+'" id="doneBtn">'+(done.has(d.id)?"✓ Fiche terminée":"Marquer comme terminée")+'</button>'
    : '';
  const pager='<div class="pager">'+
    (prev?'<a class="prev" href="#'+prev.id+'"><span class="dir">← Précédent</span><span class="pt">'+prev.title+'</span></a>':'<a class="prev disabled"><span class="dir">← Précédent</span><span class="pt">—</span></a>')+
    (next?'<a class="next" href="#'+next.id+'"><span class="dir">Suivant →</span><span class="pt">'+next.title+'</span></a>':'<a class="next disabled"><span class="dir">Suivant →</span><span class="pt">—</span></a>')+
    '</div>';
  el("content").innerHTML=
    '<div class="fiche-head"><div class="eyebrow">'+typeChip+natureChips+'</div>'+
    '<h1 class="fiche-title">'+d.title+'</h1></div>'+
    '<div class="md">'+renderMd(d.md)+'</div>'+
    (doneBtn?'<div class="actions">'+doneBtn+'</div>':'')+
    pager;
  if(d.kind==="fiche"){
    el("doneBtn").onclick=function(){
      if(done.has(d.id)) done.delete(d.id); else done.add(d.id);
      localStorage.setItem(LS_DONE,JSON.stringify([].concat(Array.from(done))));
      updateProgress(); render(d.id); buildNav(el("search").value);
    };
  }
  markActive(d.id);
  window.scrollTo(0,0);
  if(innerWidth<960) openDrawer(false);
}

/* ---------------- Routing ---------------- */
function route(){
  const id=decodeURIComponent(location.hash.replace(/^#/,"")) || DATA[0].id;
  render(id);
}
window.addEventListener("hashchange",route);
el("search").addEventListener("input",function(e){ buildNav(e.target.value); });

buildNav();
updateProgress();
route();
</script>
