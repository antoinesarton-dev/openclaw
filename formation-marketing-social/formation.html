 pour la boutique, et un autre pour InvoiceLab.\n3. Pourquoi la tristesse molle se partage-t-elle mal alors que l'indignation se partage bien ?\n4. Le *pourquoi* du send (signal dur à truquer) est-il ⏳ ou ⚡ ? Et le poids exact du send dans\n   l'algo ?\n\n## Cartes de rappel → `revision-espacee.md`\n\n- Send = signal roi 2026 car dur à truquer (engage la réputation de celui qui partage).\n- Question de conception : « qui l'envoie à qui, et pourquoi ? » avant de publier.\n- 6 moteurs : utile/malin, expression de soi, lien, émotion forte, utilité pratique, histoire.\n- La fin (punchline) compte autant que le hook pour déclencher le send.\n"},{"id":"10","kind":"fiche","num":"10","title":"Offre irrésistible 1 : l'équation de valeur","group":"Parcours (ordre conseillé)","icon":"🧠","tag":"Théorie","timeless":true,"volatile":false,"md":"# Fiche 10 — Offre irrésistible 1 : l'équation de valeur\n\n- **Type :** 🧠 Théorie · **Nature :** ⏳ Intemporel · **Durée :** ~1 h · **Prérequis :** Fiche 06\n- **Terrain :** —\n\n## Objectifs\n\n1. Comprendre que le marketing amplifie une offre — il ne sauve pas une mauvaise offre.\n2. Maîtriser les 4 leviers de la valeur perçue et savoir lequel actionner.\n3. Diagnostiquer *pourquoi* une offre ne convertit pas.\n\n## 1. L'offre avant le contenu\n\nVérité que 90 % des débutants ignorent : **le meilleur copywriting du monde ne sauve pas une offre\nfaible.** Le contenu et la pub ne font qu'amplifier le désir pour l'offre. Si l'offre est tiède,\namplifier ne donne que du tiède plus fort. Avant d'optimiser un hook, demande : *est-ce que ce que je\npropose est réellement désirable ?*\n\nUne offre = ce que le client obtient (le résultat), à quel prix, avec quelle garantie, quels bonus,\nquelles conditions — pas juste « le produit ».\n\n## 2. L'équation de valeur (Hormozi)\n\nLa valeur perçue se décompose en 4 termes :\n\n```\n                Résultat rêvé  ×  Probabilité perçue d'y arriver\nValeur  =  ─────────────────────────────────────────────────────\n                   Délai  ×  Effort & sacrifice perçus\n```\n\n- **↑ Résultat rêvé :** l'issue que le client veut vraiment (pas la feature). Personne ne veut « un\n  générateur de factures » ; il veut « être payé, vite, sans avoir l'air amateur ».\n- **↑ Probabilité perçue :** croit-il que *ça marchera pour lui* ? C'est le rôle de la preuve, des\n  témoignages, de la garantie (fiche 11).\n- **↓ Délai :** combien de temps avant le résultat ? Plus c'est court, plus la valeur monte.\n  « Facture prête en 40 s » écrase « prise en main en 2 semaines ».\n- **↓ Effort & sacrifice :** combien d'efforts, d'apprentissage, de risque ? « Sans compte, sans\n  logiciel à installer » réduit le sacrifice.\n\n**Lecture stratégique :** pour rendre une offre irrésistible, tu agis sur les 4 leviers, mais les\ndeux du *bas* (délai, effort) sont souvent les plus faciles à améliorer et les plus négligés.\n\n## 3. Diagnostiquer une offre qui ne convertit pas\n\nPasse l'offre au crible des 4 termes :\n- Les gens ne voient pas le **résultat** ? → tu vends la feature, pas la transformation.\n- Ils ne **croient pas** que ça marchera pour eux ? → manque de preuve/garantie (fiche 11).\n- Le **délai** paraît long ? → montre un « quick win » immédiat.\n- L'**effort** paraît élevé ? → réduis les étapes, fais-le à leur place, retire la friction (compte,\n  installation, carte bancaire).\n\nExemple boutique canicule : un ventilateur « pas cher » n'est pas une offre. « Dors à 3 °C de moins\ndès ce soir, livré demain, ou remboursé » agit sur résultat + délai + probabilité (garantie) + effort.\n\n## 4. Le prix n'est pas le problème (souvent)\n\nQuand ça ne se vend pas, le réflexe est de baisser le prix. C'est presque toujours une erreur :\nbaisser le prix diminue aussi la valeur perçue (« si c'est si peu cher, ça vaut quoi ? ») et rogne ta\nmarge (fatal en dropshipping, fiche 33). Le vrai levier n'est pas *baisser le prix* mais **augmenter\nla valeur perçue** (les 4 termes) jusqu'à ce que le prix paraisse dérisoire face au résultat.\n\n## Explique-moi (Feynman)\n\nPrends InvoiceLab Pro (licence payante). Décris son offre à voix haute en nommant les 4 termes de\nl'équation. Lequel est ton point faible actuel ? C'est là que tu travailleras (fiche 12).\n\n## Quiz génératif\n\n1. Écris l'équation de valeur de mémoire et explique pourquoi délai et effort sont *au dénominateur*.\n2. Une boutique ne vend pas et baisse son prix de 20 %. Donne deux raisons pour lesquelles c'est\n   souvent une erreur.\n3. Pour le produit canicule, propose une amélioration sur le levier *délai* et une sur le levier\n   *effort*.\n4. « Le meilleur copywriting ne sauve pas une offre faible. » Explique pourquoi avec le mot\n   « amplifier ».\n\n## Cartes de rappel → `revision-espacee.md`\n\n- L'offre précède le contenu ; le marketing amplifie, il ne sauve pas.\n- Équation : (Résultat × Probabilité) ÷ (Délai × Effort).\n- Diagnostiquer une non-conversion = trouver lequel des 4 termes cloche.\n- Ne pas baisser le prix par réflexe : augmenter la valeur perçue.\n"},{"id":"11","kind":"fiche","num":"11","title":"Offre irrésistible 2 : risque, garanties, bundling","group":"Parcours (ordre conseillé)","icon":"🧠","tag":"Théorie","timeless":true,"volatile":false,"md":"# Fiche 11 — Offre irrésistible 2 : risque, garanties, bundling\n\n- **Type :** 🧠 Théorie · **Nature :** ⏳ Intemporel · **Durée :** ~1 h · **Prérequis :** Fiche 10\n- **Terrain :** —\n\n## Objectifs\n\n1. Utiliser le renversement du risque pour lever le frein n°1 à l'achat.\n2. Construire des garanties qui rassurent sans te ruiner.\n3. Augmenter la valeur perçue par le bonus/bundling au lieu de baisser le prix.\n\n## 1. Le risque perçu est le vrai frein\n\nÀ valeur égale, ce qui bloque l'achat est la peur de se tromper : « et si ça ne marche pas / si je me\nfais avoir / si je perds mon argent ? » C'est la **probabilité perçue** de l'équation (fiche 10) vue\nde l'autre côté. Ton job : transférer ce risque de ses épaules vers les tiennes. Plus tu portes le\nrisque, plus l'achat devient facile.\n\n## 2. Le renversement du risque (garanties)\n\nUne garantie dit : « si ça ne marche pas, tu ne perds rien. » Types, du plus faible au plus fort :\n\n- **Satisfait ou remboursé** (standard) — « 30 jours, remboursé sans question ». Base rassurante.\n- **Garantie conditionnelle à résultat** — « si tu ne dors pas mieux en 7 nuits, remboursé ». Plus\n  crédible car spécifique.\n- **Garantie renforcée** — « remboursé + tu gardes le bonus ». Signale une confiance énorme.\n\nContre-intuitif mais robuste : **une garantie plus forte augmente souvent les ventes plus qu'elle\nn'augmente les remboursements.** La majorité honnête achète rassurée ; une petite minorité abuse. Le\ngain net est presque toujours positif — à condition que le produit tienne la route (sinon les\nremboursements explosent, ce qui est un signal utile).\n\n⚠️ Contrainte réelle : en dropshipping à marge serrée (fiche 33), une garantie « remboursé » coûte\ncher si le taux de retour grimpe. Teste petit, mesure le taux réel avant de généraliser.\n\n## 3. Le bonus et le bundling\n\nPlutôt que baisser le prix (fiche 10), **empile de la valeur** :\n- **Bonus** : un ajout à faible coût pour toi, forte valeur perçue pour lui. Pour InvoiceLab : un\n  modèle de relance d'impayés, une checklist des mentions légales. Coût marginal ≈ 0, valeur perçue\n  élevée.\n- **Bundling** : regrouper plusieurs éléments en une offre dont le prix paraît dérisoire face au\n  total. Le bundle rend aussi la **comparaison directe** avec un concurrent plus difficile (tu ne\n  vends plus « la même chose moins cher », tu vends *un package unique*).\n- **Ancrage de prix** : montrer d'abord la valeur totale (« 3 outils qui valent 60 € »), puis ton\n  prix (« 19 € »). Le premier chiffre *ancre* la perception (fiche 13).\n\n## 4. La rareté/l'urgence — avec honnêteté (pont vers fiche 14)\n\nUne offre limitée (temps, stock, places) accélère la décision (aversion à la perte). Mais la fausse\nurativité (« plus que 2 en stock ! » alors que non) est de la manipulation qui se paie en confiance —\net sur les réseaux, ça se démasque. Règle : **n'utilise que de la rareté réelle** (vraie fin de\npromo, vrai stock limité, vraie série). On creuse l'éthique en fiche 14.\n\n## Explique-moi (Feynman)\n\nExplique à voix haute pourquoi offrir une garantie plus forte peut *augmenter* le profit net, et dans\nquel cas ça se retourne contre toi.\n\n## Quiz génératif\n\n1. Formule une garantie « conditionnelle à résultat » pour le produit canicule.\n2. Propose 2 bonus à coût quasi nul pour InvoiceLab, et explique leur valeur perçue.\n3. Pourquoi le bundling protège-t-il de la guerre des prix avec un concurrent ?\n4. Donne un exemple de rareté honnête et un de fausse rareté pour ta boutique.\n\n## Cartes de rappel → `revision-espacee.md`\n\n- Le vrai frein = risque perçu → le transférer sur toi (garantie).\n- Garantie plus forte ↑ ventes > ↑ remboursements (si le produit tient) ; attention marge dropshipping.\n- Empiler de la valeur (bonus/bundle/ancrage) plutôt que baisser le prix.\n- Rareté seulement si réelle.\n"},{"id":"12","kind":"fiche","num":"12","title":"Construire une offre complète (boutique)","group":"Parcours (ordre conseillé)","icon":"🛠️","tag":"Pratique","timeless":true,"volatile":false,"md":"# Fiche 12 — Construire une offre complète (boutique) 🛠️\n\n- **Type :** 🛠️ Pratique · **Nature :** ⏳ Intemporel · **Durée :** ~1 h · **Prérequis :** Fiches 10, 11\n- **Terrain :** Boutique canicule\n\n## L'exercice\n\nTu construis l'**offre complète** du produit canicule — pas une description, une *offre* au sens\nfiches 10–11 (résultat, prix, garantie, bonus, rareté honnête).\n\n### Livrable — la fiche d'offre\n\nRemplis chaque case :\n\n1. **Résultat rêvé** (pas la feature) : quelle transformation vit le client ? (1 phrase)\n2. **Les 4 leviers de valeur** — écris une ligne par levier montrant comment ton offre agit dessus :\n   - Résultat : …\n   - Probabilité perçue (preuve/garantie) : …\n   - Délai (quick win / livraison) : …\n   - Effort/sacrifice réduit : …\n3. **Prix + ancrage** : ton prix, et le chiffre d'ancrage qui le précède (valeur totale perçue).\n4. **Garantie** : formule-la (conditionnelle à résultat de préférence), et note son **risque réel**\n   pour ta marge.\n5. **1–2 bonus** à coût quasi nul, forte valeur perçue.\n6. **Rareté/urgence** : une seule, et elle doit être **honnête** (dis laquelle et pourquoi elle est\n   vraie).\n7. **La promesse en une phrase** : assemble le tout en une offre que tu pourrais dire à l'oral en 10 s\n   (« Dors à X °C de moins dès ce soir, livré demain, ou remboursé — + le guide anti-canicule offert »).\n\n## Grille de notation (/20)\n\n| Axe | Ce que je regarde |\n|---|---|\n| **Spécificité** | Résultat et leviers concrets/chiffrés, pas « produit de qualité » ? |\n| **Mécanique** | Les 4 termes de l'équation réellement travaillés + garantie qui renverse le risque ? |\n| **Clarté** | La promesse en une phrase tient et donne envie ? |\n| **Adéquation** | Réaliste pour du dropshipping petit budget (marge, livraison, garantie soutenable) ? |\n\nColle la fiche d'offre dans `journal-de-progression.md`. Je note, et je stress-teste ta garantie et\nta marge (là où les offres dropshipping s'effondrent).\n\n## Anti-triche\n\n- Ne saute pas l'étape « risque réel de la garantie sur la marge » : c'est là que tu passes de\n  théorie à décision d'entrepreneur.\n- La promesse finale doit être **dicible à l'oral en 10 s**. Si tu as besoin d'un paragraphe, elle\n  n'est pas encore claire.\n- Pas de fausse rareté. Si tu ne trouves pas de rareté honnête, écris « aucune » — c'est mieux que\n  mentir.\n\n## Explique-moi (Feynman)\n\nDis ta « promesse en une phrase » à voix haute à quelqu'un (ou à ton miroir). S'il ne comprend pas\n*instantanément* ce qu'il gagne et pourquoi il ne risque rien, retravaille-la.\n\n## Cartes de rappel → `revision-espacee.md`\n\n- Une offre ≠ une description : résultat + prix + garantie + bonus + rareté honnête.\n- Toujours vérifier le coût réel de la garantie sur la marge avant de la promettre.\n- Test final : la promesse tient en une phrase de 10 s.\n"},{"id":"13","kind":"fiche","num":"13","title":"Biais 1 : réciprocité, engagement, preuve sociale","group":"Parcours (ordre conseillé)","icon":"🧠","tag":"Théorie","timeless":true,"volatile":false,"md":"# Fiche 13 — Biais 1 : réciprocité, engagement, preuve sociale\n\n- **Type :** 🧠 Théorie · **Nature :** ⏳ Intemporel · **Durée :** ~1 h · **Prérequis :** Fiche 06\n- **Terrain :** —\n\n## Objectifs\n\n1. Comprendre le *mécanisme* de 3 biais (pas juste leur nom) et leurs limites.\n2. Les appliquer honnêtement à du contenu et à une page de vente.\n3. Repérer l'ancrage, une arme de persuasion transversale.\n\n## 1. Réciprocité\n\n**Mécanisme :** recevoir quelque chose crée une dette sociale ; on cherche à rendre. C'est câblé dans\ntoutes les cultures (survie du groupe).\n\n**Application :** donne *avant* de demander. Sur les réseaux, ton contenu gratuit et réellement utile\n(fiche 09, contenu-outil) crée cette dette : après 10 posts qui t'ont aidé gratuitement, acheter le\nproduit paraît juste. C'est le moteur du marketing de contenu. La séquence gagnante d'un solo :\n**donner beaucoup, demander peu, de temps en temps.**\n\n**Limite :** la réciprocité ne fonctionne que si le don est *perçu comme sincère*, pas comme un appât\ntransparent. Un « ebook gratuit » qui n'est qu'une pub déçoit et casse l'effet.\n\n## 2. Engagement & cohérence\n\n**Mécanisme :** on veut être cohérent avec ce qu'on a déjà dit/fait. Un petit premier pas rend le\nsuivant plus probable (le « pied dans la porte »).\n\n**Application :** demande un micro-engagement avant le gros. Un commentaire, un « oui » mental (« tu\nfactures encore sur Word ? » → il se dit « oui »), un essai gratuit sans compte (InvoiceLab est\nparfait pour ça : l'usage précède l'achat). Chaque petit pas engage vers le suivant.\n\n**Limite :** forcer un engagement (dark patterns, cases pré-cochées) génère du ressentiment et des\nremboursements. Le bon engagement est *volontaire*.\n\n## 3. Preuve sociale\n\n**Mécanisme :** en situation d'incertitude, on copie ce que font les autres (surtout nos\nsemblables). C'est le biais le plus puissant sur les réseaux — c'est *littéralement* le carburant des\nalgorithmes 2026 (send, partages : fiche 04, 09).\n\n**Application, par force croissante :**\n1. Nombres (« 1 200 freelances ce mois-ci ») — utile mais froid.\n2. Témoignage **spécifique et nommé** (« Julie, graphiste à Lyon : payée en 3 jours au lieu de 3\n   semaines ») — bien plus fort qu'« ils adorent ».\n3. Preuve de *tes semblables* : un freelance croit un autre freelance, pas une marque.\n4. UGC (contenu créé par les clients, fiche 28) — la forme la plus crédible car non contrôlée par toi.\n\n**Limite / risque :** la preuve sociale **inventée** (faux avis, faux compteurs) est de la\nmanipulation, illégale en pub (droit FR/UE) et fragile (ça se démasque en commentaire). N'utilise que\ndu vrai. Si tu débutes et n'as pas de preuve, construis-la (fiche 28), ne la fabrique pas.\n\n## 4. L'ancrage (transversal)\n\n**Mécanisme :** le premier chiffre vu sert de référence à tout ce qui suit. Un prix de 19 € paraît\nélevé après « gratuit » mais dérisoire après « 60 € ». (Rappel fiche 11 : montre la valeur totale\navant ton prix.)\n\n**Application :** contrôle le premier chiffre que ton prospect voit — prix barré, valeur du bundle,\ncoût du problème (« une TVA oubliée = un redressement à X € »).\n\n## Explique-moi (Feynman)\n\nExplique la différence entre preuve sociale *honnête* et *fabriquée*, et pourquoi la fabriquée est un\nmauvais calcul même en mettant l'éthique de côté (indice : commentaires + droit).\n\n## Quiz génératif\n\n1. Décris la séquence de réciprocité d'un créateur solo en une phrase (« donner…, demander… »).\n2. Classe ces preuves sociales de la plus faible à la plus forte : témoignage nommé, compteur\n   d'utilisateurs, UGC, « nos clients adorent ».\n3. Quel micro-engagement InvoiceLab peut-il obtenir *avant* de demander l'achat ?\n4. Tu débutes, zéro témoignage. Que fais-tu — et que ne fais-tu surtout pas ?\n5. Réécris une annonce de prix pour la boutique en utilisant l'ancrage.\n\n## Cartes de rappel → `revision-espacee.md`\n\n- Réciprocité : donner beaucoup, demander peu — le moteur du contenu gratuit.\n- Engagement : un micro-« oui » rend le gros « oui » plus probable (essai sans compte).\n- Preuve sociale : témoignage nommé de tes semblables > compteur > « ils adorent » ; jamais inventée.\n- Ancrage : contrôle le premier chiffre vu.\n"},{"id":"14","kind":"fiche","num":"14","title":"Biais 2 : autorité, sympathie, rareté + la ligne éthique","group":"Parcours (ordre conseillé)","icon":"🧠","tag":"Théorie","timeless":true,"volatile":false,"md":"# Fiche 14 — Biais 2 : autorité, sympathie, rareté + la ligne éthique\n\n- **Type :** 🧠 Théorie · **Nature :** ⏳ Intemporel · **Durée :** ~1 h · **Prérequis :** Fiche 13\n- **Terrain :** —\n\n## Objectifs\n\n1. Utiliser autorité, sympathie et rareté sans basculer dans la manipulation.\n2. Tracer la ligne persuasion/manipulation — et comprendre pourquoi la franchir coûte cher.\n\n## 1. Autorité\n\n**Mécanisme :** on suit les experts et les signaux de compétence — ça économise l'effort d'évaluer\nsoi-même.\n\n**Application pour un solo sans marque :** tu construis l'autorité par la **démonstration**, pas par\nle diplôme. Montrer que tu connais le problème mieux que quiconque (fiche 36 : niche + POV). Signaux :\npartager un savoir précis et non trivial, admettre les limites (paradoxalement, ça *renforce* la\ncrédibilité), montrer des résultats réels. Pour InvoiceLab : maîtriser les subtilités de la\nfacturation FR (mentions légales, TVA auto-entrepreneur) te positionne en autorité utile.\n\n**Limite :** l'autorité empruntée et fausse (faux titres, « vu dans les médias » bidon) se démonte et\nte détruit. L'autorité gagnée est lente mais solide.\n\n## 2. Sympathie (liking)\n\n**Mécanisme :** on dit oui aux gens qu'on apprécie — similaires à nous, sincères, qui nous plaisent.\n\n**Application :** c'est *le* levier du contenu de fondateur (fiche 17). La similarité (« je suis un\nsolo comme toi, j'ai galéré pareil »), la vulnérabilité stratégique (montrer les ratés), la\nconstance créent l'attachement. Les gens achètent à des gens. Un solo *attachant* bat une marque\nlisse et anonyme — c'est justement ton avantage face aux grosses boîtes.\n\n**Limite :** la sympathie fabriquée (fausse proximité, faux storytelling larmoyant) sonne faux à\nl'ère anti-IA (fiche 19) — l'audience 2026 est entraînée à détecter le factice.\n\n## 3. Rareté\n\n**Mécanisme :** l'aversion à la perte — on valorise plus ce qui est rare ou risque de disparaître. Le\n« fear of missing out ».\n\n**Application :** vraie série limitée, vraie fin de promo, vraie place limitée (accompagnement 1:1).\nLa rareté transforme « un jour peut-être » en « maintenant ».\n\n**Limite (critique) :** la **fausse** rareté (compte à rebours qui se réinitialise, « plus que 2 en\nstock » permanent) est frauduleuse *et* détectable. Un client qui revient et voit le même « dernier\njour » a compris. Tu gagnes une vente, tu perds la confiance et le bouche-à-oreille (fiche 27).\n\n## 4. La ligne persuasion / manipulation\n\nLe test, simple et robuste :\n\n> **La persuasion aide le prospect à prendre une décision qui est bonne pour lui, en réduisant sa\n> friction. La manipulation lui fait prendre une décision qui est mauvaise pour lui, en exploitant\n> un biais contre son intérêt.**\n\nAutrement dit : *après coup, le client serait-il content d'avoir su ce que tu savais ?* Si oui → tu\npersuades. Si tu as caché ou déformé pour vendre → tu manipules.\n\nPourquoi ça n'est pas que de la morale, mais un **calcul business** :\n- Les réseaux ont une **mémoire et des commentaires**. La manipulation se documente publiquement.\n- Ton canal principal (fiche 27) est le **bouche-à-oreille** ; il s'effondre au premier client floué.\n- Un client manipulé rembourse, laisse un avis négatif, et ne revient pas. Le coût d'acquisition est\n  perdu. En petit budget, tu ne peux pas te le permettre.\n\nLa persuasion honnête *scale* ; la manipulation *brûle*.\n\n## Explique-moi (Feynman)\n\nFormule le test persuasion/manipulation avec tes mots, puis applique-le à un « compte à rebours de\npromo ». Dans quel cas c'est ok, dans quel cas c'est de la manipulation ?\n\n## Quiz génératif\n\n1. Tu n'as ni diplôme ni notoriété. Comment construis-tu de l'autorité sur la facturation freelance ?\n2. Pourquoi la vulnérabilité renforce-t-elle la crédibilité au lieu de l'affaiblir ?\n3. Donne un exemple de rareté honnête et un de rareté frauduleuse pour la boutique, et le coût réel\n   de la seconde.\n4. Applique le test persuasion/manipulation à : « masquer les frais de port jusqu'au paiement ».\n\n## Cartes de rappel → `revision-espacee.md`\n\n- Autorité d'un solo = démonstration + admettre ses limites (pas le diplôme).\n- Sympathie = ton avantage : les gens achètent à des gens, une marque lisse ne peut pas rivaliser.\n- Fausse rareté = fraude détectable qui brûle la confiance.\n- Test : « après coup, le client serait-il content d'avoir su ce que je savais ? »\n"},{"id":"15","kind":"fiche","num":"15","title":"Injecter des biais honnêtes dans une page","group":"Parcours (ordre conseillé)","icon":"🛠️","tag":"Pratique","timeless":true,"volatile":false,"md":"# Fiche 15 — Injecter des biais honnêtes dans une page 🛠️\n\n- **Type :** 🛠️ Pratique · **Nature :** ⏳ Intemporel · **Durée :** ~1 h · **Prérequis :** Fiches 13, 14\n- **Terrain :** Boutique canicule (ou landing InvoiceLab)\n\n## L'exercice\n\nPrends la page produit que tu as écrite en fiche 08 (ou l'offre de la fiche 12) et **injecte 3 biais\ndistincts, tous honnêtes**, en documentant le mécanisme et la ligne éthique de chacun.\n\n### Livrable\n\nUn tableau + la page révisée :\n\n| Biais choisi | Où sur la page | Formulation exacte (verbatim) | Pourquoi c'est honnête (test fiche 14) |\n|---|---|---|---|\n\nContraintes :\n- **3 biais différents** parmi : réciprocité, engagement, preuve sociale, autorité, sympathie,\n  rareté, ancrage.\n- Chaque insertion doit passer le test persuasion/manipulation (fiche 14) — tu écris *pourquoi* dans\n  la 4e colonne. Une insertion que tu ne peux pas justifier = à retirer.\n- Au moins une doit être une **preuve sociale** — et si tu n'as pas encore de vrais avis, tu écris\n  comment tu vas en obtenir de vrais (fiche 28) plutôt que d'en inventer.\n- Colle **la page avant** et **la page après** pour qu'on voie la transformation.\n\n## Grille de notation (/20)\n\n| Axe | Ce que je regarde |\n|---|---|\n| **Spécificité** | Preuves/chiffres concrets, pas des placeholders vagues (« beaucoup de clients ») ? |\n| **Mécanique** | Le bon biais au bon endroit du parcours (ancrage près du prix, engagement au CTA…) ? |\n| **Clarté** | Les insertions renforcent sans alourdir ni saturer la page ? |\n| **Adéquation & éthique** | Chaque biais passe le test honnêteté ; rien de fabriqué ? (un biais malhonnête plafonne la note) |\n\nColle avant/après + tableau dans `journal-de-progression.md`. Je vérifie surtout la colonne\n« honnête » : c'est là que se joue la différence entre un pro et un vendeur de tapis.\n\n## Anti-triche\n\n- **Interdiction absolue d'inventer** un avis, un chiffre d'utilisateurs, un stock. Si tu n'as pas la\n  preuve, tu notes le plan pour l'obtenir. Un livrable avec de la preuve inventée = 0 sur l'axe\n  éthique, quoi qu'il vaille par ailleurs.\n- Ne surcharge pas : 3 biais bien placés > 7 empilés qui donnent une page « arnaque ».\n\n## Explique-moi (Feynman)\n\nPour ton insertion la plus « limite », défends-la à voix haute face à un client sceptique : « pourquoi\nce n'est pas de la manipulation ? ». Si ta défense te gêne, c'en est probablement.\n\n## Cartes de rappel → `revision-espacee.md`\n\n- Chaque biais inséré doit passer le test honnêteté et être justifiable à voix haute.\n- Jamais de preuve sociale inventée : construire la vraie, sinon s'en passer.\n- 3 biais bien placés > 7 empilés.\n"},{"id":"16","kind":"fiche","num":"16","title":"Storytelling 1 : structures narratives","group":"Parcours (ordre conseillé)","icon":"🧠","tag":"Théorie","timeless":true,"volatile":false,"md":"# Fiche 16 — Storytelling 1 : structures narratives\n\n- **Type :** 🧠 Théorie · **Nature :** ⏳ Intemporel · **Durée :** ~1 h · **Prérequis :** Fiche 06\n- **Terrain :** —\n\n## Objectifs\n\n1. Comprendre pourquoi le cerveau retient une histoire mieux qu'un argument.\n2. Maîtriser 3 structures narratives courtes, réutilisables en contenu social.\n3. Transformer une feature en histoire.\n\n## 1. Pourquoi l'histoire bat l'argument\n\nUn argument s'adresse à la raison, qui doute et compare. Une histoire s'adresse à l'imaginaire, qui\n*vit* la scène. Deux effets :\n- **Transport narratif :** quand on suit une histoire, on baisse la garde critique — on n'argumente\n  pas contre un récit qu'on est en train de vivre.\n- **Mémoire :** on retient un récit (personnages, tension, résolution) bien mieux qu'une liste de\n  bénéfices. Et on **transmet** un récit (fiche 09, moteur n°6 du partage) — on ne transmet pas un\n  argumentaire.\n\nDonc : à message égal, l'emballer en histoire augmente à la fois la persuasion, la mémorisation et\nle partage.\n\n## 2. Trois structures courtes (adaptées au format social)\n\n### a) Avant / Après / Pont\nLa plus simple et la plus vendeuse.\n- **Avant :** le monde du client avec le problème (concret, émotionnel).\n- **Après :** le monde une fois résolu (la transformation désirée).\n- **Pont :** ce qui l'y amène (ton produit/ta méthode).\n*Ex InvoiceLab :* « Avant, je passais mes dimanches soir sur Excel à refaire mes factures. Depuis, 40\nsecondes et c'est réglé. Le pont, c'est [produit]. »\n\n### b) La quête (mini arc du héros)\n- Un **désir/problème** → des **obstacles** → un **tournant** (une découverte) → une **résolution**.\n- Clé : **le héros, c'est le client, pas toi.** Ton produit est le *guide/l'outil*, pas la star. Les\n  marques qui se posent en héros ennuient ; celles qui font du client le héros fidélisent.\n\n### c) La vulnérabilité (récit d'échec)\n- Un **raté** honnête → ce que ça a coûté → la **leçon** → ce que tu fais différemment.\n- Puissant pour un solo (fiche 14, sympathie + autorité par l'aveu). L'échec assumé crée de la\n  confiance parce qu'il est rare et risqué à partager.\n\n## 3. Transformer une feature en histoire\n\nRecette : prends une feature → demande « pour qui c'est un soulagement, et à quel moment vécu ? » →\nraconte ce moment.\n- Feature : « InvoiceLab est 100 % client-side. »\n- Moment : « Un freelance hésite à mettre ses revenus clients dans un énième outil cloud américain.\n  Avec InvoiceLab, ses données ne quittent jamais son navigateur — rien n'est envoyé nulle part. »\n- L'histoire rend abstraite la feature *ressentie*.\n\n## 4. Le détail concret comme colle narrative\n\nUne histoire vit par ses détails spécifiques (fiche 07). « Un dimanche soir, mon café froid à côté du\nlaptop » transporte ; « je perdais du temps » non. Le concret n'est pas un ornement : c'est ce qui\nactive le transport narratif. Règle croisée : **une bonne histoire est spécifique, jamais générique.**\n\n## Explique-moi (Feynman)\n\nRaconte la même info (« InvoiceLab fait gagner du temps ») deux fois : une en argument, une en\nhistoire « avant/après/pont ». Ressens la différence de force. Laquelle aurais-tu envie de transmettre ?\n\n## Quiz génératif\n\n1. Pourquoi baisse-t-on sa garde critique devant une histoire mais pas devant un argument ?\n2. Dans « la quête », qui doit être le héros et pourquoi la marque-héros échoue-t-elle ?\n3. Transforme la feature « livraison en 24 h » de la boutique en un mini-récit « avant/après/pont ».\n4. Pourquoi le détail concret n'est-il pas décoratif mais fonctionnel dans un récit ?\n\n## Cartes de rappel → `revision-espacee.md`\n\n- Histoire > argument : transport narratif (garde baissée) + mémoire + partage.\n- 3 structures : avant/après/pont, la quête (client = héros), la vulnérabilité (échec → leçon).\n- Feature → histoire : « pour qui, à quel moment vécu, c'est un soulagement ? »\n- Le détail concret active le transport ; une histoire générique ne transporte pas.\n"},{"id":"17","kind":"fiche","num":"17","title":"Storytelling 2 : le récit fondateur qui convertit","group":"Parcours (ordre conseillé)","icon":"🧠","tag":"Théorie","timeless":true,"volatile":false,"md":"# Fiche 17 — Storytelling 2 : le récit fondateur qui convertit\n\n- **Type :** 🧠 Théorie · **Nature :** ⏳ Intemporel · **Durée :** ~1 h · **Prérequis :** Fiche 16\n- **Terrain :** —\n\n## Objectifs\n\n1. Comprendre pourquoi le récit du fondateur est l'actif marketing le plus défendable d'un solo.\n2. Construire ton récit fondateur autour d'un « pourquoi » crédible.\n3. Éviter les pièges du storytelling personnel (nombrilisme, faux drame).\n\n## 1. Pourquoi le fondateur est ton meilleur levier (et le moins copiable)\n\nEn 2026, deux forces convergent :\n- **Les profils personnels battent les pages de marque** : sur LinkedIn, les posts de fondateurs\n  portent bien plus loin que les pages entreprise (fiche 22) ; l'humain crée l'attachement (fiche 14).\n- **La prime à l'authenticité** : après l'inondation de contenu IA, l'audience valorise la voix\n  humaine, imparfaite, incopiable (fiche 19). Ton produit peut être cloné ; ton histoire, non.\n\nPour un solo sans budget, ton récit fondateur est donc à la fois ton canal de distribution (les gens\nte suivent, toi) et ta différenciation (personne d'autre n'est toi). C'est ton actif le plus\ndéfendable.\n\n## 2. L'ossature d'un récit fondateur qui convertit\n\nUn bon récit fondateur relie trois points :\n\n1. **Le déclencheur (l'origine).** Le moment/le problème vécu qui t'a poussé à créer ça. Doit être\n   *spécifique et vrai*. Pour InvoiceLab : « auto-entrepreneur, j'en avais marre des outils de\n   facturation lourds, chers ou qui envoient mes données je-ne-sais-où. »\n2. **Le pourquoi (la conviction).** Ce en quoi tu crois et qui guide le produit. « Un freelance\n   devrait pouvoir faire une facture conforme en 40 s, gratuitement, sans céder ses données. » Le\n   pourquoi transforme un produit en cause à laquelle on adhère.\n3. **La mission (l'invitation).** Où tu veux emmener les gens — ils ne suivent pas un produit, ils\n   rejoignent un mouvement. « Rendre l'admin des indépendants indolore. »\n\nLe récit fondateur n'est pas *une* histoire figée : c'est une trame que tu déclines en dizaines de\ncontenus (une galère précise = un post ; une décision produit = un post ; fiche 25 repurposing).\n\n## 3. Le « build in public » comme moteur narratif continu\n\nRaconter la construction en temps réel (chiffres, décisions, ratés, victoires) génère un flux\nd'histoires infini *et* coche réciprocité + autorité + sympathie (fiches 13-14). Les gens s'attachent\nà un parcours qu'ils voient se dérouler. Ton avantage de solo : tu *as* ce parcours ; une grosse\nmarque n'a qu'un service comm. (On opérationnalise en fiche 36-37.)\n\n## 4. Les pièges\n\n- **Nombrilisme :** l'histoire doit toujours revenir à *ce que ça change pour le lecteur*. Ton récit\n  est un véhicule, pas le sujet. Test : « en quoi mon histoire aide/parle à celui qui la lit ? »\n- **Le faux drame :** surjouer un « rock bottom » inventé pour l'émotion se détecte et te décrédibilise\n  (fiche 14). La vraie galère ordinaire est plus crédible qu'un conte héroïque.\n- **L'incohérence :** ton récit doit coller à ce que tu fais/vends. Un « pourquoi » sur la vie privée\n  des données sonne faux si ton produit fuite partout.\n\n## Explique-moi (Feynman)\n\nEn 3 phrases : déclencheur → pourquoi → mission, version InvoiceLab, avec tes mots. Puis vérifie :\nest-ce que ça revient à ce que ça change pour le freelance qui écoute ?\n\n## Quiz génératif\n\n1. Pourquoi ton récit fondateur est-il « non copiable » alors que ton produit l'est ?\n2. Cite les 3 points de l'ossature et donne, pour chacun, une phrase version boutique OU InvoiceLab.\n3. Quel test appliques-tu pour éviter le nombrilisme ?\n4. Pourquoi le « build in public » est-il une machine à histoires *et* un empilement de biais ?\n\n## Cartes de rappel → `revision-espacee.md`\n\n- Récit fondateur = canal (on te suit toi) + différenciation (personne n'est toi) : ton actif le plus défendable.\n- Ossature : déclencheur (origine vraie) → pourquoi (conviction) → mission (invitation).\n- Une trame déclinable à l'infini, pas une histoire figée (build in public).\n- Pièges : nombrilisme, faux drame, incohérence avec le produit.\n"},{"id":"18","kind":"fiche","num":"18","title":"Écrire ton récit fondateur (3 formats)","group":"Parcours (ordre conseillé)","icon":"🛠️","tag":"Pratique","timeless":true,"volatile":false,"md":"# Fiche 18 — Écrire ton récit fondateur (3 formats) 🛠️\n\n- **Type :** 🛠️ Pratique · **Nature :** ⏳ Intemporel · **Durée :** ~1 h · **Prérequis :** Fiches 16, 17\n- **Terrain :** InvoiceLab (tu peux prendre ton vrai « toi »)\n\n## L'exercice\n\nÉcris **ton** récit fondateur (déclencheur → pourquoi → mission) et décline-le en **3 formats**. Comme\nles projets sont abandonnés, tu peux romancer un « toi qui aurait lancé InvoiceLab » — mais garde\nl'origine *plausible et spécifique* (l'exercice est de savoir le faire pour un vrai lancement).\n\n### Livrable — 3 formats du même récit\n\n1. **Post long (LinkedIn/X, ~120–200 mots).** Structure : hook (fiche 03) → déclencheur concret →\n   pourquoi → mission → 1 invitation douce (pas de vente dure). Il doit revenir à *ce que ça change\n   pour le lecteur freelance*.\n2. **Script vidéo courte (~40 s, format « à l'oral »).** Découpe-le : [0-2 s hook] / [corps :\n   avant-après ou vulnérabilité] / [fin : punchline partageable, fiche 09]. Écris ce que tu *dis*,\n   pas une narration littéraire.\n3. **Bio (≤ 160 caractères).** La compression ultime : qui + pour qui + pourquoi, en une ligne\n   mémorable. (Ex de forme : « J'aide les auto-entrepreneurs FR à facturer en 40 s sans céder leurs\n   données. »)\n\n## Grille de notation (/20)\n\n| Axe | Ce que je regarde |\n|---|---|\n| **Spécificité** | Déclencheur concret (un moment, un détail), pas « j'en avais marre des outils » ? |\n| **Mécanique** | Ossature déclencheur/pourquoi/mission présente ; hook au début du post et de la vidéo ; punchline à la fin de la vidéo ? |\n| **Clarté** | Le « pourquoi » est net et tient ; la bio se retient ? |\n| **Adéquation** | Ça revient au lecteur (pas nombriliste) et c'est cohérent avec le produit ? |\n\nColle les 3 formats dans `journal-de-progression.md`. Je note, et je te montre comment un même récit\nchange de *forme* sans changer de *fond* selon le format — compétence clé du repurposing (fiche 25).\n\n## Anti-triche\n\n- Écris d'abord le **fond** (déclencheur/pourquoi/mission en 3 phrases), *ensuite* les 3 formats. Si\n  tu attaques par le format, tu bricoles 3 récits différents au lieu de décliner un seul.\n- La bio à 160 caractères est la plus dure : compte les caractères, retravaille jusqu'à ce que chaque\n  mot porte.\n- Pas de faux « rock bottom » (fiche 17) : une origine ordinaire crédible > un drame inventé.\n\n## Explique-moi (Feynman)\n\nLis ta bio à voix haute à quelqu'un. En une écoute, peut-il redire *qui tu aides et pourquoi c'est\ndifférent* ? Sinon, elle est trop vague ou trop chargée.\n\n## Cartes de rappel → `revision-espacee.md`\n\n- Un seul fond (déclencheur/pourquoi/mission), trois formes (post/vidéo/bio).\n- Écrire le fond avant les formats.\n- Le récit revient toujours au lecteur, jamais nombriliste.\n"},{"id":"19","kind":"fiche","num":"19","title":"IA & contenu 1 : co-création vs automatisation","group":"Parcours (ordre conseillé)","icon":"🧠","tag":"Théorie","timeless":false,"volatile":true,"md":"# Fiche 19 — IA & contenu 1 : co-création vs automatisation\n\n- **Type :** 🧠 Théorie · **Nature :** ⚡ VOLATILE (valide au : 17/07/2026 — champ qui bouge vite, re-vérifier tous les 2–3 mois) · **Durée :** ~1 h · **Prérequis :** Fiches 07, 17\n- **Terrain :** —\n\n## Objectifs\n\n1. Comprendre ce que l'IA a rendu *sans valeur* et ce qu'elle a rendu *plus précieux*.\n2. Adopter le modèle « IA co-créateur + garde-fou humain » plutôt que l'automatisation totale.\n3. Savoir où mettre l'humain dans la chaîne.\n\n## 1. Le grand basculement de 2025-2026\n\nFait marquant, sourcé : après l'inondation de contenu généré, la préférence des consommateurs pour le\ncontenu créateur « IA » serait **tombée à ~26 %** (contre ~60 % en 2023). Et les analyses convergent\nsur un point : le combo **IA + supervision éditoriale humaine** performe nettement mieux (rapporté\n~4×) que le **100 % automatisé**. *(⚡ chiffres à re-vérifier ; la direction — reflux anti-IA + prime\nà l'humain — est largement partagée.)*\n\nTraduction stratégique :\n- L'IA a rendu le **contenu moyen quasi gratuit** → donc *sans valeur*. Produire « du contenu correct »\n  n'est plus un avantage : tout le monde peut, à coût zéro.\n- Ce qui devient **rare, donc cher** : le point de vue original, l'expérience vécue, la voix, le goût,\n  l'imperfection humaine crédible. C'est exactement ce qu'un solo a et qu'une IA n'a pas.\n\n## 2. Le piège de l'automatisation totale\n\nGénérer 30 posts IA et les publier tels quels est une stratégie perdante en 2026 :\n- Les **audiences** détectent et rejettent le générique « sent l'IA » (tournures lisses,\n  structures répétitives, zéro aspérité).\n- Les **plateformes** down-rankent le contenu « mass-produced » (fiche 04).\n- Ça te noie dans l'océan de sameness au lieu de t'en distinguer.\n\nL'automatisation ne te fait pas gagner : elle t'aligne sur la moyenne, dans un monde qui ne récompense\nplus la moyenne.\n\n## 3. Le bon modèle : IA co-créateur, humain aux points de valeur\n\nL'IA est excellente pour la *quantité* et la *vitesse* ; l'humain est irremplaçable pour le *jugement*\net la *singularité*. Répartis :\n\n| L'IA fait bien (délègue) | L'humain garde (jamais délégué) |\n|---|---|\n| Générer 30 variantes de hooks à critiquer | Choisir/trancher, injecter le POV |\n| Débroussailler, structurer, reformuler | L'histoire vécue, l'exemple réel, l'opinion |\n| Adapter un contenu en N formats (fiche 25) | La voix, le ton, les aspérités |\n| Résumer la recherche, brainstormer des angles | La décision éditoriale finale + le fact-check |\n\nRègle : **l'IA propose, l'humain dispose.** Le garde-fou humain n'est pas optionnel — c'est ce qui\ntransforme du contenu générique en contenu à toi.\n\n## 4. Où l'IA t'aide vraiment, toi (solo)\n\n- **Vaincre la page blanche / le volume** : générer 20 angles, tu en gardes 2 (fiche 21).\n- **Critique / sparring** : lui faire démonter tes hooks contre les critères de la fiche 03.\n- **Repurposing** (fiche 25) : décliner un contenu validé en formats, à ta relecture.\n- **Recherche** : synthétiser vite (mais vérifier — l'IA invente ; d'où le fact-check humain).\n\nCe que tu ne délègues jamais : le **choix** et **ta voix**. Sinon tu publies la moyenne.\n\n## Explique-moi (Feynman)\n\nExplique le paradoxe : « l'IA a rendu la production de contenu illimitée, donc elle a *dévalué* le\ncontenu et *revalorisé* l'humain. » Pourquoi les deux à la fois ?\n\n## Quiz génératif\n\n1. Qu'est-ce que l'IA a rendu sans valeur, et qu'a-t-elle rendu plus précieux ? Donne un exemple de\n   chaque pour ton contenu.\n2. Pourquoi publier 30 posts 100 % IA est-il perdant sur *deux* plans (audience ET algo) ?\n3. Dans la chaîne de création, cite 2 tâches que tu délègues à l'IA et 2 que tu gardes absolument.\n4. Ce reflux anti-IA est-il une certitude gravée ou une tendance à surveiller ? Comment le traites-tu ?\n\n## Cartes de rappel → `revision-espacee.md`\n\n- L'IA a dévalué le contenu moyen (gratuit) et revalorisé POV/voix/vécu humain (rares).\n- 100 % automatisé = s'aligner sur la moyenne = perdre (audience + algo).\n- Modèle : l'IA propose, l'humain dispose ; jamais déléguer le choix et la voix.\n"},{"id":"20","kind":"fiche","num":"20","title":"IA & contenu 2 : GEO, détection, workflow humain","group":"Parcours (ordre conseillé)","icon":"🧠","tag":"Théorie","timeless":false,"volatile":true,"md":"# Fiche 20 — IA & contenu 2 : GEO, détection, workflow humain\n\n- **Type :** 🧠 Théorie · **Nature :** ⚡ VOLATILE (valide au : 17/07/2026 — re-vérifier tous les 2–3 mois) · **Durée :** ~1 h · **Prérequis :** Fiche 19\n- **Terrain :** —\n\n## Objectifs\n\n1. Comprendre le GEO (être cité *dans* les réponses IA) et son degré d'incertitude actuel.\n2. Savoir comment audiences et plateformes détectent le contenu IA.\n3. Poser les règles d'un workflow IA-humain reproductible (préparé pour la fiche 21).\n\n## 1. GEO — Generative Engine Optimization\n\nDe plus en plus de recherches finissent dans une **réponse d'IA** (assistants, résumés, overviews)\nplutôt que sur une page de résultats. Le nouveau terrain : être **cité dans ces réponses**. Ce qu'on\nobserve en 2026 :\n- Les moteurs génératifs sélectionnent leurs sources sur la **structure, l'autorité et la densité\n  d'information**, plus que sur les backlinks/mots-clés d'hier.\n- **YouTube a dépassé Reddit** comme source la plus citée début 2026 : les modèles aiment les\n  transcripts et les formats explicatifs.\n\n**Implication pratique pour toi :** un contenu clair, structuré (titres, listes, réponses directes à\ndes questions précises), qui *répond* franchement, a plus de chances d'être repris par une IA — et\ndonc de te ramener une visibilité que tu ne contrôles pas mais qui compte. Pour InvoiceLab, être *la*\nréponse claire à « comment faire une facture conforme en auto-entrepreneur » a de la valeur GEO.\n\n> ⚠️ **Fort niveau d'incertitude (débattu).** La mesure du GEO est jeune et volatile, les\n> méthodologies varient, et personne ne « connaît » l'algo des moteurs génératifs. **À surveiller,\n> pas à sur-investir** tant que tu n'as pas saturé les canaux plus sûrs (feeds courts, LinkedIn/X).\n> Ne réoriente pas ta stratégie autour du GEO aujourd'hui ; garde-le à l'œil.\n\n## 2. La détection du contenu IA (par les humains et les plateformes)\n\n- **Par les audiences :** en 2026, les gens sont *entraînés* à repérer les marqueurs IA — lissage\n  excessif, structures trop propres, absence d'aspérité, exemples génériques, ton « corporate\n  neutre ». Le rejet est immédiat (fiche 19). La parade n'est pas de « tromper le détecteur » mais\n  d'**injecter du vrai** : ton vécu, un détail que seule une IA n'aurait pas.\n- **Par les plateformes :** elles pénalisent le « mass-produced » (fiche 04) et poussent des\n  **labels de contenu IA** (déclaratifs et/ou automatiques). La direction réglementaire (UE) va vers\n  plus de transparence. Ne construis pas ta stratégie sur le fait de *cacher* que tu utilises l'IA ;\n  construis-la sur le fait que ton contenu a de la valeur *que l'IA seule ne peut pas produire*.\n\n## 3. Les règles d'un workflow IA-humain (socle de la fiche 21)\n\n1. **L'humain d'abord sur l'angle et l'insight.** Ne demande pas à l'IA « écris-moi un post » ; tu\n   décides l'angle et l'insight vécu, l'IA aide à *dérouler*.\n2. **L'IA pour la divergence, l'humain pour la convergence.** Générer beaucoup (20 hooks), *toi* tu\n   choisis (fiche 19).\n3. **Toujours une passe humaine de « désIAisation »** : ajouter un exemple réel, casser le rythme\n   trop lisse, remettre ta voix, retirer le générique.\n4. **Fact-check systématique** : l'IA invente (dates, chiffres, sources). Rien de factuel ne part sans\n   vérification — surtout sur du contenu à autorité (fiche 14).\n5. **Garder la trace de ce qui est vérifié vs généré** (comme les étiquettes ⏳/⚡ de cette formation).\n\n## Explique-moi (Feynman)\n\nExplique pourquoi « optimiser pour tromper les détecteurs d'IA » est la mauvaise bataille, et quelle\nest la bonne (indice : valeur incopiable, pas camouflage).\n\n## Quiz génératif\n\n1. Qu'est-ce que le GEO, et pourquoi je te dis de le *surveiller* sans *réorienter* ta stratégie\n   dessus aujourd'hui ?\n2. Cite 3 marqueurs qui font qu'une audience sent le « contenu IA ».\n3. Quelles sont les 2 seules choses non négociables dans un workflow IA-humain ?\n4. Pourquoi YouTube gagne-t-il en valeur à l'ère des réponses IA ?\n\n## Cartes de rappel → `revision-espacee.md`\n\n- GEO = être cité dans les réponses IA (structure/autorité/densité) — à surveiller, pas sur-investir (débattu).\n- Détection IA : la parade = injecter du vrai (vécu, aspérité), pas tromper le détecteur.\n- Workflow : humain sur l'angle + convergence + désIAisation + fact-check obligatoire.\n"},{"id":"21","kind":"fiche","num":"21","title":"Construire ton workflow IA-humain","group":"Parcours (ordre conseillé)","icon":"🛠️","tag":"Pratique","timeless":true,"volatile":true,"md":"# Fiche 21 — Construire ton workflow IA-humain 🛠️\n\n- **Type :** 🛠️ Pratique · **Nature :** ⚡ (l'outillage bouge) + ⏳ (le principe) · **Durée :** ~1 h · **Prérequis :** Fiches 19, 20\n- **Terrain :** Les deux\n\n## L'exercice\n\nTu construis **ton** processus reproductible de création de contenu IA-humain, puis tu le testes sur\nun vrai contenu. Objectif : un workflow que tu pourrais suivre chaque semaine sans réfléchir.\n\n### Livrable 1 — Le workflow documenté\n\nÉcris ta chaîne en étapes numérotées, en précisant **à chaque étape qui fait quoi (toi / IA)** et\n**le garde-fou**. Il doit inclure, au minimum :\n1. Choix de l'angle + insight vécu → **toi**.\n2. Divergence (générer N options) → **IA** (colle ton prompt réel).\n3. Convergence (choisir/trancher) → **toi**.\n4. Rédaction/déroulé → IA assistée.\n5. Passe de « désIAisation » (exemple réel, voix, aspérité) → **toi**.\n6. Fact-check → **toi** (liste ce que tu vérifies).\n7. Adaptation multi-format (fiche 25) → IA + ta relecture.\n\nInclure **le(s) prompt(s) system** que tu utiliseras vraiment (un pour générer des hooks, un pour\ncritiquer, un pour repurposer). Un bon prompt contient : ton contexte (qui, pour qui, ta voix), la\ntâche précise, les contraintes (fiche 03/07), et le format de sortie.\n\n### Livrable 2 — Un test réel\n\nFais tourner ton workflow sur **un** contenu (ex. un post InvoiceLab) et colle : la sortie brute de\nl'IA **et** ta version finale après désIAisation. L'écart entre les deux est la preuve que ton\ngarde-fou humain sert à quelque chose.\n\n## Grille de notation (/20)\n\n| Axe | Ce que je regarde |\n|---|---|\n| **Spécificité** | Prompts concrets et réutilisables (pas « fais-moi un bon post ») ? Garde-fous précis ? |\n| **Mécanique** | Divergence IA / convergence humaine bien séparées ; désIAisation + fact-check présents ? |\n| **Clarté** | Le workflow est suivable par un toi pressé un lundi matin ? |\n| **Adéquation** | La version finale a une vraie voix + un insight réel absent de la sortie brute ? |\n\nColle les 2 livrables dans `journal-de-progression.md`. Je note surtout **l'écart brut → final** :\ns'il est faible, ton garde-fou humain est décoratif et tu publies de la moyenne (fiche 19).\n\n## Anti-triche\n\n- Le test doit montrer une **vraie** différence entre la sortie IA et ta version. Si elles sont\n  quasi identiques, tu n'as pas fait le travail humain — c'est précisément le piège de la fiche 19.\n- Ne colle pas un prompt « théorique » : colle celui que tu utiliserais *vraiment*, avec ton contexte.\n\n## Explique-moi (Feynman)\n\nMontre ton écart brut → final et explique en une phrase *ce que ta main humaine a ajouté* que l'IA ne\npouvait pas. Si tu ne trouves pas, refais la passe de désIAisation.\n\n## Cartes de rappel → `revision-espacee.md`\n\n- Workflow = toi (angle/choix/voix/fact-check) + IA (volume/déroulé/formats).\n- Le prompt system contient : contexte + voix + tâche + contraintes + format.\n- Test de validité : l'écart entre la sortie brute et ta version finale doit être net.\n"},{"id":"22","kind":"fiche","num":"22","title":"LinkedIn pour le fondateur solo","group":"Parcours (ordre conseillé)","icon":"🧠","tag":"Théorie","timeless":false,"volatile":true,"md":"# Fiche 22 — LinkedIn pour le fondateur solo\n\n- **Type :** 🧠 Théorie · **Nature :** ⚡ VOLATILE (valide au : 17/07/2026 — re-vérifier tous les 2–3 mois) · **Durée :** ~1 h · **Prérequis :** Fiches 03, 17\n- **Terrain :** InvoiceLab (B2B/freelance)\n\n## Objectifs\n\n1. Comprendre ce que l'algo LinkedIn récompense en 2026 et pourquoi.\n2. Construire un post LinkedIn qui gagne la « première heure ».\n3. Éviter les 3 erreurs qui plombent la portée.\n\n## 1. Ce que LinkedIn récompense en 2026 (sourcé)\n\n- **Le dwell time (temps passé sur le post) est le juge n°1.** Écart massif rapporté : un post à\n  faible dwell time plafonne vers ~1 % d'engagement, un post à fort dwell time monte bien plus haut.\n  → ton objectif est de **retenir la lecture**, pas d'être vu.\n- **Le commentaire vaut ~15× un like.** Un commentaire réfléchi > un partage sans contexte > un save\n  > une réaction. → tu conçois pour *déclencher la conversation*, pas la validation passive.\n- **La première heure décide de la trajectoire** : LinkedIn teste ton post sur un petit échantillon\n  (tes connexions les plus engagées) ; un bon engagement précoce ouvre la diffusion plus large.\n- **Les liens externes coûtent ~−60 % de portée** : LinkedIn veut te garder sur la plateforme.\n- **Profil perso > page entreprise** : les posts de fondateurs portent nettement plus loin. Pour un\n  solo, poste depuis **ton** profil, pas depuis une page InvoiceLab.\n\n*(⚡ chiffres = estimations d'agences 2026, direction consensuelle. Re-vérifier.)*\n\n## 2. L'anatomie d'un post qui gagne le dwell time\n\n1. **Hook sur la 1re ligne** (fiche 03) : LinkedIn tronque le post avec « …voir plus ». Tout se joue\n   sur les 1–2 premières lignes qui décident du clic « voir plus » (le premier signal de dwell time).\n2. **Lisibilité aérée** : phrases courtes, retours à la ligne, respiration. Un pavé fait scroller ;\n   l'espace fait lire → dwell time.\n3. **Une idée, déroulée** : storytelling ou insight (fiches 07, 16). Le lecteur reste s'il *apprend*\n   ou se *reconnaît*.\n4. **Une question de fin** qui appelle un commentaire *facile et pertinent* (pas « qu'en pensez-vous ? »\n   plat, mais une question ciblée qui donne envie de répondre).\n\n## 3. La tactique « première heure »\n\n- **Poste quand ton audience est là** (⚡ à tester toi-même ; en B2B FR souvent en semaine, matin/midi).\n  Ne te fie pas à une « heure magique » universelle — mesure la tienne (fiche 30).\n- **Sois présent la première heure** : réponds à *chaque* commentaire (chaque réponse = engagement +\n  dwell time supplémentaires + signal de conversation). Cette présence active est le plus gros levier\n  gratuit sous-exploité.\n- **Le lien en commentaire, pas dans le post** : pour contourner la pénalité de portée des liens\n  externes, mets ton lien InvoiceLab en 1er commentaire (contournement courant ; ⚡ efficacité variable\n  — à surveiller).\n\n## 4. Les 3 erreurs qui plombent\n\n1. **Poster puis disparaître** — tuer la première heure en n'étant pas là pour lancer la conversation.\n2. **Le pavé sans hook** — pas de « voir plus » cliqué = dwell time à zéro.\n3. **Le lien dans le corps + le ton corporate** — double peine : pénalité de portée + zéro humanité\n   (fiche 19). LinkedIn 2026 récompense l'humain, pas le communiqué.\n\n## 5. Ce qui est ⏳ là-dessous\n\nLes poids (15×, −60 %, 1re heure) sont `⚡`. L'intemporel : **retenir l'attention (dwell) et déclencher\nla conversation (commentaire) sont des proxies de valeur** — une plateforme sociale récompensera\ntoujours ce qui garde les gens et les fait interagir. Apprends le principe, re-teste les chiffres.\n\n## Explique-moi (Feynman)\n\nExplique pourquoi, sur LinkedIn 2026, « avoir 5 000 abonnés » compte moins que « ce que font tes 50\npremiers lecteurs dans la première heure ».\n\n## Quiz génératif\n\n1. Range par valeur pour l'algo : like, commentaire réfléchi, réaction, partage sans contexte.\n2. Pourquoi la 1re ligne d'un post LinkedIn est-elle le point le plus critique ?\n3. Tu as un super post mais tu le publies et tu pars 6 h. Qu'est-ce que tu viens de saboter ?\n4. Comment gères-tu un lien vers InvoiceLab pour ne pas être pénalisé, et pourquoi c'est un\n   contournement « à surveiller » ?\n\n## Cartes de rappel → `revision-espacee.md`\n\n- LinkedIn 2026 : dwell time = juge n°1 ; commentaire ~15× le like ; 1re heure décisive ; liens −60 % ; profil > page.\n- Post qui gagne : hook 1re ligne (« voir plus ») + aéré + une idée + question qui fait commenter.\n- Le plus gros levier gratuit : répondre à chaque commentaire la 1re heure.\n"},{"id":"23","kind":"fiche","num":"23","title":"X (Twitter) pour le fondateur solo","group":"Parcours (ordre conseillé)","icon":"🧠","tag":"Théorie","timeless":false,"volatile":true,"md":"# Fiche 23 — X (Twitter) pour le fondateur solo\n\n- **Type :** 🧠 Théorie · **Nature :** ⚡ VOLATILE (valide au : 17/07/2026 — plateforme très instable, re-vérifier souvent) · **Durée :** ~1 h · **Prérequis :** Fiches 03, 22\n- **Terrain :** InvoiceLab (B2B/tech/indie)\n\n## Objectifs\n\n1. Comprendre le modèle de ranking de X en 2026 et sa forte instabilité.\n2. Adapter ta production aux signaux qui comptent (réponse, marque-page).\n3. Décider si X vaut ton temps pour ton cas.\n\n## 1. Le modèle de score (sourcé, mais prudence)\n\nLe code de ranking de X, partiellement public, pondère les engagements très différemment. Estimation\n2026 couramment citée :\n\n```\nLike × 1 · Bookmark × 10 · Lien cliqué × 11 · Clic profil × 12 · Réponse × 13,5 · Repost × 20\n```\n\nLectures clés :\n- **La réponse est le signal roi** (avec le repost) : X optimise pour la *conversation*. Un post à 50\n  réponses / 10 likes bat un post à 10 réponses / 500 likes.\n- **Le marque-page (bookmark) pèse lourd** (~10×) : c'est le signal « contenu à garder/utile » — le\n  X-équivalent du save/send (fiche 09). Concevoir pour être *sauvegardé* (threads utiles, frameworks).\n- **Le lien externe est puni** : depuis 2026, portée quasi nulle des liens hors Premium.\n- **X Premium = multiplicateur de portée** (×2 à ×4 selon les sources).\n\n> ⚠️ **Le plus volatile de toutes les fiches.** X change ses règles souvent et sans préavis ; les poids\n> et le boost Premium sont **débattus** et instables. Traite tout ceci comme une *direction du mois*,\n> pas comme une constante. C'est le premier endroit à re-vérifier dans `mise-a-jour.md`.\n\n## 2. Ce que ça change pour ta production\n\n- **Écris pour la réponse** : opinions tranchées (défendables, fiche 09), questions ouvertes, prises\n  de position sur ta niche (facturation, indie hacking, freelancing FR).\n- **Écris pour le bookmark** : threads « utiles à garder » (checklists, frameworks, retours\n  d'expérience chiffrés). Le contenu-outil (fiche 09) marche autant ici.\n- **Garde les liens hors du post principal** (en réponse au thread), comme sur LinkedIn.\n- **Le format thread** reste fort pour dérouler un récit/tutoriel et cumuler les signaux.\n\n## 3. X vaut-il ton temps ? (décision honnête)\n\nX est puissant pour un solo **dans certaines niches** : tech, SaaS, indie hacking, build in public,\ncrypto. La communauté indie/dev y est très active et réactive — idéal pour InvoiceLab *si* tu vises\ncette audience. Mais :\n- Le **coût de la conversation** est élevé (il faut répondre, débattre, être présent).\n- L'audience **française grand public** y est moins massive que sur TikTok/Insta (fiche : instantané\n  France, §2 du curriculum).\n- Le **boost Premium** signifie qu'un démarrage sans Premium est plus dur qu'avant.\n\n**Recommandation :** pour InvoiceLab, X est pertinent *si* tu joues la carte indie/build-in-public\nauprès d'une audience tech/freelance internationale ; secondaire si tu vises l'auto-entrepreneur FR\nlambda (là, LinkedIn > X). Ne te disperse pas : mieux vaut exceller sur *une* plateforme que survivre\nsur trois (fiche 25).\n\n## Explique-moi (Feynman)\n\nExplique pourquoi un même contenu « thread utile » peut cartonner sur X *et* servir de post LinkedIn,\nmais pourquoi la mécanique de récompense n'est pas identique (réponse/bookmark vs dwell/commentaire).\n\n## Quiz génératif\n\n1. Range par poids : like, réponse, repost, bookmark. Qu'est-ce que ça t'apprend sur ce que X veut ?\n2. Pourquoi mettre un lien InvoiceLab dans le corps d'un tweet est-il une mauvaise idée en 2026 ?\n3. Cette fiche est la plus `⚡` de toutes. Concrètement, qu'est-ce que ça change à la confiance que tu\n   accordes à ses chiffres ?\n4. Pour l'auto-entrepreneur FR lambda, X ou LinkedIn en priorité ? Justifie.\n\n## Cartes de rappel → `revision-espacee.md`\n\n- X 2026 : réponse (~13,5×) et repost (~20×) rois ; bookmark (~10×) = « à garder » ; liens punis ; Premium multiplie.\n- Écrire pour la réponse (opinions/questions) et le bookmark (threads utiles).\n- Fiche la plus instable : direction du mois, pas constante — re-vérifier en premier.\n- Choisir SA plateforme plutôt que se disperser.\n"},{"id":"24","kind":"fiche","num":"24","title":"5 posts + plan « première heure »","group":"Parcours (ordre conseillé)","icon":"🛠️","tag":"Pratique","timeless":false,"volatile":true,"md":"# Fiche 24 — 5 posts + plan « première heure » 🛠️\n\n- **Type :** 🛠️ Pratique · **Nature :** ⚡ (calé sur LinkedIn/X 2026) · **Durée :** ~1 h · **Prérequis :** Fiches 22, 23\n- **Terrain :** InvoiceLab\n\n## L'exercice\n\nProduis **5 posts** prêts à publier (LinkedIn ou X, tu choisis la plateforme selon la fiche 23) autour\nd'InvoiceLab / du monde du freelance, en variant les intentions, + un **plan « première heure »**.\n\n### Livrable 1 — Les 5 posts\n\nVarie délibérément les types (au moins 4 des 5 ci-dessous) :\n1. **Post-histoire** (récit fondateur / build in public, fiche 17).\n2. **Post-utile à sauvegarder** (checklist/framework — vise le bookmark/save, fiche 09).\n3. **Post-opinion tranchée** (vise la réponse/le commentaire, fiche 22/23).\n4. **Post-preuve** (un résultat, une leçon chiffrée).\n5. **Post-question ciblée** (déclenche la conversation).\n\nChaque post doit respecter : hook en 1re ligne (fiche 03), une idée (fiche 07), format adapté à la\nplateforme (aéré LinkedIn / thread ou punch X), lien **hors du corps** si besoin. Indique pour chacun\n**quel signal** il vise (dwell, commentaire, bookmark…).\n\n### Livrable 2 — Le plan « première heure »\n\nÉcris ta checklist opérationnelle pour le lancement d'un post :\n- Quand tu le postes (et *comment* tu as choisi ce créneau — mesuré, pas deviné).\n- Ce que tu fais dans les 60 premières minutes (réponses, relances).\n- Comment tu formules 2–3 réponses-type pour lancer la conversation.\n\n## Grille de notation (/20)\n\n| Axe | Ce que je regarde |\n|---|---|\n| **Spécificité** | Posts concrets, insight réel, test « un concurrent peut-il copier ? » |\n| **Mécanique** | Variété d'intentions + chaque post vise le bon signal de la plateforme ; hook 1re ligne ; lien géré |\n| **Clarté** | Une idée par post, lisible, format natif à la plateforme |\n| **Adéquation** | Parle au vrai freelance FR ; plan 1re heure réaliste pour un solo |\n\nColle les 5 posts + le plan dans `journal-de-progression.md`. Je note et je te dis lequel je publierais\nen premier et pourquoi.\n\n## Anti-triche\n\n- Pas 5 variantes du même post : 5 *intentions* différentes (c'est l'entraînement au registre).\n- Le plan « première heure » n'est pas décoratif : c'est le levier n°1 gratuit (fiche 22). Traite-le\n  aussi sérieusement que les posts.\n\n## Explique-moi (Feynman)\n\nPour ton post-opinion, anticipe à voix haute *la première réponse contradictoire* qu'il va générer.\nSi tu n'en vois aucune, ton opinion n'est pas assez tranchée pour déclencher la conversation.\n\n## Cartes de rappel → `revision-espacee.md`\n\n- 5 posts = 5 intentions (histoire, utile, opinion, preuve, question), chacune visant un signal précis.\n- Hook en 1re ligne + lien hors du corps, toujours.\n- Le plan « première heure » vaut autant que les posts.\n"},{"id":"25","kind":"fiche","num":"25","title":"Distribution : hub & spokes, repurposing","group":"Parcours (ordre conseillé)","icon":"🧠","tag":"Théorie","timeless":true,"volatile":true,"md":"# Fiche 25 — Distribution : hub & spokes, repurposing\n\n- **Type :** 🧠 Théorie · **Nature :** ⏳ Intemporel (principe) + ⚡ (formats) · **Durée :** ~1 h · **Prérequis :** Fiches 09, 19\n- **Terrain :** —\n\n## Objectifs\n\n1. Passer d'une logique « un post = un effort » à un système de distribution démultipliée.\n2. Maîtriser le modèle hub & spokes et le repurposing intelligent.\n3. Adapter (pas copier-coller) un contenu d'une plateforme à l'autre.\n\n## 1. Le problème du solo : le temps\n\nTu es seul, ton temps est la ressource rare. La création part de zéro à chaque fois = tu ne tiendras\npas le rythme (or la constance est décisive : fiches 22, 36). La solution n'est pas de produire *plus*\nd'idées, c'est d'**extraire plus de contenu par idée**. Un créateur pro ne fait pas 20 idées/semaine ;\nil fait 1–2 idées fortes qu'il décline en 20 contenus.\n\n## 2. Le modèle hub & spokes\n\n- **Hub :** un contenu « pilier » dense — une vidéo longue, un article, un thread de fond, un épisode\n  live. Il porte une idée forte, travaillée.\n- **Spokes :** des dérivés courts extraits du hub — un clip vertical, 3 posts, une citation, une\n  checklist, un carrousel. Chacun vit sur une plateforme et *renvoie* vers l'écosystème.\n\nUn hub bien pensé = 8–15 spokes. Tu multiplies ta présence sans multiplier ta charge créative. Bonus\n2026 : le hub vidéo (YouTube) a aussi de la valeur **GEO** (fiche 20).\n\n## 3. Repurposing ≠ copier-coller\n\nReposter à l'identique est puni (watermark, contenu « recyclé » : fiche 04). **Adapter** veut dire\nrespecter la *mécanique de récompense* de chaque plateforme (compétence des fiches 04, 22, 23) :\n\n| Plateforme | Ce qu'on adapte |\n|---|---|\n| TikTok/Reels/Shorts | Hook visuel 2 s, démonstration, fin pensée pour le send |\n| LinkedIn | Hook 1re ligne, format aéré, angle pro, question → commentaire |\n| X | Thread « à bookmarker », opinion → réponse, punch |\n| Newsletter/blog | Version dense, structurée (valeur GEO) |\n\nMême *fond* (l'idée), *forme* différente (comme ton récit fondateur en 3 formats, fiche 18). Le\nrepurposing intelligent, c'est l'application du même principe à toute ta production.\n\n## 4. Où l'IA entre (fiche 19-21)\n\nLe repurposing est *le* endroit où l'IA t'aide le plus honnêtement : décliner un contenu validé en N\nformats est un travail de transformation, pas de création d'insight → délégable, sous ta relecture\n(désIAisation légère + adaptation de la mécanique par plateforme). C'est ton multiplicateur de temps\nn°1.\n\n## 5. La cadence réaliste d'un solo\n\nMieux vaut **1 plateforme tenue** que 4 abandonnées. Choisis 1 plateforme principale (selon ta cible :\nfeeds courts pour B2C, LinkedIn/X pour B2B), 1 hub régulier, et des spokes. Étends seulement quand le\nsystème tourne sans t'épuiser. La constance bat l'intensité ponctuelle (fiche 36).\n\n## Explique-moi (Feynman)\n\nExplique pourquoi « produire 1 hub + 10 spokes » est plus malin pour un solo que « produire 11 posts\nindépendants », en parlant de temps *et* de cohérence de message.\n\n## Quiz génératif\n\n1. Définis hub et spoke avec un exemple concret pour InvoiceLab (quel hub, quels spokes ?).\n2. Pourquoi copier-coller ta vidéo TikTok sur Reels et LinkedIn est-il une mauvaise idée sur *deux*\n   plans ?\n3. Quelle tâche du repurposing peux-tu déléguer à l'IA sans trahir la fiche 19, et laquelle non ?\n4. Pourquoi « 1 plateforme tenue > 4 abandonnées » pour un solo ?\n\n## Cartes de rappel → `revision-espacee.md`\n\n- Ne pas multiplier les idées : multiplier les contenus par idée (hub & spokes, 1 hub → 8-15 spokes).\n- Repurposing = adapter la *mécanique* par plateforme, jamais copier-coller (puni).\n- L'IA excelle au repurposing (transformation), sous relecture humaine.\n- Constance > intensité : 1 plateforme tenue d'abord.\n"},{"id":"26","kind":"fiche","num":"26","title":"1 idée → 6 formats","group":"Parcours (ordre conseillé)","icon":"🛠️","tag":"Pratique","timeless":true,"volatile":false,"md":"# Fiche 26 — 1 idée → 6 formats 🛠️\n\n- **Type :** 🛠️ Pratique · **Nature :** ⏳ Intemporel · **Durée :** ~1 h · **Prérequis :** Fiches 18, 25\n- **Terrain :** Les deux (choisis 1 idée sur InvoiceLab OU la boutique)\n\n## L'exercice\n\nPrends **une seule idée forte** et décline-la en **6 formats** différents, en adaptant la mécanique de\nchaque plateforme (fiche 25). C'est l'entraînement au multiplicateur de temps du solo.\n\n### Choisis ton hub (l'idée)\n\nUne idée qui porte, par exemple :\n- InvoiceLab : « Une facture non conforme peut être refusée / entraîner un redressement — voici les\n  mentions obligatoires que tout auto-entrepreneur FR doit avoir. »\n- Boutique : « Pourquoi tu dors mal pendant la canicule et les 3 gestes qui changent tout. »\n\n### Livrable — 6 déclinaisons\n\n1. **Script vidéo courte** (TikTok/Reels/Shorts) : hook 2 s + démonstration + fin pour le send.\n2. **Post LinkedIn** : hook 1re ligne, aéré, angle pro, question finale.\n3. **Thread X** (3–5 tweets) : « à bookmarker », punch, opinion.\n4. **Carrousel** (5 slides) : titre-hook, 3 slides de contenu, 1 slide CTA.\n5. **Légende courte + visuel** (post Insta statique) : une accroche + une idée.\n6. **Format « hub »** : le plan d'une vidéo longue OU d'une mini-newsletter dense (valeur GEO, fiche 20).\n\nPour chaque format, note **le signal principal visé** et **ce que tu as adapté** par rapport au fond.\n\n## Grille de notation (/20)\n\n| Axe | Ce que je regarde |\n|---|---|\n| **Spécificité** | Chaque format a du concret ; l'idée reste précise partout |\n| **Mécanique** | Vraie *adaptation* par plateforme (pas 6 copier-coller) ; bon signal visé à chaque fois |\n| **Clarté** | Le fond reste reconnaissable et net à travers les 6 formes |\n| **Adéquation** | Formats réalistes à produire pour un solo ; cohérents avec la cible |\n\nColle les 6 dans `journal-de-progression.md`. Je note surtout si tu as **adapté** ou juste\n**recopié** — c'est toute la différence entre un système et du bruit.\n\n## Anti-triche\n\n- Le test : mets tes 6 formats côte à côte. Si on sent que ce sont 6 copier-coller, tu as raté\n  l'adaptation (fiche 04 : contenu recyclé = down-rank).\n- Garde le **même fond** partout. Si l'idée dérive de format en format, tu n'as pas fait du\n  repurposing, tu as fait 6 idées à moitié.\n\n## Explique-moi (Feynman)\n\nPrends ta version TikTok et ta version LinkedIn et explique en une phrase *ce que tu as changé et\npourquoi*, en citant la mécanique de récompense de chaque plateforme.\n\n## Cartes de rappel → `revision-espacee.md`\n\n- 1 idée → 6 formes : même fond, mécanique adaptée par plateforme.\n- Le test anti-copier-coller : les 6 côte à côte ne doivent pas se ressembler formellement.\n- C'est le multiplicateur de temps n°1 du solo.\n"},{"id":"27","kind":"fiche","num":"27","title":"Boucles virales & mécanique de partage","group":"Parcours (ordre conseillé)","icon":"🧠","tag":"Théorie","timeless":true,"volatile":true,"md":"# Fiche 27 — Boucles virales & mécanique de partage\n\n- **Type :** 🧠 Théorie · **Nature :** ⏳ Intemporel (avec exemples ⚡) · **Durée :** ~1 h · **Prérequis :** Fiches 09, 13\n- **Terrain :** —\n\n## Objectifs\n\n1. Distinguer « viral » (coup de chance) de « boucle virale » (système reproductible).\n2. Comprendre le facteur K et pourquoi la plupart des boucles échouent.\n3. Repérer les boucles réalistes pour un solo à petit budget.\n\n## 1. Viral ≠ boucle virale\n\nUn contenu **viral** est un événement ponctuel, largement chanceux — non reproductible, mauvaise base\nde stratégie (fiche 31 : ne confonds pas chance et compétence). Une **boucle virale** est un *mécanisme\nintégré au produit ou au contenu* où chaque utilisateur en amène d'autres, encore et encore. L'un est\nun feu d'artifice ; l'autre est un moteur.\n\n## 2. L'anatomie d'une boucle\n\nUne boucle = un cycle qui se répète :\n\n```\nUn utilisateur obtient de la valeur → une action qu'il fait naturellement\nexpose le produit à de nouveaux users → certains s'inscrivent → qui à leur\ntour obtiennent de la valeur → …\n```\n\nLa clé : l'exposition doit être **intégrée à l'usage/à la valeur**, pas greffée. Exemples de types :\n- **Boucle de contenu :** ton contenu est si utile/partageable qu'il amène des gens qui produisent à\n  leur tour (fiche 09, le send). C'est *ta* boucle principale de solo.\n- **Boucle produit intrinsèque :** le produit expose la marque quand on l'utilise. *Ex InvoiceLab :*\n  une facture générée pourrait porter une mention discrète « Facture créée avec InvoiceLab » →\n  chaque client d'un freelance voit le produit. (À doser : la valeur d'abord, la pub ensuite, sinon\n  ça dévalorise l'outil.)\n- **Boucle d'incitation :** parrainage (« invite un ami, vous gagnez tous les deux »). Puissant mais\n  coûteux et sujet aux abus — prudence en petit budget.\n\n## 3. Le facteur K (et pourquoi la plupart des boucles ratent)\n\nLe **facteur K** = nombre de nouveaux utilisateurs qu'un utilisateur amène en moyenne.\n- K > 1 → croissance auto-entretenue (rare, magique).\n- K < 1 → la boucle *amplifie* l'acquisition sans l'auto-entretenir (cas réaliste et déjà très utile).\n\nVérité sobre : **la vraie viralité auto-entretenue (K>1) est extrêmement rare.** La plupart des\n« hacks de croissance » vendus n'y arrivent pas. Objectif réaliste pour toi : des boucles qui\n*réduisent ton coût d'acquisition* (chaque client en amène un peu plus), pas le mythe de la\ncroissance exponentielle gratuite. Viser K>1 est un piège à espoir ; viser « K aussi haut que\npossible » est une stratégie.\n\n## 4. Deux leviers pour remonter le K\n\n1. **Augmenter le taux de partage** — rendre l'action de partage naturelle et gratifiante (fiche 09 :\n   les 6 moteurs). Plus le contenu/produit donne du *social currency*, plus on l'expose.\n2. **Réduire le cycle** — plus le temps entre « je reçois de la valeur » et « j'expose à d'autres »\n   est court, plus la boucle tourne vite. Un produit à valeur immédiate (InvoiceLab : 40 s) a un cycle\n   court.\n\n## Explique-moi (Feynman)\n\nExplique la différence entre « ma vidéo a fait 1 M de vues une fois » et « j'ai une boucle virale »,\net pourquoi seule la seconde est une stratégie.\n\n## Quiz génératif\n\n1. Un contenu fait le buzz une fois. Est-ce une boucle ? Pourquoi c'est une base fragile ?\n2. Décris une boucle de contenu réaliste pour la boutique canicule (qui expose à qui, via quelle\n   action naturelle ?).\n3. Qu'est-ce que le facteur K, et pourquoi viser K>1 est-il un piège pour un solo ?\n4. Cite les 2 leviers pour remonter le K et illustre « réduire le cycle » avec InvoiceLab.\n\n## Cartes de rappel → `revision-espacee.md`\n\n- Viral (chance ponctuelle) ≠ boucle virale (moteur intégré à la valeur).\n- L'exposition doit être intégrée à l'usage, pas greffée.\n- K>1 (auto-entretenu) est très rare : viser à *réduire le coût d'acquisition*, pas le mythe exponentiel.\n- Remonter le K : ↑ taux de partage (social currency) + ↓ durée du cycle.\n"},{"id":"28","kind":"fiche","num":"28","title":"UGC & micro-créateurs à petit budget","group":"Parcours (ordre conseillé)","icon":"🧠","tag":"Théorie","timeless":false,"volatile":true,"md":"# Fiche 28 — UGC & micro-créateurs à petit budget\n\n- **Type :** 🧠 Théorie · **Nature :** ⚡ VOLATILE (valide au : 17/07/2026 — re-vérifier tous les 2–3 mois) · **Durée :** ~1 h · **Prérequis :** Fiches 13, 19\n- **Terrain :** Boutique canicule (B2C)\n\n## Objectifs\n\n1. Comprendre pourquoi l'UGC et les micro-créateurs battent la pub léchée en 2026.\n2. Savoir sourcer et briefer des créateurs à petit budget.\n3. Éviter les pièges (faux UGC, mauvais créateurs, absence de droits).\n\n## 1. Pourquoi l'UGC gagne en 2026\n\n**UGC = User-Generated Content** : du contenu qui *ressemble* à un vrai utilisateur, pas à une pub.\nDeux forces le rendent dominant :\n- **La prime à l'authenticité** (fiche 19) : après l'inondation de contenu lisse/IA, le brut, le\n  « filmé au téléphone », l'imparfait convertit mieux qu'une vidéo studio. L'audience 2026 se méfie du\n  trop-beau.\n- **La preuve sociale** (fiche 13) : voir un vrai humain « comme moi » utiliser le produit désarme le\n  scepticisme mieux qu'une marque qui se vante. C'est la forme de preuve la plus crédible.\n\nEn paid (fiche 34), l'UGC est souvent le **format créatif le plus performant** — et comme le débit\ncréatif est ton vrai levier (fiche 34), une source d'UGC est un atout stratégique.\n\n## 2. Micro-créateurs > macro (pour toi)\n\n| | Macro-influenceur | Micro-créateur (1k–50k) |\n|---|---|---|\n| Coût | Élevé | Faible (parfois échange produit) |\n| Engagement | Souvent plus faible (audience large, tiède) | Souvent plus élevé (niche, confiance) |\n| Crédibilité | « post sponso » évident | Plus proche, plus authentique |\n| Ciblage | Diffus | Niche précise (canicule, gadgets, parents…) |\n\nPour un petit budget, **plusieurs micro-créateurs bien ciblés** > un macro cher. Bonus : tu obtiens\nplusieurs créas à tester (fiche 34), pas une seule.\n\n## 3. Sourcer et briefer (à petit budget)\n\n**Sourcer :**\n- Cherche dans ta niche (chaleur/été, gadgets maison, parents, sommeil) des comptes 1k–50k avec un\n  *engagement réel* (commentaires vrais, pas juste des likes — attention aux faux abonnés).\n- Approche par un message personnalisé (fiche 29) : montre que tu connais leur contenu.\n- Modèles de deal petit budget : produit offert, petit fixe, ou commission d'affiliation (code promo\n  traçable → mesurable, fiche 30).\n\n**Briefer sans tuer l'authenticité :**\n- Donne l'**angle et le problème à montrer** (fiche 06, PAS), *pas* un script mot à mot. Un script\n  rigide produit une pub qui sonne faux.\n- Laisse leur *voix* et leur format habituel (c'est ce qui marche sur leur audience).\n- Précise les **incontournables** : le hook doit montrer le problème/produit vite (fiche 03/04), une\n  démonstration, un CTA clair.\n- **Toujours négocier les droits d'usage** (whitelisting/ads) : pouvoir réutiliser leur vidéo en pub\n  démultiplie la valeur. À cadrer dès le départ.\n\n## 4. Les pièges\n\n- **Le faux UGC** (une pub déguisée en spontané, sans le dire) : de plus en plus détecté par\n  l'audience et **encadré légalement** (transparence des partenariats commerciaux, obligation FR/UE de\n  signaler #ad/collaboration). Reste transparent — c'est la loi *et* c'est plus efficace à terme.\n- **Le mauvais créateur** : gros chiffres, faux engagement → zéro vente. Regarde les commentaires,\n  pas les followers.\n- **Pas de droits** : payer une vidéo que tu ne peux pas réutiliser en ads = valeur perdue.\n\n## Explique-moi (Feynman)\n\nExplique pourquoi une vidéo « moche » filmée au téléphone par un micro-créateur peut convertir mieux\nqu'un spot pro à gros budget, en 2026.\n\n## Quiz génératif\n\n1. Deux raisons pour lesquelles l'UGC surperforme la pub léchée aujourd'hui.\n2. Pour 500 € de budget, un macro ou cinq micro ? Justifie avec 2 arguments.\n3. Pourquoi brief-on l'angle mais pas un script mot à mot ?\n4. Quelles deux choses négocier/vérifier absolument avant de collaborer (indice : droits + un signal\n   de qualité d'audience) ?\n\n## Cartes de rappel → `revision-espacee.md`\n\n- UGC gagne en 2026 : authenticité (fiche 19) + preuve sociale (fiche 13) ; top format en paid.\n- Micro > macro pour petit budget : moins cher, plus engagé, plus ciblé, plusieurs créas.\n- Briefer l'angle, pas le script ; toujours négocier les droits d'usage (ads).\n- Juger un créateur aux commentaires, pas aux followers ; transparence #ad obligatoire.\n"},{"id":"29","kind":"fiche","num":"29","title":"Plan d'approche de 10 micro-créateurs","group":"Parcours (ordre conseillé)","icon":"🛠️","tag":"Pratique","timeless":false,"volatile":true,"md":"# Fiche 29 — Plan d'approche de 10 micro-créateurs 🛠️\n\n- **Type :** 🛠️ Pratique · **Nature :** ⚡ (calé sur 2026) · **Durée :** ~1 h · **Prérequis :** Fiche 28\n- **Terrain :** Boutique canicule\n\n## L'exercice\n\nConstruis un **plan d'outreach réel** pour recruter des micro-créateurs pour le produit canicule :\nune short-list, un template de message, une offre, et un brief.\n\n### Livrable 1 — La short-list (10 profils, critères)\n\nUn tableau de 10 cibles (réelles ou réalistes si tu ne veux pas fouiller les vrais comptes) :\n\n| # | Créateur / niche | Taille | Pourquoi lui (fit avec canicule) | Signal d'engagement réel à vérifier |\n|---|---|---|---|---|\n\nLe point noté n'est pas d'avoir de vrais handles, c'est ta **méthode de sélection** : niche pertinente,\nengagement réel (commentaires), audience FR, cohérence avec le produit.\n\n### Livrable 2 — Le message d'approche (template)\n\nUn message court et personnalisable. Il doit : montrer que tu connais leur contenu (1 détail précis),\nproposer une valeur claire, être bref, et donner un *next step* simple. Interdits : le copier-coller\ngénérique « Bonjour, super compte ! », la demande floue.\n\n### Livrable 3 — L'offre + le brief\n\n- **L'offre** : ce que tu proposes (produit offert / fixe / affiliation avec code traçable) et\n  **pourquoi elle est réaliste pour ta marge** (fiche 33).\n- **Le brief** : l'angle et le problème à montrer (PAS), les 3 incontournables (hook rapide, démo,\n  CTA), la liberté laissée sur la voix, et la **mention des droits d'usage** + transparence #ad.\n\n## Grille de notation (/20)\n\n| Axe | Ce que je regarde |\n|---|---|\n| **Spécificité** | Critères de sélection concrets ; message avec une vraie personnalisation |\n| **Mécanique** | Micro bien ciblés, engagement > followers, brief = angle pas script, droits + code traçable |\n| **Clarté** | Message court avec un next step évident ; offre lisible |\n| **Adéquation** | Réaliste pour une marge dropshipping ; transparence légale respectée |\n\nColle les 3 livrables dans `journal-de-progression.md`. Je note et je réécris ton message d'approche\ns'il sonne « copier-coller » (la cause n°1 d'échec de l'outreach).\n\n## Anti-triche\n\n- Le message doit contenir **une vraie personnalisation** possible (un champ « [détail que j'ai\n  remarqué sur ton compte] » ne suffit pas si tu ne montres pas *comment* tu le remplis).\n- L'offre doit passer le test de la marge : si tu ne peux pas te payer 5 de ces deals, revois-la.\n\n## Explique-moi (Feynman)\n\nLis ton message d'approche comme si tu étais le créateur qui en reçoit 20 par jour. Est-ce que tu\nrépondrais ? Qu'est-ce qui te ferait *supprimer* le tien ? Corrige ça.\n\n## Cartes de rappel → `revision-espacee.md`\n\n- Sélection : niche + engagement réel (commentaires) + fit produit, pas les followers.\n- Message : personnalisation réelle + valeur claire + next step simple ; jamais générique.\n- Offre testée contre la marge ; code promo traçable pour mesurer (fiche 30) ; droits + #ad.\n"},{"id":"30","kind":"fiche","num":"30","title":"Data 1 : vanity vs actionnable, le funnel","group":"Parcours (ordre conseillé)","icon":"🧠","tag":"Théorie","timeless":true,"volatile":false,"md":"# Fiche 30 — Data 1 : vanity vs actionnable, le funnel\n\n- **Type :** 🧠 Théorie · **Nature :** ⏳ Intemporel · **Durée :** ~1 h · **Prérequis :** Fiches 04, 09\n- **Terrain :** —\n\n## Objectifs\n\n1. Distinguer une vanity metric d'une métrique actionnable.\n2. Lire ton activité comme un funnel et trouver le vrai goulot.\n3. Choisir *la* métrique qui compte selon ton objectif.\n\n## 1. Vanity vs actionnable\n\n- **Vanity metric :** un chiffre qui gonfle l'ego mais ne guide aucune décision. Vues, likes,\n  followers *bruts*. Ils montent → tu te sens bien → tu ne sais pas quoi faire de différent demain.\n- **Métrique actionnable :** un chiffre qui, s'il bouge, te dit *quoi changer*. Taux de complétion,\n  taux de partage/send, taux de clic, taux de conversion, coût d'acquisition.\n\nTest simple : « Si ce chiffre double, est-ce que je sais quelle action ça valide ou infirme ? » Si\nnon → c'est de la vanité. Les followers ne paient pas le loyer
