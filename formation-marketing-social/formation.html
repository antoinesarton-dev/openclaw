<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Formation — Marketing des réseaux sociaux</title>
</head>
<body>
<style>
  /* ---------- Tokens ---------- */
  :root{
    --bg:#f2f5f3; --surface:#ffffff; --surface-2:#e9ede9; --surface-3:#dfe5e0;
    --text:#161b19; --muted:#5c6763; --faint:#8a938e; --border:#d7ddd8;
    --accent:#0d7a6b; --accent-strong:#0a5d51; --accent-soft:#0d7a6b18;
    --volatile:#b25309; --volatile-soft:#b2530915;
    --timeless:#0d7a6b; --timeless-soft:#0d7a6b14;
    --shadow:0 1px 2px rgba(20,30,26,.06),0 8px 24px rgba(20,30,26,.08);
    --radius:14px;
    --serif:Charter,"Bitstream Charter","Iowan Old Style","Palatino Linotype",Palatino,"URW Palladio L",Georgia,serif;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    --mono:ui-monospace,"SF Mono","Cascadia Code",Menlo,Consolas,monospace;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#0f1412; --surface:#161c1a; --surface-2:#1d2523; --surface-3:#26302c;
      --text:#e7ece9; --muted:#96a29c; --faint:#6f7a75; --border:#26302c;
      --accent:#43c1ac; --accent-strong:#5cd4bf; --accent-soft:#43c1ac1f;
      --volatile:#e79447; --volatile-soft:#e7944718;
      --timeless:#43c1ac; --timeless-soft:#43c1ac16;
      --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.4);
    }
  }
  :root[data-theme="light"]{
    --bg:#f2f5f3; --surface:#ffffff; --surface-2:#e9ede9; --surface-3:#dfe5e0;
    --text:#161b19; --muted:#5c6763; --faint:#8a938e; --border:#d7ddd8;
    --accent:#0d7a6b; --accent-strong:#0a5d51; --accent-soft:#0d7a6b18;
    --volatile:#b25309; --volatile-soft:#b2530915;
    --timeless:#0d7a6b; --timeless-soft:#0d7a6b14;
    --shadow:0 1px 2px rgba(20,30,26,.06),0 8px 24px rgba(20,30,26,.08);
  }
  :root[data-theme="dark"]{
    --bg:#0f1412; --surface:#161c1a; --surface-2:#1d2523; --surface-3:#26302c;
    --text:#e7ece9; --muted:#96a29c; --faint:#6f7a75; --border:#26302c;
    --accent:#43c1ac; --accent-strong:#5cd4bf; --accent-soft:#43c1ac1f;
    --volatile:#e79447; --volatile-soft:#e7944718;
    --timeless:#43c1ac; --timeless-soft:#43c1ac16;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.4);
  }

  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0}
  #app{
    font-family:var(--sans); color:var(--text); background:var(--bg);
    line-height:1.6; min-height:100vh; -webkit-font-smoothing:antialiased;
  }
  a{color:var(--accent-strong)}
  ::selection{background:var(--accent-soft)}

  /* ---------- Topbar ---------- */
  .topbar{
    position:sticky; top:0; z-index:40; background:color-mix(in srgb,var(--bg) 88%,transparent);
    backdrop-filter:saturate(1.4) blur(10px); border-bottom:1px solid var(--border);
  }
  .topbar-row{display:flex; align-items:center; gap:12px; padding:10px 14px; max-width:1180px; margin:0 auto}
  .icon-btn{
    display:inline-grid; place-items:center; width:40px; height:40px; border-radius:11px;
    border:1px solid var(--border); background:var(--surface); color:var(--text); cursor:pointer;
    font-size:18px; line-height:1; flex:0 0 auto; transition:background .15s,border-color .15s;
  }
  .icon-btn:hover{background:var(--surface-2)}
  .icon-btn:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
  .brand{display:flex; flex-direction:column; min-width:0; margin-right:auto; cursor:pointer}
  .brand b{font-family:var(--serif); font-weight:700; font-size:16px; letter-spacing:.1px; line-height:1.15;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .brand span{font-size:11px; color:var(--muted); letter-spacing:.06em; text-transform:uppercase}
  .progress-wrap{max-width:1180px; margin:0 auto; padding:0 14px 8px}
  .progress-track{height:5px; border-radius:99px; background:var(--surface-2); overflow:hidden}
  .progress-bar{height:100%; width:0; background:linear-gradient(90deg,var(--accent),var(--accent-strong));
    border-radius:99px; transition:width .35s ease}
  .progress-label{font-size:11px; color:var(--muted); margin-top:5px; letter-spacing:.02em; font-variant-numeric:tabular-nums}

  /* ---------- Shell ---------- */
  .shell{display:flex; max-width:1180px; margin:0 auto; align-items:flex-start}

  /* ---------- Drawer / nav ---------- */
  .scrim{position:fixed; inset:0; background:rgba(8,12,10,.5); opacity:0; pointer-events:none;
    transition:opacity .25s; z-index:45}
  .scrim.show{opacity:1; pointer-events:auto}
  .drawer{
    position:fixed; top:0; left:0; height:100dvh; width:min(86vw,340px); z-index:50;
    background:var(--surface); border-right:1px solid var(--border);
    transform:translateX(-102%); transition:transform .28s cubic-bezier(.4,0,.2,1);
    display:flex; flex-direction:column;
  }
  .drawer.show{transform:none; box-shadow:var(--shadow)}
  .drawer-head{padding:14px 14px 10px; border-bottom:1px solid var(--border); display:flex; flex-direction:column; gap:10px}
  .drawer-title{font-family:var(--serif); font-weight:700; font-size:15px}
  .search{width:100%; padding:9px 12px; border-radius:10px; border:1px solid var(--border);
    background:var(--bg); color:var(--text); font-size:14px; font-family:var(--sans)}
  .search:focus-visible{outline:2px solid var(--accent); outline-offset:1px}
  .nav{overflow-y:auto; padding:8px 8px 24px; flex:1; overscroll-behavior:contain}
  .nav-group{font-size:10.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--faint);
    padding:14px 10px 6px; font-weight:700}
  .nav-item{
    display:flex; align-items:center; gap:10px; width:100%; text-align:left; cursor:pointer;
    padding:9px 10px; border-radius:10px; border:0; background:transparent; color:var(--text);
    font-family:var(--sans); font-size:13.5px; line-height:1.3;
  }
  .nav-item:hover{background:var(--surface-2)}
  .nav-item.active{background:var(--accent-soft)}
  .nav-item.active .ni-title{color:var(--accent-strong); font-weight:600}
  .num{
    flex:0 0 auto; width:30px; height:30px; border-radius:9px; display:grid; place-items:center;
    font-size:12.5px; font-weight:700; font-variant-numeric:tabular-nums;
    border:1.5px solid var(--border); color:var(--muted); background:var(--surface);
  }
  .num.practice{background:var(--accent); border-color:var(--accent); color:#fff}
  :root[data-theme="dark"] .num.practice{color:#08110f}
  .num.sys{background:var(--surface-2); border-style:dashed}
  .ni-body{min-width:0; flex:1; display:flex; flex-direction:column; gap:2px}
  .ni-title{white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .ni-meta{display:flex; gap:5px; align-items:center; font-size:10.5px; color:var(--muted)}
  .ni-check{flex:0 0 auto; color:var(--accent); font-size:14px; width:16px; text-align:center}
  .dot-t,.dot-v{width:7px; height:7px; border-radius:99px; display:inline-block}
  .dot-t{background:var(--timeless)} .dot-v{background:var(--volatile)}

  /* ---------- Content ---------- */
  .content{flex:1; min-width:0; padding:26px 18px 96px; margin:0 auto; width:100%; max-width:760px}
  .fiche-head{margin-bottom:22px}
  .eyebrow{display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:14px}
  .chip{display:inline-flex; align-items:center; gap:5px; font-size:11.5px; font-weight:600;
    padding:4px 10px; border-radius:99px; border:1px solid var(--border); background:var(--surface);
    color:var(--muted); letter-spacing:.02em}
  .chip.type{background:var(--surface-2); color:var(--text)}
  .chip.t{background:var(--timeless-soft); color:var(--timeless); border-color:color-mix(in srgb,var(--timeless) 30%,transparent)}
  .chip.v{background:var(--volatile-soft); color:var(--volatile); border-color:color-mix(in srgb,var(--volatile) 30%,transparent)}
  h1.fiche-title{font-family:var(--serif); font-weight:700; font-size:clamp(26px,7vw,38px);
    line-height:1.12; letter-spacing:-.01em; text-wrap:balance; margin:2px 0 0}

  /* rendered markdown */
  .md{font-size:17px}
  .md h1{display:none}
  .md h2{font-family:var(--serif); font-weight:700; font-size:22px; line-height:1.2; text-wrap:balance;
    margin:34px 0 12px; padding-top:18px; border-top:1px solid var(--border); color:var(--text)}
  .md h2:first-of-type{border-top:0; padding-top:0; margin-top:22px}
  .md h3{font-family:var(--sans); font-weight:700; font-size:16.5px; letter-spacing:.01em;
    margin:24px 0 8px; color:var(--accent-strong)}
  .md p{margin:0 0 14px}
  .md ul,.md ol{margin:0 0 16px; padding-left:22px}
  .md li{margin:6px 0}
  .md li::marker{color:var(--accent)}
  .md strong{font-weight:700; color:var(--text)}
  .md a{text-decoration:underline; text-underline-offset:2px; text-decoration-thickness:1px}
  .md code{font-family:var(--mono); font-size:.86em; background:var(--surface-2);
    padding:1px 6px; border-radius:6px; border:1px solid var(--border)}
  .md hr{border:0; border-top:1px solid var(--border); margin:26px 0}
  .md pre{background:var(--surface-2); border:1px solid var(--border); border-radius:12px;
    padding:14px 16px; overflow-x:auto; margin:0 0 18px}
  .md pre code{font-family:var(--mono); font-size:13px; line-height:1.55; background:none; border:0; padding:0;
    white-space:pre; color:var(--text)}
  .md blockquote{margin:0 0 18px; padding:13px 16px; background:var(--volatile-soft);
    border-left:3px solid var(--volatile); border-radius:0 12px 12px 0; color:var(--text)}
  .md blockquote p{margin:0 0 8px} .md blockquote p:last-child{margin:0}
  .md blockquote strong{color:var(--volatile)}
  .table-wrap{overflow-x:auto; margin:0 0 18px; border:1px solid var(--border); border-radius:12px}
  .md table{border-collapse:collapse; width:100%; font-size:13.5px; font-variant-numeric:tabular-nums}
  .md th,.md td{padding:9px 12px; text-align:left; border-bottom:1px solid var(--border);
    vertical-align:top; min-width:74px}
  .md th{background:var(--surface-2); font-weight:700; font-size:12.5px; white-space:nowrap}
  .md tr:last-child td{border-bottom:0}
  .md td strong{color:var(--accent-strong)}

  /* pager + actions */
  .actions{display:flex; gap:10px; margin:30px 0 8px; flex-wrap:wrap}
  .btn{display:inline-flex; align-items:center; gap:8px; padding:11px 16px; border-radius:12px;
    border:1px solid var(--border); background:var(--surface); color:var(--text); cursor:pointer;
    font-family:var(--sans); font-size:14px; font-weight:600; transition:background .15s,transform .05s}
  .btn:hover{background:var(--surface-2)} .btn:active{transform:translateY(1px)}
  .btn.done{background:var(--accent); border-color:var(--accent); color:#fff}
  :root[data-theme="dark"] .btn.done{color:#08110f}
  .pager{display:flex; gap:10px; margin-top:26px; padding-top:20px; border-top:1px solid var(--border)}
  .pager a{flex:1; text-decoration:none; color:var(--text); border:1px solid var(--border);
    border-radius:12px; padding:12px 14px; background:var(--surface); min-width:0}
  .pager a:hover{background:var(--surface-2)}
  .pager .dir{font-size:11px; color:var(--muted); letter-spacing:.06em; text-transform:uppercase}
  .pager .pt{font-size:13.5px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; display:block}
  .pager a.next{text-align:right}
  .pager a.disabled{opacity:.35; pointer-events:none}

  /* sidebar permanent on desktop */
  @media (min-width:960px){
    .icon-btn.menu{display:none}
    .scrim{display:none}
    .drawer{position:sticky; top:57px; height:calc(100dvh - 57px); transform:none !important;
      width:320px; flex:0 0 320px; box-shadow:none}
    .content{padding:34px 40px 120px}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none !important}}
</style>

<div id="app">
  <header class="topbar">
    <div class="topbar-row">
      <button class="icon-btn menu" id="menuBtn" aria-label="Ouvrir le sommaire">&#9776;</button>

<script>
const DATA = [{"id":"curriculum","kind":"sys","num":"§","title":"Plan de la formation","group":"Le système","icon":"📂","tag":"Système","timeless":false,"volatile":false,"md":"# Formation — Marketing des réseaux sociaux (niveau mondial)\n\n> Programme conçu pour Antoine (auto-entrepreneur solo, Yvelines).\n> **Terrain d'entraînement :** InvoiceLab (micro-SaaS B2B/freelance) et une boutique Shopify\n> dropshipping canicule (B2C) — **deux projets que tu as abandonnés**, donc utilisés ici comme\n> sandbox sur des sujets que tu connais déjà. J'utilise aussi des marques/concurrents réels quand\n> c'est pédagogiquement plus fort.\n>\n> **Structure validée le 17/07/2026 :** interleaving conservé · fiches courtes (~1 h) et nombreuses\n> · terrain 50/50.\n\n---\n\n## 0. Pourquoi cette formation est différente\n\nTrois défauts tuent les formations marketing. Ce programme est bâti contre chacun.\n\n1. **Elles confondent l'intemporel et le périssable.** Ici, **chaque fiche est étiquetée**\n   `⏳ INTEMPOREL` ou `⚡ VOLATILE (valide au : date)`. Tu sais toujours ce qui va vieillir.\n2. **Elles sont génériques.** Règle que je m'impose : si un conseil tient dans les 10 premières\n   vidéos TikTok « marketing », soit je creuse le mécanisme sous-jacent (le pourquoi, le\n   contre-exemple, la limite), soit je le jette. Études de cas récentes et vérifiables, pas les\n   fossiles habituels (Wendy's, Dollar Shave Club).\n3. **Elles se lisent une fois et s'oublient.** Ici tu ne lis pas : tu **produis**, tu es **noté sur\n   une grille**, tu **révises en espacé**.\n\n**Contrat :** à chaque fiche « pratique », tu ressors avec un livrable réutilisable + un retour\ncritique honnête (pas des encouragements).\n\n---\n\n## 1. Le système d'apprentissage\n\n| Levier | Concrètement | Où |\n|---|---|---|\n| **Intemporel / volatile** | En-tête `⏳` ou `⚡ (valide au : JJ/MM/AAAA)`. Le volatile a une péremption perçue. | En-tête de fiche |\n| **Rappel actif** | Quiz *génératif* : reformuler, appliquer, critiquer — jamais reconnaître une bonne réponse. | Fin de fiche |\n| **Répétition espacée** | Concepts-clés revus à J+1 / J+7 / J+30. | `revision-espacee.md` |\n| **Pratique délibérée + feedback** | Fiches « pratique » = livrable réel noté /20 sur grille. | `journal-de-progression.md` |\n| **Interleaving** | Ordre non-thématique : on alterne psycho / plateforme / data / pratique. | L'ordre §3 |\n| **Feynman** | Encarts « Explique-moi » : tu reformules avant d'avancer. | Dans les fiches |\n\n**Rythme :** 1 fiche ~1 h. Vise 3–5 fiches/semaine + les révisions espacées en parallèle. Ne pas\nsprinter : la répétition espacée a besoin d'espace.\n\n**Deux types de fiches :**\n- 🧠 **Théorie** : le mécanisme sous le conseil, sourcé et daté.\n- 🛠️ **Pratique** : tu produis un livrable, je le note. Placées *juste après* la théorie qu'elles\n  activent (pratique délibérée).\n\n---\n\n## 2. Instantané de l'industrie (juillet 2026) — socle `⚡ VOLATILE`\n\nBase factuelle des fiches « plateformes ». **À re-vérifier tous les 2–3 mois** (`mise-a-jour.md`).\nSources en bas.\n\n- **Convergence des feeds courts (TikTok/Reels/Shorts).** Même squelette : test sur petite audience\n  → si **rétention/complétion** tiennent, élargissement par paliers. Le compteur de vues brut n'est\n  plus juge. TikTok pousse la complétion vers ~70 % (test d'abord auprès des abonnés) ; YouTube\n  Shorts juge le ratio **« vu vs balayé »** (viral ≈ 70/30) dans les **2 premières secondes**.\n- **Le partage a détrôné le like.** Reels : les **sends en DM** sont le signal de distribution le\n  plus fort (Mosseri, jan. 2025). TikTok : partages + enregistrements > likes. → concevoir **« pour\n  être envoyé à un ami »**, pas « pour faire liker ».\n- **LinkedIn = dwell time + commentaires.** Temps passé = juge n°1 ; commentaire ~15× un like ;\n  **liens externes ~−60 % de portée** ; la 1re heure décide ; **profil perso > page entreprise**\n  (posts de fondateurs ~5× plus loin).\n- **X : réponse reine, lien puni.** Score public : repost ~20×, réponse ~13,5×, marque-page ~10× vs\n  like. Depuis 2026, **liens supprimés hors Premium** ; Premium = multiplicateur. *(Débattu :\n  ampleur du boost et stabilité des poids — Musk change souvent. « Direction », pas « constante ».)*\n- **Reflux anti-IA.** Préférence pour le contenu créateur IA ~26 % (vs ~60 % en 2023). Gagnant :\n  **IA co-créateur + garde-fou humain** (~4× le 100 % automatisé). Authenticité/imperfection = rares\n  donc chères.\n- **GEO.** Être cité *dans* les réponses IA devient un canal ; **YouTube a dépassé Reddit** comme\n  source la plus citée début 2026. *(Débattu : mesure volatile — surveiller, pas sur-investir.)*\n- **Paid petit budget.** Meta Advantage+ = défaut e-commerce (+12–25 % ROAS vs manuel) mais **veut du\n  volume créatif** ; un créa gagnant tient **7–10 j** ; 5→40 créas/mois peut doubler le ROAS. TikTok\n  Ads : min ~20 $/j/ad group, discovery créative-first. **Ton levier n'est pas le ciblage, c'est le\n  débit créatif.**\n- **France 2026.** ~51,5 M d'utilisateurs (77,2 %). TikTok = temps/jour le plus élevé (~1h33). ~87 %\n  des acheteurs FR influencés par les réseaux. → **B2C canicule sur feeds courts** ; **B2B InvoiceLab\n  sur LinkedIn/X en fondateur.**\n\n> ⚠️ Les poids d'algorithme viennent de reverse-engineering d'agences + déclarations officielles\n> partielles. Personne hors des plateformes ne connaît les coefficients réels. **Boussole\n> directionnelle, jamais recette exacte.**\n\n---\n\n## 3. Carte des fiches (ordre interleavé — volontaire)\n\nL'ordre n'est **pas** thématique : on alterne psycho intemporelle, plateforme volatile, pratique,\ndata, pour forcer le transfert (choisir le bon outil, pas réciter un chapitre). `T` = terrain.\n\n| # | Fiche | Type | T | Domaine |\n|---|---|---|---|---|\n| 00 | Méthode, manifeste & auto-notation | 🧠 Méta | — | Système |\n| 01 | Économie de l'attention & la machine à scroll | 🧠 ⏳ | — | §1 |\n| 02 | Audit d'accroches concurrentes | 🛠️ | Les 2 | §1 |\n| 03 | Anatomie du hook (3 premières secondes) | 🧠 ⏳ | — | §1+§2 |\n| 04 | Feeds courts : le moteur commun | 🧠 ⚡ | — | §2 |\n| 05 | Écrire 10 hooks (InvoiceLab) | 🛠️ | InvoiceLab | §1+§2 |\n| 06 | Copywriting DR 1 : PAS & AIDA | 🧠 ⏳ | — | §1 |\n| 07 | Copywriting DR 2 : spécificité, une idée, preuve | 🧠 ⏳ | — | §1 |\n| 08 | Réécrire un hero + une fiche produit | 🛠️ | Les 2 | §1 |\n| 09 | Concevoir pour le partage (le « send ») | 🧠 ⚡ | — | §2 |\n| 10 | Offre irrésistible 1 : équation de valeur | 🧠 ⏳ | — | §1 |\n| 11 | Offre irrésistible 2 : risque, garanties, bundling | 🧠 ⏳ | — | §1 |\n| 12 | Construire une offre complète (boutique) | 🛠️ | Boutique | §1 |\n| 13 | Biais 1 : réciprocité, engagement, preuve sociale | 🧠 ⏳ | — | §1 |\n| 14 | Biais 2 : autorité, sympathie, rareté + éthique | 🧠 ⏳ | — | §1 |\n| 15 | Injecter des biais honnêtes dans une page | 🛠️ | Boutique | §1 |\n| 16 | Storytelling 1 : structures narratives | 🧠 ⏳ | — | §1 |\n| 17 | Storytelling 2 : le récit fondateur qui convertit | 🧠 ⏳ | — | §1 |\n| 18 | Écrire ton récit fondateur (3 formats) | 🛠️ | InvoiceLab | §1 |\n| 19 | IA & contenu 1 : co-création vs automatisation | 🧠 ⚡ | — | §3 |\n| 20 | IA & contenu 2 : GEO, détection, workflow humain | 🧠 ⚡ | — | §3 |\n| 21 | Construire ton workflow IA-humain | 🛠️ | Les 2 | §3 |\n| 22 | LinkedIn pour le fondateur solo | 🧠 ⚡ | — | §2+§7 |\n| 23 | X pour le fondateur solo | 🧠 ⚡ | — | §2+§7 |\n| 24 | 5 posts + plan « première heure » | 🛠️ | InvoiceLab | §2 |\n| 25 | Distribution : hub & spokes, repurposing | 🧠 ⏳⚡ | — | §4 |\n| 26 | 1 idée → 6 formats | 🛠️ | Les 2 | §4 |\n| 27 | Boucles virales & mécanique de partage | 🧠 ⏳ | — | §4 |\n| 28 | UGC & micro-créateurs à petit budget | 🧠 ⚡ | — | §4 |\n| 29 | Plan d'approche de 10 micro-créateurs | 🛠️ | Boutique | §4 |\n| 30 | Data 1 : vanity vs actionnable, le funnel | 🧠 ⏳ | — | §5 |\n| 31 | Data 2 : lire un A/B test sans se mentir | 🧠 ⏳ | — | §5 |\n| 32 | Analyser un funnel & décider quoi tester | 🛠️ | InvoiceLab | §5 |\n| 33 | Media buying 1 : structure & seuil de rentabilité | 🧠 ⚡ | — | §6 |\n| 34 | Media buying 2 : testing créative-first, kill/scale | 🧠 ⚡ | — | §6 |\n| 35 | Plan de test payant chiffré | 🛠️ | Boutique | §6 |\n| 36 | Autorité personnelle : niche, POV, build in public | 🧠 ⏳⚡ | — | §7 |\n| 37 | Plan fondateur 90 jours | 🛠️ | InvoiceLab | §7 |\n| 38 | Capstone : campagne intégrée réelle | 🛠️ Synthèse | Au choix | Tout |\n\n**Total estimé : ~38–42 h** de travail actif (hors révision espacée, qui court en parallèle et\nn'est jamais « finie »).\n\n### Correspondance avec les 7 domaines exigés\n\n1. Fondamentaux intemporels → 01, 03, 06, 07, 10, 11, 13, 14, 16, 17 (le plus gros bloc : ce qui ne\n   périme pas). 2. Plateformes actuelles → 04, 09, 22, 23 (+ instantané §2). 3. IA → 19, 20, 21\n   (transversal). 4. Croissance & distribution → 25, 27, 28. 5. Data → 30, 31. 6. Media buying →\n   33, 34. 7. Autorité → 36 (préparée dès 17 et 22). Capstone → 38.\n\n---\n\n## 4. Anatomie d'une fiche\n\nChaque `modules/NN-slug.md` suit la même structure :\n\n1. **En-tête** : type (🧠/🛠️), nature (`⏳`/`⚡` + date), durée, prérequis, terrain.\n2. **Objectifs** : 3–5 capacités vérifiables (« tu sauras écrire… », pas « tu connaîtras… »).\n3. **Contenu** : théorie sourcée + mécanisme (ou consigne d'exercice + grille pour la pratique).\n4. **« Explique-moi »** (Feynman) : point d'arrêt où tu reformules.\n5. **Quiz génératif** (fiches théorie) ou **grille de notation** (fiches pratique).\n6. **Cartes de rappel** : 3–6 concepts poussés dans `revision-espacee.md`.\n\n---\n\n## 5. Grille de notation (pour ne pas se mentir)\n\nChaque livrable noté /20 sur 4 axes de 5 points. Un livrable « ça va » plafonne à ~12/20.\n\n| Axe | 0–2 | 3 | 4–5 |\n|---|---|---|---|\n| **Spécificité** | Générique, interchangeable | Un peu concret | Précis, chiffré, non-copiable ailleurs |\n| **Mécanique** | Ignore psycho/algo | Applique une règle | Bon levier au bon endroit |\n| **Clarté** | Confus, multi-idées | Lisible | Une idée, tranchante, mémorable |\n| **Adéquation** | Hors-sol | Colle au projet | Exploite un vrai insight produit/marché |\n\nLivrables + notes + retours vont, datés, dans `journal-de-progression.md`.\n\n---\n\n## 6. Fichiers du système\n\n| Fichier | Rôle |\n|---|---|\n| `curriculum.md` | Ce document. |\n| `modules/NN-slug.md` | Une fiche (~1 h) : théorie ou pratique. |\n| `revision-espacee.md` | Calendrier de rappel actif J+1 / J+7 / J+30. |\n| `journal-de-progression.md` | Tes livrables, notes /20, mes retours, datés. |\n| `mise-a-jour.md` | Checklist de re-recherche et fréquence, anti-péremption. |\n\n---\n\n## Sources (instantané §2, consultées le 17/07/2026)\n\n- TikTok : [Sprout Social](https://sproutsocial.com/insights/tiktok-algorithm/), [Hootsuite](https://blog.hootsuite.com/tiktok-algorithm/)\n- Instagram/Reels : [Later](https://later.com/blog/how-instagram-algorithm-works/), [Buffer](https://buffer.com/resources/instagram-algorithms/), [Sprout Social](https://sproutsocial.com/insights/instagram-algorithm/)\n- YouTube Shorts : [vidIQ](https://vidiq.com/blog/post/youtube-shorts-algorithm/), [Metricool](https://metricool.com/youtube-shorts-algorithm/)\n- LinkedIn : [Hootsuite](https://blog.hootsuite.com/linkedin-algorithm/) (rapport R. van der Blom cité)\n- X : [Sprout Social](https://sproutsocial.com/insights/twitter-algorithm/), [SocialPilot](https://www.socialpilot.co/blog/twitter-algorithm)\n- IA & authenticité : [Digiday](https://digiday.com/media/after-an-oversaturation-of-ai-generated-content-creators-authenticity-and-messiness-are-in-high-demand/), [eMarketer](https://www.emarketer.com/content/faq-on-content-marketing--ai-saturation--zero-click-search--what-s-still-working-2026)\n- Paid petit budget : [Digital Applied](https://www.digitalapplied.com/blog/social-media-advertising-roi-2026-platform-guide), [Extuitive](https://extuitive.com/articles/creative-testing-strategy-for-meta-and-tiktok-ads)\n- France : [We Are Social — Digital Report France 2026](https://wearesocial.com/fr/blog/2026/01/digital-report-france-2026-%F0%9F%87%AB%F0%9F%87%B7/), [Blog du Modérateur](https://www.blogdumoderateur.com/chiffres-reseaux-sociaux/)\n- Fondateur/B2B organique : [Read Social Files](https://www.readsocialfiles.com/p/founder-led-content-inspiration)\n"},{"id":"revision","kind":"sys","num":"§","title":"Révision espacée (J+1/J+7/J+30)","group":"Le système","icon":"📂","tag":"Système","timeless":false,"volatile":false,"md":"# Révision espacée — rappel actif\n\n> **Comment ça marche.** À chaque fiche 🧠, tu ajoutes ses « cartes de rappel » ici. Ensuite tu les\n> revois à **J+1, J+7, J+30**. La règle d'or : tu **récupères de mémoire** (tu réponds à voix haute\n> ou par écrit) *avant* de regarder la réponse. L'effort de récupération est ce qui grave la mémoire\n> — relire ne sert quasiment à rien.\n>\n> **Protocole par carte :** lis la question → réponds sans regarder → révèle la réponse → note ton\n> résultat : ✅ (juste sans effort) · 🟡 (juste avec effort / partiel) · ❌ (raté).\n> - ✅ → repousse au palier suivant (J+1→J+7→J+30→archivé).\n> - 🟡 → reste au même palier, re-teste dans 2 jours.\n> - ❌ → recommence à J+1.\n\n## Comment lire le tableau de planning\n\nPour chaque lot de cartes (une fiche), note la date de première étude, puis coche les 3 rappels.\n\n| Fiche | Étudiée le | J+1 (date / résultat) | J+7 | J+30 | Statut |\n|---|---|---|---|---|---|\n| _ex : 01_ | _JJ/MM_ | _JJ/MM ✅_ | _JJ/MM_ | _JJ/MM_ | en cours |\n\n---\n\n## Banque de cartes\n\n> Les cartes sont ajoutées au fil des fiches. Format : **Q** (récupération) → **R** (vérification).\n> Ce sont des questions d'**application**, pas de définition.\n\n### Fiche 01 — Attention & machine à scroll\n\n1. **Q :** Pourquoi une récompense *intermittente et imprévisible* retient-elle mieux l'attention\n   qu'une récompense régulière, et quelle conséquence concrète ça a sur la façon dont tu ouvres une\n   vidéo ?\n   **R :** Le renforcement à ratio variable (machine à sous) maximise la dopamine d'anticipation :\n   le cerveau ne peut pas prédire quand vient la récompense, donc il reste engagé « au cas où ».\n   Conséquence : ta vidéo doit promettre une récompense *incertaine mais probable* dès la 1re\n   seconde (« tu vas voir un truc que 90 % ratent ») plutôt qu'annoncer platement le contenu.\n\n2. **Q :** Un utilisateur décide de rester ou scroller en ~2 s. En termes de coût cognitif, que doit\n   faire ton ouverture pour survivre à cette décision ?\n   **R :** Réduire à zéro l'effort requis pour comprendre *pourquoi ça vaut le coup de rester* :\n   promesse claire + tension ouverte, aucune mise en contexte lente. Le cerveau économise l'énergie ;\n   toute friction de compréhension = swipe.\n\n### Fiche 03 — Anatomie du hook\n\n1. **Q :** Cite les 3 leviers d'un hook fort et donne, pour chacun, un exemple appliqué à un\n   générateur de factures pour freelances.\n   **R :** (1) *Tension/enjeu* : « La mention légale qui rend ta facture invalide (et que 8 freelances\n   sur 10 oublient). » (2) *Spécificité* : un chiffre/détail concret rend crédible et curieux.\n   (3) *Curiosité (information gap)* : ouvrir une boucle que seule la suite ferme.\n\n2. **Q :** Pourquoi un hook « générique mais joli » sous-performe un hook « spécifique mais brut » ?\n   **R :** Le spécifique signale la pertinence et la crédibilité (le cerveau détecte « c'est pour\n   moi / c'est vrai ») ; le générique est filtré comme du bruit publicitaire. La beauté ne bat pas\n   la pertinence dans les 2 premières secondes.\n\n### Fiche 04 — Feeds courts : le moteur commun\n\n1. **Q :** Décris en une phrase le squelette commun à TikTok, Reels et Shorts en 2026, et déduis-en\n   la seule chose que ton ouverture doit accomplir.\n   **R :** Test sur petite audience → si rétention/complétion tiennent, élargissement par paliers.\n   Déduction : l'ouverture doit **empêcher le swipe dans les 2 premières secondes** (rétention), car\n   sans ça les autres signaux n'existent jamais.\n\n2. **Q :** En 2026 le like a été détrôné. Par quel signal, et comment ça change la *conception* d'une\n   vidéo ?\n   **R :** Par le **partage / send en DM** (Reels surtout) et les partages/enregistrements (TikTok).\n   On conçoit « pour être envoyé à quelqu'un de précis » : utilité partageable, punchline, « tag un\n   pote qui… », plutôt que « pour faire liker ».\n"},{"id":"journal","kind":"sys","num":"§","title":"Journal de progression","group":"Le système","icon":"📂","tag":"Système","timeless":false,"volatile":false,"md":"# Journal de progression\n\n> Ici on garde une trace **datée** de chaque livrable d'exercice, de ta note /20 (grille du\n> `curriculum.md` §5) et de mon retour critique. Objectif : voir la **courbe** de progression, pas\n> juste des notes isolées. On repère les axes récurrents où tu perds des points (souvent :\n> spécificité) et on les corrige.\n\n## Comment on l'utilise\n\n1. Tu fais une fiche 🛠️ « pratique » et tu colles ton livrable dans une nouvelle entrée ci-dessous.\n2. Je le note /20 sur les 4 axes (Spécificité / Mécanique / Clarté / Adéquation) et je te donne un\n   retour qui **démonte ce qui cloche**, pas qui te félicite.\n3. On garde tout : dans 10 fiches, tu relis tes premiers livrables et tu mesures le chemin.\n\n## Tableau de bord\n\n| Fiche | Date | Livrable | Note /20 | Axe le plus faible |\n|---|---|---|---|---|\n| _(vide — première entrée après la fiche 02)_ | | | | |\n\n---\n\n## Entrées\n\n> Format d'une entrée :\n>\n> ```\n> ### Fiche NN — <titre> — <date>\n> **Livrable (ton texte) :**\n> ...\n> **Note :** Spécificité x/5 · Mécanique x/5 · Clarté x/5 · Adéquation x/5 = xx/20\n> **Ce qui marche :** ...\n> **Ce qui cloche (à corriger) :** ...\n> **1 chose à refaire différemment la prochaine fois :** ...\n> ```\n\n_(Aucune entrée pour l'instant. La première viendra avec la fiche 02 — Audit d'accroches.)_\n"},{"id":"mise-a-jour","kind":"sys","num":"§","title":"Mise à jour (anti-péremption)","group":"Le système","icon":"📂","tag":"Système","timeless":false,"volatile":false,"md":"# Mise à jour — anti-péremption\n\n> Le marketing des réseaux vieillit vite ; l'IA accélère encore. Ce fichier liste **ce qu'il faut\n> re-rechercher, à quelle fréquence, et ce qui NE bouge pas.** Sans ça, la formation devient fausse\n> en silence. La règle : ne jamais faire confiance à une fiche `⚡` passé sa date de validité sans\n> re-vérifier.\n\n## Ce qui ne périme (quasiment) jamais — `⏳`\n\nCes fiches reposent sur la psychologie humaine et la persuasion. Re-lecture utile, re-recherche\nrarement nécessaire (revoir tous les ~12 mois pour de nouveaux exemples/études) :\n**01, 03, 06, 07, 10, 11, 13, 14, 16, 17, 27, 30, 31.**\n\n## Ce qui périme vite — `⚡` (avec cadence)\n\n| Sujet | Fiches | Re-vérifier tous les | Signaux qu'il faut re-chercher **maintenant** |\n|---|---|---|---|\n| Mécaniques d'algo (TikTok/Reels/Shorts/LinkedIn/X) | 04, 09, 22, 23, instantané §2 du curriculum | **2–3 mois** | Annonce officielle (Mosseri, blog TikTok/YT), vague de créateurs qui constatent une chute de reach, changement de format mis en avant |\n| IA & production de contenu | 19, 20, 21 | **2–3 mois** | Nouveau modèle majeur, changement de politique « contenu IA » d'une plateforme, bascule de sentiment audience |\n| GEO / citation dans les réponses IA | 20 | **3 mois** | Nouvelle source de données sur qui est cité, arrivée d'un moteur/feature |\n| Media buying (Advantage+, TikTok Ads) | 33, 34, 35 | **3 mois** (+ à chaque campagne) | Changement d'UI/algo d'enchères, nouveaux benchmarks ROAS, dépréciation d'un type de campagne |\n| Chiffres France / usage plateformes | instantané §2 | **6 mois** (rapports annuels : jan.) | Digital Report (We Are Social/Meltwater) de janvier, chiffres BDM |\n| Études de cas | toutes fiches | **en continu** | Remplacer un exemple dès qu'il a >12–18 mois ou qu'il est devenu un cliché |\n\n## Procédure de mise à jour (à suivre)\n\n1. **Trimestriel (tous les 3 mois) — session ~1 h :**\n   - Relancer les recherches sur chaque algo pertinent (« [plateforme] algorithm [mois/année] »).\n   - Comparer avec l'instantané §2 du `curriculum.md`. Noter les écarts.\n   - Mettre à jour l'en-tête de date des fiches `⚡` touchées + corriger le contenu.\n   - Journaliser ci-dessous ce qui a changé.\n2. **Semestriel :** rafraîchir les chiffres France (rapport de janvier) et les benchmarks paid.\n3. **En continu :** dès qu'une étude de cas citée date de plus de ~12–18 mois ou devient un cliché,\n   la remplacer par une plus récente et vérifiable.\n\n## Garde-fou anti-illusion\n\n- Ne jamais citer un poids d'algorithme comme une **certitude** : ce sont des estimations d'agences.\n  Toujours formuler « direction / signal », marquer « débattu » quand l'industrie n'est pas d'accord.\n- Préférer **plusieurs sources concordantes** (Sprout + Hootsuite + Buffer + déclaration officielle)\n  à une seule.\n- Distinguer *déclaration officielle de la plateforme* > *reverse-engineering d'agence* > *avis de\n  gourou*. Étiqueter la source dans la fiche.\n\n## Journal des mises à jour\n\n| Date | Ce qui a changé | Fiches touchées | Par |\n|---|---|---|---|\n| 17/07/2026 | Création — instantané initial 2026 | curriculum §2 | Claude |\n"},{"id":"00","kind":"fiche","num":"00","title":"Méthode, manifeste & auto-notation","group":"Parcours (ordre conseillé)","icon":"🧠","tag":"Méta","timeless":true,"volatile":false,"md":"# Fiche 00 — Méthode, manifeste & auto-notation\n\n- **Type :** 🧠 Méta · **Nature :** ⏳ Intemporel · **Durée :** ~45 min · **Prérequis :** aucun\n- **Terrain :** —\n\n## Objectifs\n\nÀ la fin de cette fiche tu sauras :\n1. Utiliser les 5 leviers d'apprentissage sans tricher avec toi-même.\n2. Te noter honnêtement sur la grille /20.\n3. Distinguer une fiche `⏳` d'une fiche `⚡` et savoir quoi en faire.\n4. Reconnaître les 3 façons dont on se ment en apprenant le marketing.\n\n## 1. Le pacte : tu produis, tu ne consommes pas\n\nLa différence entre quelqu'un de « bon » en marketing et quelqu'un d'excellent n'est pas le volume\nde contenu ingéré. C'est le volume de **reps** — de tentatives réelles suivies d'un feedback qui\npique. Tu as déjà lu des dizaines de threads « 10 hooks qui convertissent ». Ça ne t'a pas rendu\nmeilleur, parce que **reconnaître** un bon hook (« ah oui, malin ») et **en produire un sous\ncontrainte** sont deux compétences différentes. Cette formation ne muscle que la seconde.\n\nRègle : tu n'as pas « fait » une fiche 🛠️ tant que le livrable n'est pas dans\n`journal-de-progression.md`. Lire la consigne ne compte pas.\n\n## 2. Les 5 leviers, et pourquoi ils marchent\n\n- **Rappel actif.** Récupérer une info de mémoire la renforce ; la relire ne fait presque rien\n  (illusion de maîtrise : « je reconnais donc je sais » — faux). D'où des quiz où tu *reformules*,\n  jamais des QCM où tu *reconnais*.\n- **Répétition espacée.** On oublie selon une courbe ; revoir juste avant d'oublier (J+1, J+7, J+30)\n  aplatit la courbe. D'où `revision-espacee.md`.\n- **Pratique délibérée.** Pas « pratiquer », mais pratiquer *au bord de ta capacité*, sur un point\n  précis, avec feedback immédiat. D'où la grille /20 axe par axe.\n- **Interleaving.** Mélanger les sujets (au lieu de finir un chapitre) baisse la performance *à\n  l'entraînement* mais augmente la *rétention et le transfert*. C'est censé être inconfortable.\n- **Feynman.** Si tu ne peux pas ré-expliquer simplement, tu ne sais pas — tu reconnais. Les encarts\n  « Explique-moi » sont des pièges à illusion de maîtrise.\n\n## 3. Lire les étiquettes\n\n- `⏳ INTEMPOREL` : psychologie, persuasion, copywriting, storytelling, offre. Ça bougera peu de ton\n  vivant. Investis à fond : c'est ton avantage durable.\n- `⚡ VOLATILE (valide au : JJ/MM/AAAA)` : mécaniques d'algo, formats, features, paid. **Périmé par\n  défaut passé quelques mois.** Utile, mais on ne le grave pas dans le marbre — on le re-vérifie\n  (`mise-a-jour.md`).\n\nPiège classique : les gens sur-apprennent le volatile (« la nouvelle feature ! ») et sous-apprennent\nl'intemporel. Ils courent après chaque changement d'algo et ne savent toujours pas écrire une\npromesse. On fait l'inverse.\n\n## 4. La grille de notation (comment te noter sans te mentir)\n\nChaque livrable /20, 4 axes de 5 :\n\n| Axe | La question à te poser |\n|---|---|\n| **Spécificité** | Est-ce que ce texte pourrait décrire *n'importe quel* produit concurrent ? Si oui → 2 max. |\n| **Mécanique** | Est-ce que j'exploite un vrai levier psycho/algo au bon endroit, ou j'ai juste « fait joli » ? |\n| **Clarté** | Une seule idée dominante ? Un inconnu la capte en 3 s ? |\n| **Adéquation** | Est-ce que j'utilise un insight réel du produit/marché, ou c'est hors-sol ? |\n\n**Barème d'honnêteté :** un livrable « correct » = ~12/20. 16+ = vraiment bon. Si tu te mets 18 à\nton 1er essai, tu te mens. Le but n'est pas la note, c'est de voir *quel axe* te coûte des points de\nfaçon récurrente (pour 90 % des débutants : la **spécificité**).\n\n## 5. Les 3 façons de se mentir en marketing (à traquer tout le long)\n\n1. **Confondre reconnaissance et compétence** — « je sais ce qu'est un bon hook » ≠ « j'en produis ».\n2. **Vanity metrics** — se réjouir des vues/likes quand la seule question est : est-ce que ça a été\n   *partagé / enregistré / a converti* ? (Fiche 30.)\n3. **Survivorship & cherry-picking** — copier ce qui a marché pour un gros compte sans voir les 1000\n   qui ont fait pareil et échoué. (Fiche 31.)\n\n## Explique-moi (Feynman)\n\nEn 4 phrases max, à voix haute : *pourquoi relire mes notes me donne l'illusion de savoir, alors que\nme tester me révèle ce que je ne sais pas ?* Si tu hésites, relis §2.\n\n## Quiz génératif\n\n1. Un ami te dit : « j'ai regardé 30 vidéos sur le copywriting ce week-end, je gère maintenant. »\n   Qu'est-ce qui cloche dans sa logique, en une phrase ?\n2. Tu écris un hook et tu te donnes 17/20 du premier coup. Quel réflexe d'auto-notation as-tu\n   probablement raté ?\n3. Donne un exemple de contenu `⏳` et un de contenu `⚡`, et explique pourquoi tu n'apprendrais pas\n   les deux de la même manière.\n4. Pourquoi l'interleaving te donne l'impression d'être *moins* bon pendant l'entraînement, et\n   pourquoi c'est un bon signe ?\n\n## Cartes de rappel → `revision-espacee.md`\n\n- Reconnaissance ≠ production (et pourquoi ça change ma façon de bosser).\n- La grille : 4 axes, « correct » = 12/20, l'axe qui coûte le plus = souvent la spécificité.\n- `⏳` vs `⚡` : où j'investis à fond, où je re-vérifie.\n"},{"id":"01","kind":"fiche","num":"01","title":"Économie de l'attention & la machine à scroll","group":"Parcours (ordre conseillé)","icon":"🧠","tag":"Théorie","timeless":true,"volatile":false,"md":"# Fiche 01 — Économie de l'attention & la machine à scroll\n\n- **Type :** 🧠 Théorie · **Nature :** ⏳ Intemporel · **Durée :** ~1 h · **Prérequis :** Fiche 00\n- **Terrain :** — (la pratique arrive fiche 02)\n\n## Objectifs\n\n1. Expliquer *mécaniquement* pourquoi le scroll est addictif (et t'en servir, pas le subir).\n2. Nommer la décision binaire de ~2 s que ton contenu doit gagner, et ce qui la gouverne.\n3. Reformuler « capter l'attention » en termes de coût cognitif et de récompense anticipée.\n\n## 1. L'attention est un marché à somme nulle\n\nLe nombre de secondes d'attention humaine par jour est fixe ; le contenu qui les réclame croît sans\nlimite. Tu n'es donc **jamais** en concurrence avec « les autres générateurs de factures » ou « les\nautres boutiques ». Tu es en concurrence avec le message d'un pote, une vidéo de chat, et le sommeil.\nC'est le vrai benchmark. Toute stratégie qui l'oublie (« mon contenu est mieux que celui du\nconcurrent ») vise trop bas.\n\nConséquence pratique n°1 : le défaut de l'utilisateur, c'est **scroller**. Rester est l'exception que\ntu dois *provoquer*. Tu ne pars pas de l'attention pour la perdre ; tu pars de zéro et tu dois la\ngagner à chaque seconde.\n\n## 2. Pourquoi le scroll accroche : le ratio variable\n\nLe feed est une **machine à sous**. Le mécanisme s'appelle le *renforcement à ratio variable* : une\nrécompense (une vidéo géniale, un post drôle) arrive de façon **imprévisible**. Ce n'est pas la\nrécompense elle-même qui accroche — c'est l'**incertitude** sur son arrivée. Le cerveau libère de la\ndopamine en *anticipation*, pas seulement à la réception. Une récompense régulière et prévisible\nlasse ; une récompense aléatoire mais probable fixe l'attention « au cas où le prochain serait le\nbon ».\n\nDeux usages pour toi :\n- **Défensif :** comprends que tes concurrents exploitent ça — ton contenu tombe dans une transe de\n  balayage, pas devant un spectateur attentif. Tu dois *briser* la transe (voir §4).\n- **Offensif :** ouvre une **boucle d'incertitude** dès la 1re seconde. « Voici comment faire une\n  facture » (récompense prévisible, plate) → swipe. « L'erreur de facturation qui a coûté 4 000 € à\n  un freelance que je connais » (récompense incertaine mais alléchante : *laquelle ? ça pourrait être\n  moi ?*) → on reste pour lever l'incertitude.\n\n## 3. Le coût cognitif : le cerveau est avare\n\nLe cerveau minimise la dépense d'énergie. Toute friction — comprendre de quoi ça parle, décoder une\nmise en contexte lente, deviner pourquoi ça le concerne — est un **coût**. Devant un coût sans\nbénéfice immédiat visible, il fait le choix le moins cher : scroller.\n\nDonc « capter l'attention » = **réduire à zéro l'effort nécessaire pour comprendre pourquoi rester en\nvaut la peine.** Pas « être créatif ». Pas « être beau ». Rendre la valeur *évidente et immédiate*.\nUn hook brillant mais qui demande 4 secondes de réflexion a déjà perdu.\n\n## 4. La décision des ~2 secondes et le « pattern interrupt »\n\nSur les feeds courts (fiche 04 pour la mécanique algo), l'utilisateur tranche « rester / scroller »\nen environ 2 secondes — YouTube Shorts mesure littéralement le ratio *vu vs balayé* sur cette\nfenêtre. Ces 2 secondes décident si le reste de ton contenu *existe* pour l'algorithme.\n\nPour survivre à cette fenêtre, on utilise un **pattern interrupt** : quelque chose qui casse la\ntranse de balayage parce que ça ne ressemble pas à ce que le cerveau anticipait. Ça peut être :\n- visuel (un mouvement, un cadrage, un objet incongru, un texte gros et net) ;\n- verbal (une affirmation qui contredit une croyance : « Arrête de baisser tes prix ») ;\n- une tension (« Ne poste jamais ta facture avant d'avoir vérifié ça »).\n\n⚠️ **Nuance honnête :** le pattern interrupt gratuit (le cri, le saut, le clickbait sans suite) casse\nla transe mais *déçoit* ensuite → rétention qui s'effondre à la 3e seconde, et l'algo le voit. Le bon\ninterrupt **promet une récompense qu'il tient**. Interrompre sans livrer, c'est se faire down-rank\n(fiche 04). Interrupt + promesse tenue = la combinaison gagnante.\n\n## 5. Reformulation opérationnelle\n\n« Faire un bon contenu » se traduit en 3 questions, dans l'ordre :\n1. **Interrupt :** est-ce que la 1re seconde casse la transe de balayage ?\n2. **Promesse/incertitude :** est-ce que les 2 premières secondes ouvrent une boucle que la personne\n   *veut* refermer ?\n3. **Coût zéro :** est-ce que « pourquoi ça me concerne » est compris sans effort ?\n\nTout le reste (production, montage, hashtags) est secondaire tant que ces trois-là ne sont pas verts.\n\n## Explique-moi (Feynman)\n\nÀ voix haute, en 3 phrases : *pourquoi une vidéo qui annonce platement son contenu (« aujourd'hui je\nvais te montrer comment faire une facture ») se fait scroller, alors qu'elle est claire ?* Indice :\nclaire ≠ engageante ; où est la récompense incertaine ?\n\n## Quiz génératif\n\n1. Tu n'es « jamais en concurrence avec les autres générateurs de factures ». Contre qui, alors, et\n   qu'est-ce que ça change à ta barre de qualité ?\n2. Explique le ratio variable à quelqu'un avec une analogie *autre* que la machine à sous.\n3. Donne un pattern interrupt **verbal** pour la boutique canicule qui promet une récompense qu'il\n   peut tenir — et un contre-exemple d'interrupt « gratuit » qui se ferait down-rank.\n4. « Mon contenu est plus beau que celui du concurrent, donc il performera mieux. » Démonte cette\n   phrase en une ligne.\n5. Pourquoi un hook qui demande 4 secondes de réflexion a-t-il déjà perdu, même s'il est excellent ?\n\n## Cartes de rappel → `revision-espacee.md`\n\n- Attention = marché à somme nulle → vrai concurrent = le message d'un pote / le sommeil.\n- Ratio variable : c'est l'*incertitude* de la récompense qui accroche, pas la récompense.\n- Décision ~2 s + pattern interrupt qui **tient sa promesse** (sinon down-rank).\n- Capter l'attention = réduire à zéro le coût cognitif de comprendre « pourquoi rester ».\n"},{"id":"02","kind":"fiche","num":"02","title":"Audit d'accroches concurrentes","group":"Parcours (ordre conseillé)","icon":"🛠️","tag":"Pratique","timeless":true,"volatile":false,"md":"# Fiche 02 — Audit d'accroches concurrentes 🛠️\n\n- **Type :** 🛠️ Pratique · **Nature :** ⏳ Intemporel (méthode) · **Durée :** ~1 h · **Prérequis :** Fiche 01\n- **Terrain :** InvoiceLab **et** boutique (tu choisis un secteur ou fais les deux)\n\n## Pourquoi cet exercice maintenant (interleaving)\n\nTu viens de voir la théorie de l'attention (fiche 01). Au lieu d'enchaîner sur « l'anatomie du hook »\ntout de suite, on **applique** d'abord ton œil neuf sur du contenu réel. Analyser avant de produire :\ntu apprends à *voir* les leviers avant d'avoir à les fabriquer. C'est de la pratique délibérée sur la\ncompétence « diagnostic », qui est le préalable de la compétence « production » (fiche 05).\n\n## L'exercice\n\n**Objectif :** auditer **5 accroches réelles** de concurrents/comparables, et les noter avec une\ngrille d'attention. Tu produis un tableau + un verdict écrit.\n\n### Étape 1 — Constituer l'échantillon (15 min)\n\nChoisis **un** des deux terrains (ou fais 5 + 5 si tu es motivé) :\n\n- **InvoiceLab (B2B/freelance, FR) :** va sur LinkedIn, TikTok ou YouTube et cherche des créateurs\n  qui parlent de facturation, freelancing, auto-entrepreneur, compta simplifiée, outils no-code\n  pour indépendants. Note les 5 premières **accroches** (le texte des 2 premières secondes / la 1re\n  ligne du post) que tu croises.\n- **Boutique canicule (B2C, FR) :** cherche sur TikTok/Reels des vidéos de produits rafraîchissants,\n  gadgets d'été, « summer must-have », ventilateurs portables, etc. Note les 5 premières accroches.\n\nCopie l'accroche **mot pour mot** (ou décris la 1re seconde visuelle) + le lien.\n\n### Étape 2 — Noter chaque accroche (30 min)\n\nPour chacune des 5, remplis ce tableau. Note chaque colonne de **0 à 2** (0 = absent, 1 = tenté,\n2 = fort). Le « pattern interrupt » et la « promesse tenue » viennent de la fiche 01.\n\n| # | Accroche (verbatim) | Interrupt (0-2) | Boucle/incertitude (0-2) | Coût cognitif faible (0-2) | Promesse tenable (0-2) | Total /8 | Verdict 1 ligne |\n|---|---|---|---|---|---|---|---|\n\n### Étape 3 — Le verdict écrit (15 min)\n\nEn ~150 mots, réponds :\n1. Quelle accroche gagne, et **quel levier précis** la fait gagner (pas « elle est bien ») ?\n2. Quelle est la plus faible, et **la seule modification** qui la sauverait ?\n3. Quel **schéma récurrent** vois-tu dans ce secteur (ex. « tout le monde ouvre par une question\n   plate » = opportunité de se différencier) ?\n\n## Grille de notation de TON livrable (/20)\n\n| Axe | Ce que je regarde |\n|---|---|\n| **Spécificité** | Tes verdicts pointent un *levier précis* (« ouvre une boucle sur un chiffre ») ou restent vagues (« c'est accrocheur ») ? |\n| **Mécanique** | Tu utilises correctement les notions de la fiche 01 (interrupt, incertitude, coût cognitif, promesse tenable) ? |\n| **Clarté** | Le tableau est lisible et les verdicts tranchent en 1 ligne ? |\n| **Adéquation** | Ton « schéma récurrent » révèle une vraie opportunité pour InvoiceLab/la boutique ? |\n\nColle ton tableau + verdict dans `journal-de-progression.md` (première entrée). Je le note et je te\nrenvoie un retour axe par axe.\n\n## Piège à éviter\n\nNe note pas « j'aime / j'aime pas ». Tes goûts ne sont pas le marché. Note **le mécanisme** : une\naccroche que tu trouves « too much » peut cartonner parce qu'elle casse la transe. Sépare ton goût\nesthétique de ta lecture stratégique — c'est exactement l'axe « Mécanique ».\n\n## Explique-moi (Feynman)\n\nAvant de rendre : prends TA meilleure accroche de l'échantillon et explique à voix haute *pourquoi*\nelle marche à quelqu'un qui n'a pas lu la fiche 01, sans jargon. Si tu n'y arrives pas, tu ne l'as\npas vraiment diagnostiquée.\n\n## Cartes de rappel → `revision-espacee.md`\n\n- Auditer une accroche = noter le *mécanisme* (interrupt / boucle / coût / promesse), pas mon goût.\n- Chercher le *schéma récurrent* d'un secteur = trouver l'angle de différenciation.\n"},{"id":"03","kind":"fiche","num":"03","title":"Anatomie du hook (les 3 premières secondes)","group":"Parcours (ordre conseillé)","icon":"🧠","tag":"Théorie","timeless":true,"volatile":true,"md":"# Fiche 03 — Anatomie du hook (les 3 premières secondes)\n\n- **Type :** 🧠 Théorie · **Nature :** ⏳ Intemporel (la psycho) + ⚡ (le poids algo, valide au 17/07/2026) · **Durée :** ~1 h · **Prérequis :** Fiches 01, 02\n- **Terrain :** — (production fiche 05)\n\n## Objectifs\n\n1. Décomposer un hook en leviers activables (pas « avoir du talent »).\n2. Choisir le bon *type* de hook selon l'intention et la plateforme.\n3. Comprendre pourquoi la spécificité bat l'esthétique dans les 3 premières secondes.\n\n## 1. Ce qu'est vraiment un hook\n\nUn hook n'est pas « une phrase accrocheuse ». C'est le dispositif qui **ouvre une boucle\nd'information que seul le fait de rester permet de refermer.** Sa seule mission : acheter la seconde\nsuivante. Chaque seconde d'une vidéo/d'un post a un hook (micro-hook) ; mais les 3 premières\ndécident de tout, car sans elles il n'y a pas de « suite » (fiche 01 : décision ~2 s ; fiche 04 :\nl'algo ne montre plus rien si ça décroche).\n\nFormule mentale : **Hook = Tension × Spécificité × Clarté.** Si l'un des trois est à zéro, le produit\nest zéro.\n- **Tension :** un écart à combler (problème/promesse, avant/après, curiosité, enjeu personnel).\n- **Spécificité :** un détail concret, chiffré, nommé, qui rend crédible ET curieux.\n- **Clarté :** compréhensible sans effort en < 2 s (fiche 01, coût cognitif).\n\n## 2. Les grands types de hook (avec exemple InvoiceLab / boutique)\n\n| Type | Mécanisme psycho | Exemple InvoiceLab | Exemple boutique canicule |\n|---|---|---|---|\n| **Enjeu négatif / erreur** | Aversion à la perte (on craint plus de perdre que gagner) | « La mention légale oubliée qui rend ta facture invalide » | « Pourquoi ton ventilateur te réveille la nuit (et le fait empirer) » |\n| **Curiosité / gap** | Boucle ouverte (besoin de clôture) | « J'ai facturé 200 clients sans logiciel de compta. Voilà comment. » | « Le seul truc qui m'a permis de dormir pendant la canicule » |\n| **Contre-intuitif** | Violation d'attente = pattern interrupt | « Arrête d'envoyer des factures PDF. » | « Les ventilos sont une arnaque. Fais ça à la place. » |\n| **Spécificité chiffrée** | Concret = crédible + pertinent | « Une facture conforme en 40 secondes, sans compte » | « 3 °C de moins dans ta chambre pour 19 € » |\n| **Preuve / résultat** | Preuve sociale + curiosité sur le « comment » | « Ce freelance a été payé 2× plus vite en changeant une ligne » | — |\n| **Question ciblée** | Auto-identification (« c'est moi ») | « Tu es auto-entrepreneur et tu factures encore sur Word ? » | « Tu transpires la nuit même fenêtre ouverte ? » |\n\n⚠️ La **question plate** (« Tu veux gagner du temps ? ») est le hook par défaut de 80 % des débutants\net il est faible : trop générique, aucune tension, coût de réponse « bof ». La question ne marche que\nsi elle est *ultra-ciblée* et touche un point vif (colonne de droite).\n\n## 3. Pourquoi le spécifique bat le joli\n\nLe cerveau, en 2 s, ne juge pas la beauté — il juge **la pertinence et la crédibilité**. Deux\ndétecteurs tournent en tâche de fond :\n- « Est-ce pour moi ? » → la spécificité (« auto-entrepreneur », « facture sur Word », « la nuit »)\n  déclenche l'auto-identification. Le générique (« gagne du temps ») est filtré comme du bruit pub.\n- « Est-ce vrai ? » → un chiffre/détail concret (« 40 secondes », « 4 000 € », « 3 °C ») signale que\n  tu sais de quoi tu parles. Le vague signale l'inverse.\n\nDonc entre « Simplifie ta facturation » (joli, lisse, mort) et « La mention TVA que 8 auto-entrepreneurs\nsur 10 oublient sur leurs factures » (brut, spécifique, vivant), le second gagne — toujours. **Règle :\nau moindre doute, ajoute un détail concret et retire un adjectif.**\n\n## 4. La partie ⚡ (valide au 17/07/2026)\n\nLe poids du hook a *augmenté* en 2026 : les feeds courts jugent la rétention/complétion et la fenêtre\n« vu vs balayé » sur ~2 s (fiche 04). Autrement dit, l'intemporel (un bon hook a toujours compté) est\naujourd'hui *sur-pondéré* par les algorithmes. Le hook n'a jamais autant décidé du sort d'un contenu.\nÇa peut changer (d'où le `⚡`), mais la direction est nette et partagée par toutes les plateformes.\n\nDeuxième point volatile : le hook doit désormais aussi préparer le **partage** (fiche 09). Un hook du\ntype « envoie ça à un pote qui… » ou qui rend le contenu *utile-à-transmettre* aligne la psycho (boucle\nouverte) avec le signal algo le plus fort de 2026 (le send).\n\n## Explique-moi (Feynman)\n\nReprends « Simplifie ta facturation ». En une phrase, explique *pourquoi* c'est faible en utilisant\nles mots « auto-identification » et « détecteur de crédibilité », puis corrige-la en ajoutant un\ndétail concret.\n\n## Quiz génératif\n\n1. Écris la formule Hook = ? × ? × ?, et donne un hook où la **Clarté** est à zéro même si Tension et\n   Spécificité sont fortes.\n2. Transforme la question plate « Tu veux gagner du temps sur ta compta ? » en hook fort, sans poser\n   de question.\n3. Pour la boutique : écris un hook « contre-intuitif » et explique quelle attente il viole.\n4. Pourquoi, dans les 2 premières secondes, le cerveau ne juge-t-il pas la beauté ? Que juge-t-il ?\n5. En quoi le poids du hook est-il un exemple parfait d'intemporel *sur-pondéré* par un facteur\n   volatile ?\n\n## Cartes de rappel → `revision-espacee.md`\n\n- Hook = Tension × Spécificité × Clarté (un facteur à 0 = tout à 0).\n- Les 2 détecteurs des 2 s : « c'est pour moi ? » (spécificité) et « c'est vrai ? » (concret/chiffre).\n- Règle de correction : +1 détail concret, −1 adjectif.\n- La question plate est le hook par défaut faible ; elle ne marche qu'ultra-ciblée sur un point vif.\n"},{"id":"04","kind":"fiche","num":"04","title":"Feeds courts : le moteur commun (TikTok / Reels / Shorts)","group":"Parcours (ordre conseillé)","icon":"🧠","tag":"Théorie","timeless":false,"volatile":true,"md":"# Fiche 04 — Feeds courts : le moteur commun (TikTok / Reels / Shorts)\n\n- **Type :** 🧠 Théorie · **Nature :** ⚡ VOLATILE (valide au : 17/07/2026 — re-vérifier tous les 2–3 mois, voir `mise-a-jour.md`) · **Durée :** ~1 h · **Prérequis :** Fiches 01, 03\n- **Terrain :** —\n\n## Objectifs\n\n1. Décrire le squelette commun aux 3 plateformes de vidéo courte en 2026.\n2. Savoir quel signal viser en priorité selon l'étape de vie d'une publication.\n3. Éviter les 3 comportements qui déclenchent un down-rank.\n\n## 1. Le squelette commun (2026)\n\nTikTok, Instagram Reels et YouTube Shorts ont convergé vers **le même pipeline** :\n\n```\n1. Tu publies.\n2. TEST : la plateforme montre à une petite audience de départ\n   (TikTok : d'abord tes abonnés ; Shorts : un petit seed du feed).\n3. Elle mesure la RÉTENTION : complétion, temps de visionnage, \"vu vs balayé\" (2 s).\n4. Si les signaux tiennent → élargissement par PALIERS successifs.\n   Si non → la diffusion s'arrête (le contenu \"meurt\").\n5. Aux paliers suivants, les signaux de PARTAGE (send/share/save) décident\n   de la vitesse et de l'ampleur.\n```\n\nRepères chiffrés cités par les analyses d'agences 2026 (⚠️ estimations, pas officiels) : TikTok vise\nune complétion ~70 % ; Shorts, un ratio « vu vs balayé » ~70/30 pour le territoire viral et sanctionne\nun swipe précoce > 40 % dans les 2 s. **Conclusion identique partout : sans rétention initiale, rien\nd'autre ne compte.** Ton hook (fiche 03) n'est pas « important » — il est le *goulot* par lequel tout\npasse.\n\n## 2. Le cycle de vie d'une publication (et quel signal viser quand)\n\n| Étape | Ce que l'algo regarde | Ce que tu optimises |\n|---|---|---|\n| **0–2 s** | Vu vs balayé | Le hook : casser la transe + promesse (fiches 01, 03) |\n| **2 s → fin** | Rétention, complétion, rewatch | Le rythme : pas de temps mort, une boucle refermée à la fin, boucle « seamless » qui invite au rewatch |\n| **Post-visionnage** | Partages (send DM), enregistrements, commentaires | Le « pourquoi je l'envoie » : utilité, punchline, identification (fiche 09) |\n| **Paliers J+1 → J+... ** | Reprise d'engagement dans la durée | Répondre aux commentaires, relancer ; certains contenus « ressuscitent » des jours après |\n\nHiérarchie des signaux en 2026 (du plus fort au plus faible, direction consensuelle) :\n**rétention/complétion ≈ partage (send) > enregistrement > commentaire > like.** Le like est en bas.\nOn ne conçoit donc plus « pour faire liker ».\n\n## 3. Ce qui déclenche un down-rank (à ne pas faire)\n\nLes plateformes disent explicitement pénaliser :\n1. **Reposts filigranés** (une vidéo TikTok avec le watermark TikTok postée sur Reels, etc.) → poste\n   du natif, sans watermark d'une autre plateforme.\n2. **Contenu qui « sent le mass-produit »** : basse originalité, recyclage évident, IA générique non\n   retravaillée (fiche 19). Le contenu original est complété à un taux bien supérieur — ce que l'algo\n   voit.\n3. **Le hook menteur** (fiche 01) : un interrupt gratuit qui ne tient pas sa promesse → rétention qui\n   s'effondre à la 3e seconde → l'algo enterre. Pire que pas de hook.\n\n## 4. Ce que ça change pour tes deux terrains\n\n- **Boutique canicule (B2C) :** c'est ton canal principal. Le produit doit apparaître *en action*\n  vite (démonstration = rétention). Format gagnant type : problème visible (transpiration, nuit\n  chaude) → produit → résultat, avec un hook contre-intuitif ou à enjeu négatif. Conçois la fin pour\n  le *send* (« envoie ça à quelqu'un qui crève de chaud »).\n- **InvoiceLab (B2B/freelance) :** la vidéo courte marche aussi (démo de rapidité : « facture conforme\n  en 40 s, sans compte »), mais ton canal de fond reste LinkedIn/X (fiches 22–23). Sur les feeds\n  courts, mise sur l'utilité concrète partageable entre freelances.\n\n## 5. Ce qui est intemporel là-dedans (à ne pas confondre)\n\nLe pipeline exact et les seuils (70 %, 40 %) sont `⚡` : ils bougeront. Ce qui est `⏳` sous cette\nfiche : **« l'attention se gagne seconde par seconde et la rétention est le juge »** — ça, aucun\nchangement d'algo ne l'annulera, parce que ça découle de la rareté de l'attention (fiche 01), pas\nd'un choix de produit. Apprends le principe ; re-vérifie les seuils.\n\n## Explique-moi (Feynman)\n\nExplique à voix haute pourquoi « avoir beaucoup d'abonnés » ne garantit pas la portée d'une vidéo sur\nces plateformes en 2026, en utilisant les mots « test », « rétention » et « paliers ».\n\n## Quiz génératif\n\n1. Une vidéo fait 50 000 vues mais 3 partages ; une autre 8 000 vues et 400 partages. Laquelle l'algo\n   va-t-il probablement pousser plus loin ensuite, et pourquoi ?\n2. Tu postes ta vidéo TikTok telle quelle sur Reels et elle fait un flop. Donne une cause probable\n   liée à cette fiche.\n3. Classe ces signaux du plus au moins fort en 2026 : like, send DM, complétion, commentaire.\n4. Pourquoi un « hook menteur » est-il pire qu'un hook faible du point de vue de l'algorithme ?\n5. Quelle partie de cette fiche est `⏳` et laquelle est `⚡` ? Comment traites-tu chacune ?\n\n## Cartes de rappel → `revision-espacee.md`\n\n- Squelette 2026 : publie → test petite audience → rétention → paliers → partage décide l'ampleur.\n- Hiérarchie des signaux : rétention ≈ send > save > commentaire > like.\n- 3 down-ranks : repost filigrané, contenu mass-produit, hook menteur.\n- Intemporel sous la fiche : la rétention est le juge (la rareté de l'attention ne changera pas).\n"},{"id":"05","kind":"fiche","num":"05","title":"Écrire 10 hooks (InvoiceLab)","group":"Parcours (ordre conseillé)","icon":"🛠️","tag":"Pratique","timeless":true,"volatile":false,"md":"# Fiche 05 — Écrire 10 hooks (InvoiceLab) 🛠️\n\n- **Type :** 🛠️ Pratique · **Nature :** ⏳ Intemporel (méthode) · **Durée :** ~1 h · **Prérequis :** Fiches 01, 03, 04\n- **Terrain :** InvoiceLab\n\n## L'exercice\n\nTu as vu la théorie de l'attention (01), l'anatomie du hook (03) et le moteur des feeds (04).\nMaintenant tu **produis sous contrainte** — c'est là que la compétence se construit.\n\n**Objectif :** écrire **10 hooks** pour **une seule** fonctionnalité/angle d'InvoiceLab, en variant\ndélibérément les *types* de la fiche 03. Puis auto-noter, garder les 3 meilleurs, expliquer pourquoi.\n\n### La contrainte (importante)\n\nChoisis **un seul angle** d'InvoiceLab et écris tes 10 hooks dessus. Exemples d'angle :\n- « factures conformes (mentions légales FR) sans rien y connaître » ;\n- « 100 % client-side / tes données ne partent jamais » ;\n- « facture prête en 40 secondes, sans créer de compte » ;\n- « passer de Word/Excel à un vrai outil gratuit ».\n\nÉcrire 10 hooks sur *un* angle > 10 hooks sur 10 angles : ça force la variété *de forme* (le vrai\nmuscle) au lieu de la fuite vers un nouveau sujet à chaque fois.\n\n### Les règles\n\n1. **Couvre au moins 5 des 6 types** de la fiche 03 (enjeu négatif, curiosité/gap, contre-intuitif,\n   spécificité chiffrée, preuve/résultat, question ultra-ciblée).\n2. **Au moins 3 hooks** doivent contenir un **détail concret ou un chiffre** (règle « +1 détail,\n   −1 adjectif »).\n3. **Au moins 1 hook** doit être pensé pour le **partage** (« envoie ça à un freelance qui… »).\n4. Interdits : « Gagne du temps », « Simplifie ta vie », « Le meilleur outil pour… », toute formule\n   qui pourrait décrire n'importe quel concurrent. Si un concurrent peut coller son nom dessus sans\n   changer un mot, c'est raté.\n\n### Le format à rendre\n\nUn tableau :\n\n| # | Type (fiche 03) | Hook (verbatim) | Auto-note /8* | Pour le send ? |\n|---|---|---|---|---|\n\n*Auto-note /8 = Tension (0-2) + Spécificité (0-2) + Clarté (0-2) + Promesse tenable (0-2), comme\nfiche 02.\n\nPuis, en dessous :\n- **Top 3** avec, pour chacun, *une phrase* : quel levier le rend fort.\n- **Le pire des 10**, et la seule correction qui le sauverait.\n\n## Grille de notation de TON livrable (/20)\n\n| Axe | Ce que je regarde |\n|---|---|\n| **Spécificité** | Combien de tes 10 survivent au test « un concurrent peut-il coller son nom dessus ? ». Vise 8+. |\n| **Mécanique** | Vraie variété de types (pas 10 variantes du même) + usage correct de tension/curiosité/enjeu. |\n| **Clarté** | Chaque hook lisible en < 2 s, une idée. |\n| **Adéquation** | Les hooks exploitent un vrai atout d'InvoiceLab (client-side, gratuit, conformité FR, rapidité) et parlent au vrai freelance FR. |\n\nColle le tout dans `journal-de-progression.md`. Je note, je démonte les faibles, je te montre comment\nje réécrirais 2–3 d'entre eux pour que tu voies l'écart.\n\n## Anti-triche (pratique délibérée)\n\n- Écris les 10 **d'affilée sans t'auto-censurer**, puis note *ensuite*. Noter en écrivant tue le\n  volume et donc la variété.\n- Si tu bloques après 5, c'est normal : les hooks 6–10 (les plus durs) sont ceux qui musclent\n  vraiment. Ne t'arrête pas à 5 « corrects ».\n- Ne demande pas à une IA de les écrire à ta place. Tu peux lui demander de *critiquer* les tiens\n  après coup (fiche 21), mais le rep doit être le tien, sinon tu n'apprends rien.\n\n## Explique-moi (Feynman)\n\nAvant de rendre : prends ton hook n°1 et ton pire hook, et explique à voix haute *ce qui les\nsépare*, en une phrase, sans le mot « mieux ». Si la seule différence que tu trouves est « il est\nmieux », tu n'as pas encore l'œil — relis la fiche 03 §3.\n\n## Cartes de rappel → `revision-espacee.md`\n\n- Test anti-générique : « un concurrent peut-il coller son nom dessus sans rien changer ? » → si oui, jeter.\n- Produire d'abord (volume, sans censure), noter ensuite.\n- Les hooks 6–10 sont ceux qui musclent (ne pas s'arrêter aux 5 faciles).\n"},{"id":"06","kind":"fiche","num":"06","title":"Copywriting direct-response 1 : PAS & AIDA","group":"Parcours (ordre conseillé)","icon":"🧠","tag":"Théorie","timeless":true,"volatile":false,"md":"# Fiche 06 — Copywriting direct-response 1 : PAS & AIDA\n\n- **Type :** 🧠 Théorie · **Nature :** ⏳ Intemporel · **Durée :** ~1 h · **Prérequis :** Fiches 01, 03\n- **Terrain :** —\n\n## Objectifs\n\n1. Distinguer copywriting *direct-response* (fait agir) de copywriting *de marque* (fait mémoriser).\n2. Maîtriser deux structures qui ne périment jamais : **PAS** et **AIDA**.\n3. Savoir laquelle utiliser selon la température de l'audience.\n\n## 1. Direct-response vs branding\n\nLe **direct-response (DR)** vise une action *maintenant* : cliquer, s'inscrire, acheter, partager.\nOn peut le mesurer. C'est ce dont tu as besoin (petit budget, ROI direct). Le copywriting de **marque**\nvise la mémorisation à long terme (Coca, Nike) — luxe de gros budgets. Toute ta formation penche DR.\n\nPrincipe DR fondateur : **une pièce = une action.** Si ton post demande à la fois de liker, de\ns'abonner, de cliquer le lien et de commenter, il n'obtient rien. Choisis LE prochain pas et\nsupprime le reste.\n\n## 2. PAS — Problème · Agitation · Solution\n\nLa structure la plus efficace pour du contenu court et de la vente.\n\n- **Problème :** nomme précisément la douleur du lecteur (pas la tienne). « Tu factures encore sur\n  Word et tu refais la mise en page à chaque client. »\n- **Agitation :** enfonce le clou — conséquences, émotions, coût caché. « Résultat : 20 min perdues\n  par facture, une TVA oubliée un jour sur deux, et l'air pas pro devant un gros client. »\n- **Solution :** ton produit comme la sortie évidente. « InvoiceLab : facture conforme en 40 s,\n  gratuit, sans compte. »\n\nPourquoi ça marche : l'**aversion à la perte** (fiche 13) rend la douleur plus motrice que le gain.\nOn ne vend pas un aspirateur, on vend une maison qui n'est plus sale. L'agitation est l'étape que les\ndébutants sautent — et c'est celle qui fait la différence entre « intéressant » et « il me faut ça ».\n\n⚠️ Ligne éthique : agiter une douleur **réelle** = service. Inventer/exagérer une peur = manipulation\nqui se retourne (fiche 14). Agite ce qui est vrai.\n\n## 3. AIDA — Attention · Intérêt · Désir · Action\n\nStructure plus longue (page de vente, script vidéo, thread).\n\n- **Attention :** le hook (fiche 03).\n- **Intérêt :** pourquoi ça le concerne *lui*, maintenant (pertinence, nouveauté).\n- **Désir :** la transformation, la preuve, la projection (« imagine ne plus jamais… »).\n- **Action :** un seul appel, explicite et à friction minimale.\n\nAIDA et PAS ne s'opposent pas : PAS est souvent la façon de générer l'*Intérêt/Désir* dans un AIDA.\n\n## 4. Quelle structure quand ? (température de l'audience)\n\n| Audience | État d'esprit | Structure |\n|---|---|---|\n| **Froide** (ne te connaît pas, ne cherche rien) | Indifférente | PAS — il faut d'abord réveiller le problème |\n| **Tiède** (conscient du problème) | « ça m'intéresse » | AIDA — nourrir le désir + preuve |\n| **Chaude** (te connaît, prête à agir) | « convaincs-moi vite » | Offre directe + action (fiches 10-12) |\n\nErreur classique : parler à une audience froide comme si elle était chaude (« Achète maintenant ! »\nà quelqu'un qui ignore qu'il a un problème). Sur les réseaux, ton audience est presque toujours\n**froide** → PAS est ton réflexe par défaut.\n\n## Explique-moi (Feynman)\n\nPrends un produit banal (une gourde). Vends-le en PAS à voix haute, en insistant sur l'étape\n*Agitation*. Si tu sautes directement du problème à la solution, tu viens d'illustrer l'erreur n°1.\n\n## Quiz génératif\n\n1. Écris un PAS complet (3 phrases) pour le produit canicule, avec une vraie étape d'agitation.\n2. Ton audience TikTok ne te connaît pas et ne cherche pas de logiciel de facture. Chaude, tiède ou\n   froide ? Quelle structure, et pourquoi ?\n3. Pourquoi « une pièce = une action » ? Que se passe-t-il si tu demandes 4 actions ?\n4. Où est la ligne entre *agiter* (ok) et *manipuler* (pas ok) à l'étape Agitation ?\n\n## Cartes de rappel → `revision-espacee.md`\n\n- DR = une pièce, une action, mesurable. Sur les réseaux l'audience est froide par défaut.\n- PAS : l'Agitation est l'étape que tout le monde saute et qui fait tout.\n- AIDA pour le format long ; choisir la structure selon la température (froid → PAS).\n"},{"id":"07","kind":"fiche","num":"07","title":"Copywriting direct-response 2 : spécificité, une idée, preuve","group":"Parcours (ordre conseillé)","icon":"🧠","tag":"Théorie","timeless":true,"volatile":false,"md":"# Fiche 07 — Copywriting direct-response 2 : spécificité, une idée, preuve\n\n- **Type :** 🧠 Théorie · **Nature :** ⏳ Intemporel · **Durée :** ~1 h · **Prérequis :** Fiche 06\n- **Terrain :** —\n\n## Objectifs\n\n1. Appliquer la règle « une idée par pièce » et la reconnaître quand tu la violes.\n2. Remplacer le vague par du concret de façon systématique.\n3. Choisir la bonne preuve pour tuer le scepticisme.\n\n## 1. Une seule idée dominante\n\nUn contenu qui dit trois choses ne dit rien. Le lecteur ne retient qu'une idée par pièce — ton\ntravail est de **choisir laquelle** au lieu de la laisser au hasard. Avant de publier, teste :\n« Si la personne ne retient qu'une phrase, laquelle je veux que ce soit ? » Si tu ne peux pas\nrépondre, tu as trop d'idées → découpe en plusieurs posts (bonus : plus de contenu, fiche 25).\n\n## 2. La spécificité : la compétence sous-estimée n°1\n\nLe vague est le péché mortel du copywriting. « Rapide, simple, efficace, professionnel » ne veut\nrien dire car tout le monde le dit → le cerveau filtre (fiche 03). Le concret, lui, **prouve** et\n**se voit**.\n\n| Vague (mort) | Concret (vivant) |\n|---|---|\n| « Fais tes factures rapidement » | « Facture prête en 40 secondes » |\n| « Tes données sont en sécurité » | « Tes données ne quittent jamais ton navigateur » |\n| « Reste au frais cet été » | « 3 °C de moins dans ta chambre pour 19 € » |\n| « Beaucoup de freelances l'utilisent » | « 1 200 auto-entrepreneurs l'ont utilisé ce mois-ci » |\n\n**Méthode :** pour chaque phrase, demande « prouve-le / combien / lequel / à quel point ? » et\nremplace l'adjectif par la réponse. Règle de la fiche 03 généralisée : **−1 adjectif, +1 fait.**\n\n⚠️ Les chiffres doivent être **vrais**. Un chiffre inventé qui se voit (ou qu'un commentaire\ndémonte) détruit la confiance — et sur les réseaux, ça se voit vite.\n\n## 3. La preuve : désamorcer le « c'est du pipeau »\n\nChaque promesse déclenche un scepticisme silencieux (« ouais, c'est ce qu'ils disent tous »). La\npreuve le désamorce. Par ordre de force perçue :\n\n1. **Démonstration en direct** — montrer > dire. Une vidéo de la facture générée en 40 s bat 100\n   adjectifs. (C'est *le* format roi sur les feeds courts.)\n2. **Preuve sociale spécifique** — un témoignage nommé et détaillé > « nos clients adorent » (fiche 13).\n3. **Chiffres/données** — mesurables et vérifiables.\n4. **Démontage de l'objection** — nommer soi-même le doute (« sans compte, c'est louche ? Voilà\n   pourquoi c'est justement plus sûr ») désarme le lecteur.\n\n## 4. Concision : couper tue moins que garder\n\nEn DR, chaque mot inutile est un point de fuite. Après un premier jet, **coupe 20 %** : adverbes,\n« vraiment », « un peu », phrases de réchauffement (« Dans cet article on va voir… »). Ce qui reste\nest plus fort. Le premier jet sert à penser ; l'édition sert à vendre.\n\n## Explique-moi (Feynman)\n\nPrends la phrase « InvoiceLab est un outil simple et efficace pour gérer votre facturation\nprofessionnelle. » Réécris-la à voix haute en appliquant les 3 règles (une idée, spécificité, coupe).\nCompte les adjectifs avant/après.\n\n## Quiz génératif\n\n1. Transforme « Notre produit rafraîchit efficacement votre intérieur » en version concrète et\n   prouvable.\n2. On te dit « facture en 40 secondes » et tu penses « mouais ». Quelle est la preuve la plus forte\n   pour te faire taire, et pourquoi elle bat un témoignage ?\n3. Pourquoi un contenu qui dit 3 choses est-il plus faible qu'un contenu qui en dit une ?\n4. Applique « coupe 20 % » à une phrase que tu as écrite récemment.\n\n## Cartes de rappel → `revision-espacee.md`\n\n- Une idée par pièce : « si on ne retient qu'une phrase, laquelle ? »\n- −1 adjectif / +1 fait ; les chiffres doivent être vrais.\n- Hiérarchie de preuve : démonstration > témoignage spécifique > chiffre > démontage d'objection.\n- Après le 1er jet : couper 20 %.\n"},{"id":"08","kind":"fiche","num":"08","title":"Réécrire un hero + une fiche produit","group":"Parcours (ordre conseillé)","icon":"🛠️","tag":"Pratique","timeless":true,"volatile":false,"md":"# Fiche 08 — Réécrire un hero + une fiche produit 🛠️\n\n- **Type :** 🛠️ Pratique · **Nature :** ⏳ Intemporel · **Durée :** ~1 h · **Prérequis :** Fiches 06, 07\n- **Terrain :** InvoiceLab **et** boutique\n\n## L'exercice\n\nTu appliques PAS/AIDA + spécificité + preuve sur du vrai texte de conversion.\n\n**Deux livrables :**\n\n### A. Le hero d'InvoiceLab (le haut de la landing)\n\nÉcris : **1 titre (headline)**, **1 sous-titre**, **1 bouton (CTA)**. Contraintes :\n- Le titre respecte « une idée » + spécificité (un bénéfice concret, pas « la facturation\n  réinventée »).\n- Le sous-titre lève la principale objection OU ajoute la preuve/le concret.\n- Le CTA = une seule action, verbe d'action, friction minimale (« Créer ma facture — sans compte »\n  bat « En savoir plus »).\n- Produis **2 versions** du trio (deux angles différents) pour pouvoir comparer/tester (fiche 31).\n\n### B. Une fiche produit de la boutique canicule\n\nStructure **PAS** en 4–6 phrases :\n- Problème (la nuit chaude, l'inconfort précis).\n- Agitation (conséquence réelle : mal dormir, être crevé au boulot).\n- Solution (le produit, en montrant *comment* il résout).\n- + 1 élément de **preuve** (démonstration décrite, chiffre, ou objection démontée).\n- Termine par 1 CTA.\n\n## Grille de notation (/20 par livrable)\n\n| Axe | Ce que je regarde |\n|---|---|\n| **Spécificité** | Adjectifs remplacés par du concret ? Test « un concurrent peut-il copier-coller ? » |\n| **Mécanique** | Structure PAS/AIDA respectée ? Agitation présente ? Une seule action au CTA ? |\n| **Clarté** | Une idée dominante par bloc, lisible en un coup d'œil ? |\n| **Adéquation** | Vrais atouts (client-side, gratuit, conformité FR / bénéfice réel du produit canicule) ? |\n\nColle A et B dans `journal-de-progression.md`. Je note chacun, et je te réécris le hero le plus faible\npour que tu voies le levier que tu as manqué.\n\n## Anti-triche\n\n- Écris d'abord **sans regarder** un concurrent, pour ne pas copier son vague. Tu compareras après.\n- Pour le hero : écris 5 titres, garde les 2 meilleurs. Ne t'arrête pas au premier « correct ».\n- Interdits (fiche 07) : simple, efficace, rapide, professionnel, innovant — sauf si suivis\n  immédiatement d'une preuve concrète.\n\n## Explique-moi (Feynman)\n\nAvant de rendre : lis ton titre à voix haute et demande « est-ce que ça pourrait être le titre de\nn'importe quel concurrent ? ». Si oui, tu n'as pas encore trouvé l'angle — ajoute le détail qui n'est\nvrai que pour InvoiceLab.\n\n## Cartes de rappel → `revision-espacee.md`\n\n- Hero = 1 idée + spécificité + CTA à une seule action et friction minimale.\n- Fiche produit = PAS + 1 preuve + 1 CTA.\n- Toujours 2 versions pour pouvoir tester (fiche 31).\n"},{"id":"09","kind":"fiche","num":"09","title":"Concevoir pour le partage (le « send »)","group":"Parcours (ordre conseillé)","icon":"🧠","tag":"Théorie","timeless":false,"volatile":true,"md":"# Fiche 09 — Concevoir pour le partage (le « send »)\n\n- **Type :** 🧠 Théorie · **Nature :** ⚡ VOLATILE (valide au : 17/07/2026 — re-vérifier tous les 2–3 mois) · **Durée :** ~1 h · **Prérequis :** Fiches 01, 04\n- **Terrain :** —\n\n## Objectifs\n\n1. Comprendre pourquoi le partage privé (send DM) est devenu le signal roi en 2026.\n2. Connaître les 6 moteurs psychologiques du partage.\n3. Savoir *fabriquer* un contenu « à envoyer », pas juste espérer qu'on le partage.\n\n## 1. Pourquoi le send a détrôné le like (rappel + mécanisme)\n\nEn 2026, Instagram traite les **sends en DM** comme le signal de distribution le plus fort des Reels ;\nTikTok pondère partages et enregistrements au-dessus des likes (fiche 04). Raison de fond, et elle\nest solide : **un partage d'humain à humain est le signal le plus dur à truquer.** Un like coûte zéro\net ne veut presque rien dire ; envoyer un contenu à quelqu'un engage ta réputation (« regarde ça »)\n→ c'est la preuve la plus fiable que le contenu a de la valeur. Les plateformes optimisent donc pour\nlui. Ce *pourquoi* est plus stable que les poids exacts (d'où : principe ⏳ sous une fiche ⚡).\n\nConséquence de conception : la question n'est plus « est-ce que ça va plaire ? » mais **« qui va\nl'envoyer à qui, et pourquoi ? ».** Si tu ne peux pas répondre avant de publier, le contenu ne\ncirculera pas.\n\n## 2. Les 6 moteurs du partage (pourquoi les gens envoient)\n\nD'après la recherche sur le « social currency » (pourquoi on partage), on envoie un contenu quand il :\n\n1. **Nous rend malin/utile** — « tu vas m'être reconnaissant » (astuce, info rare). *Ex :* « La\n   mention TVA que 8 auto-entrepreneurs sur 10 oublient. » → un freelance l'envoie à un autre.\n2. **Nous exprime** — « ça dit qui je suis / ce que je pense » (opinion, valeurs, identité).\n3. **Crée du lien** — « ça nous concerne, toi et moi » (blague de niche, galère commune). *Ex :* « POV :\n   il fait 34 °C dans ta chambre et ton ventilo brasse de l'air chaud. » → on tague le coloc.\n4. **Provoque une émotion forte** — l'émotion *à haute activation* (surprise, indignation, joie,\n   émerveillement) se partage ; la tristesse molle ou l'ennui, non.\n5. **A une utilité pratique** — on partage ce qui *aide* (guide, comparatif, checklist).\n6. **Raconte une histoire** — on transmet un récit plus qu'un argument (fiche 16).\n\n## 3. Fabriquer le send (techniques)\n\n- **L'appel explicite au tag/send** : « Envoie ça à un freelance qui facture encore sur Word. »\n  Simple, efficace — mais n'en abuse pas, ça s'use.\n- **Le contenu-outil** : rends-le *si* utile qu'on le garde/l'envoie comme référence (checklist des\n  mentions légales d'une facture FR, mini-guide « 5 gestes anti-canicule »).\n- **Le miroir d'identité** : « les 3 types de freelances face à leur compta » → on s'y reconnaît et\n  on tague celui qui est « le type 2 ».\n- **La punchline partageable** : une phrase si nette qu'on la cite. La fin de la vidéo compte autant\n  que le hook pour le send.\n- **Le contenu « débat »** : une opinion tranchée (défendable) déclenche l'envoi (« t'es d'accord\n  avec ça, toi ? »).\n\n## 4. Ce que ça change pour tes terrains\n\n- **Boutique canicule :** joue moteurs 3 (lien : la galère commune de la chaleur) et 4 (émotion :\n  soulagement/surprise de la démo). Fin de vidéo → « tague quelqu'un qui crève de chaud ».\n- **InvoiceLab :** joue moteurs 1 (utile entre pairs) et 2 (identité de freelance qui « gère »).\n  Le contenu-outil (checklist conformité) est ton meilleur véhicule de send.\n\n## Explique-moi (Feynman)\n\nExplique en 2 phrases pourquoi un like « ne vaut presque rien » pour l'algorithme alors qu'un send\n« vaut cher », sans parler de coefficients — juste avec l'idée de « signal difficile à truquer ».\n\n## Quiz génératif\n\n1. Avant de publier, quelle question dois-tu pouvoir répondre pour espérer que ça circule ?\n2. Associe un moteur de partage à un contenu concret
